---
# Cuts a SemVer git tag + GitHub Release on every push to main, based on the
# Conventional Commit history (feat -> minor, fix -> patch, ! / BREAKING -> major).
# Tags are what clusters pin their ArgoCD targetRevision to, so merging to main
# no longer silently changes deployed state — promotion is a deliberate tag bump.
name: release

on:
  push:
    branches:
      - main

permissions:
  contents: write       # create tags + releases
  issues: write         # semantic-release success/fail comments
  pull-requests: write  # semantic-release PR comments

# Never run two releases concurrently — they would race on the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history so commit-analyzer sees every commit
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Both majors are PINNED on purpose. Unpinned, npx resolved
        # conventional-changelog-conventionalcommits to v10, which needs
        # conventional-changelog-writer@9+, while semantic-release@25 ships
        # @semantic-release/release-notes-generator@14 -> writer@8. The
        # preset then fails plugin validation with `Missing helper: ...`
        # and no tag is cut at all -- silently, because the job failure
        # looks like any other red run and nothing downstream complains.
        # Bump these two together, never one alone.
        run: >-
          npx --yes
          -p semantic-release@25
          -p conventional-changelog-conventionalcommits@8
          semantic-release
