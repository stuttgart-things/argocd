{{- if .Values.externalSecrets.enabled }}
{{- $defaultName := printf "kube-prometheus-stack-%s" (sha1sum .Values.destination.server | trunc 8) }}
{{- $appName := .Values.applicationName | default $defaultName }}
{{- $es := .Values.externalSecrets }}
{{- $secretsValues := dict
      "namespace" .Values.destination.namespace
      "secretStore" $es.secretStore
      "remoteKey" $es.remoteKey
      "grafana" (dict
        "enabled" (and .Values.grafana.enabled (ne (.Values.grafana.adminSecret | default "") ""))
        "targetName" (.Values.grafana.adminSecret | default "unused")
        "userProperty" $es.grafanaAdminUserProperty
        "passwordProperty" $es.grafanaAdminPasswordProperty)
      "webhook" (dict
        "enabled" (and .Values.alertmanager.enabled .Values.alertmanager.webhook.enabled)
        "targetName" .Values.alertmanager.webhook.tokenSecret
        "tokenProperty" $es.webhookTokenProperty
        "remoteKey" ($es.webhookRemoteKey | default ""))
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-secrets" $appName | quote }}
  namespace: argocd
  annotations:
    # Ahead of the stack: Grafana and Alertmanager mount these Secrets.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: infra/kube-prometheus-stack/secrets
    helm:
      releaseName: kube-prometheus-stack-secrets
      valuesObject:
        {{- toYaml $secretsValues | nindent 8 }}
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
