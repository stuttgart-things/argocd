---
# Namespace the ExternalSecrets and their target Secrets live in — the one
# kube-prometheus-stack runs in.
namespace: monitoring

secretStore:
  kind: ClusterSecretStore
  name: vault-cluster

# Entry name under the store's mount, flat.
remoteKey: monitoring

# Target `grafana.adminSecret` of the install chart: keys admin-user and
# admin-password.
grafana:
  enabled: true
  targetName: kube-prometheus-stack-grafana-admin
  userProperty: grafana-admin-user
  passwordProperty: grafana-admin-password

# Target `alertmanager.webhook.tokenSecret` of the install chart: key token.
webhook:
  enabled: true
  targetName: kube-prometheus-stack-alertmanager-webhook
  tokenProperty: alertmanager-webhook-token

# Inert pass-through so the catalog verifier's probe values validate.
destination: {}
