{{- if .Values.notify.enabled }}
{{- $n := .Values.notify }}
{{- $c := required "cluster is required with notify.enabled" .Values.cluster }}
{{- $base := required "notify.url is required with notify.enabled" $n.url | trimPrefix "https://" | trimPrefix "http://" }}
{{- $scheme := ternary "http" "https" (hasPrefix "http://" $n.url) }}
---
# KURED_NOTIFY_URL for kured: a shoutrrr (v0.8.0) generic URL to the central
# omni-pitcher. Query values are URL-encoded ('+' is a space, %3D an '='):
# shoutrrr reads them with url.ParseQuery. `@…` become request headers, `$…`
# extra JSON fields next to `message`.
#
# Tested against shoutrrr v0.8.0 (kured 1.23.0's), two traps:
# - `generic://host/path`, NOT `generic+https://…`: with the custom scheme
#   shoutrrr passes `template=json` on to the target instead of reading it,
#   and the body is the bare message text. generic:// is HTTPS unless
#   disabletls=yes.
# - the title as `$title`: the `title=` prop never reaches the JSON body, and
#   omni-pitcher rejects a message without one.
# Body: {"title","message","system":"kured","author":"kured-<cluster>",
#        "severity","tags":"kured,cluster=<cluster>"}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $n.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ $n.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $n.secretStore.kind | quote }}
    name: {{ $n.secretStore.name | quote }}
  target:
    name: {{ $n.secretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        url: {{ printf "generic://%s?%s@Authorization=Bearer+{{ .token | urlquery }}&template=json&$title=kured+%s&$system=kured&$author=kured-%s&$severity=%s&$tags=kured,cluster%%3D%s" $base (ternary "disabletls=yes&" "" (eq $scheme "http")) $c $c $n.severity $c | quote }}
  data:
    - secretKey: token
      remoteRef:
        key: {{ $n.remoteKey | quote }}
        property: {{ $n.property | quote }}
{{- end }}
