{{- range .Values.namespaces }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.targetName | quote }}
  namespace: {{ . | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $.Values.secretStore.kind | quote }}
    name: {{ $.Values.secretStore.name | quote }}
  target:
    name: {{ $.Values.targetName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: {{ $.Values.remoteKey | quote }}
        property: {{ $.Values.clientIdProperty | quote }}
    - secretKey: client-secret
      remoteRef:
        key: {{ $.Values.remoteKey | quote }}
        property: {{ $.Values.clientSecretProperty | quote }}
    - secretKey: cookie-secret
      remoteRef:
        key: {{ $.Values.remoteKey | quote }}
        property: {{ $.Values.cookieSecretProperty | quote }}
{{- end }}
