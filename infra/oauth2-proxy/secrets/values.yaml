---
# Namespaces of the proxies; one ExternalSecret each, same target name.
namespaces:
  - monitoring

# Target Secret: keys client-id, client-secret and cookie-secret
# (`secretName` of the install chart).
targetName: oauth2-proxy

secretStore:
  kind: ClusterSecretStore
  name: vault-cluster

# Entry name under the store's mount, flat.
remoteKey: oauth2-proxy

clientIdProperty: oauth2-proxy-client-id
clientSecretProperty: oauth2-proxy-client-secret
cookieSecretProperty: oauth2-proxy-cookie-secret

# Inert pass-through so the catalog verifier's probe values validate.
destination: {}
