{{- if and .Values.externalSecrets.enabled .Values.instances }}
{{- $es := .Values.externalSecrets }}
{{- $namespaces := list }}
{{- range .Values.instances }}
{{- $namespaces = append $namespaces (.namespace | default $.Values.destination.namespace) }}
{{- end }}
{{- $secretsValues := dict
      "namespaces" ($namespaces | uniq)
      "targetName" .Values.secretName
      "secretStore" $es.secretStore
      "remoteKey" $es.remoteKey
      "clientIdProperty" $es.clientIdProperty
      "clientSecretProperty" $es.clientSecretProperty
      "cookieSecretProperty" $es.cookieSecretProperty
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "oauth2-proxy-secrets-%s" (sha1sum .Values.destination.server | trunc 8) | quote }}
  namespace: argocd
  annotations:
    # Ahead of the proxies: they read client and cookie secret from it.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: infra/oauth2-proxy/secrets
    helm:
      releaseName: oauth2-proxy-secrets
      valuesObject:
        {{- toYaml $secretsValues | nindent 8 }}
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
