{{- if .Values.externalSecrets.enabled }}
{{- $defaultName := printf "velero-%s" (sha1sum .Values.destination.server | trunc 8) }}
{{- $appName := .Values.applicationName | default $defaultName }}
{{- $es := .Values.externalSecrets }}
{{- $secretsValues := dict
      "name" "velero-cloud-credentials"
      "namespace" .Values.destination.namespace
      "secretStoreRef" (dict "name" $es.secretStore.name "kind" $es.secretStore.kind)
      "secretPath" $es.remoteKey
      "properties" (dict "accessKey" $es.accessKeyProperty "secretKey" $es.secretKeyProperty)
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-secrets" $appName | quote }}
  namespace: argocd
  annotations:
    # Ahead of velero: the server mounts `cloud-credentials` and does not start
    # without it.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: infra/velero/cloud-credentials
    helm:
      releaseName: velero-cloud-credentials
      valuesObject:
        {{- toYaml $secretsValues | nindent 8 }}
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
