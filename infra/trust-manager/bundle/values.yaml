---
# List of trust-manager Bundles to render. Empty by default — consumers
# define whichever Bundles their cluster needs.
#
# Each entry:
#   name:  Bundle name (cluster-scoped)
#   spec:  raw trust.cert-manager.io/v1alpha1 Bundle spec. See
#          https://cert-manager.io/docs/trust/trust-manager/api-reference/
#          for source types (useDefaultCAs / secret / configMap / inLine)
#          and target types (configMap / secret / additionalFormats).
#
# Source Secrets/ConfigMaps must live in the trust namespace configured
# on the trust-manager install (install/trustNamespace, default
# `cert-manager`).
#
# See README.md for a copy-paste cluster-trust-bundle example combining
# Mozilla's default CAs + the internal cluster CA.
bundles: []

# When set to the string "true" (or boolean true), every Bundle rendered by
# this chart gets an additional `secret: { name: vault-pki-ca, key: ca.crt }`
# source appended. Used by appset-trust-manager-bundle to include the Vault
# PKI root CA on clusters whose gateway certificate is Vault-signed — either
# `network-platform/cert-manager-vault-pki=true` (this AppSet family owns the
# issuer) or the annotation `clusterbook.stuttgart-things.com/wildcard-issuer-name`
# starting with `vault-pki` (the ClusterStack XR created `vault-pki-k8s`
# instead). Without it such a cluster cannot verify its OWN gateway from the
# inside. Default off.
#
# The Secret must exist in the trust namespace: a source pointing at a missing
# Secret makes trust-manager stop syncing the whole Bundle.
includeVaultPkiCa: "false"
