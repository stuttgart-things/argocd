---
# cert-manager ClusterIssuer of type `vault`.
#
# Two authentication methods are supported, selected by `vault.auth.method`:
#
#   token       (default) — a static Vault token in a Secret. The Secret must
#               already exist in the cert-manager namespace, provisioned
#               out-of-band (e.g. by argocd.create-vault-issuer). NOTE: nothing
#               renews that token, so Vault auth breaks once it expires — and
#               the ClusterIssuer keeps reporting Ready=True while every
#               issuance fails. Vault caps token TTLs at 768h by default.
#
#   kubernetes  — cert-manager mints a short-lived ServiceAccount token per
#               request via the TokenRequest API. Nothing expires. Requires a
#               Kubernetes auth mount and role on the Vault side, and a
#               TokenRequest grant for the referenced ServiceAccount.
#
# Prefer `kubernetes`.

# ClusterIssuer name as referenced from `Certificate.spec.issuerRef.name`.
name: vault-pki

vault:
  # Vault server base URL (https://...).
  server: "https://vault.example.com"
  # Vault PKI sign path, e.g. `pki/sign/<role>`.
  path: "pki/sign/example"
  auth:
    # "token" or "kubernetes".
    method: token
    tokenSecretRef:
      # Secret in the cert-manager namespace holding the Vault token.
      name: vault-pki-token
      # Key inside the Secret holding the raw token value.
      key: token
    kubernetes:
      # Vault Kubernetes auth mount, WITH the /v1/auth/ prefix,
      # e.g. "/v1/auth/my-cluster-certmanager".
      mountPath: ""
      # Vault role name on that mount.
      role: ""
      serviceAccountRef:
        # ServiceAccount cert-manager presents when logging in. Defaults to the
        # role name. It must exist in this namespace and be listed in the Vault
        # role's bound_service_account_names — both are created Vault-side, by
        # vault-base-setup's `k8s_auths`, not by this chart.
        #
        # The cert-manager controller also needs permission to mint tokens for
        # it. That grant is the cert-manager-tokenrequest Role below, which
        # follows this name automatically.
        name: ""

# RBAC that lets the cert-manager CONTROLLER mint the login token. Rendered only
# when vault.auth.method is "kubernetes"; token auth needs none of it.
rbac:
  # Ship the cert-manager-tokenrequest Role/RoleBinding.
  #
  # Set false only where something ELSE already owns that Role in this
  # namespace — notably a cluster whose issuer comes from stuttgart-things/flux
  # (component infra/cert-manager/components/vault-issuer), which ships the same
  # pair. Two owners for one identity is not a conflict either side resolves.
  create: true
  # The ServiceAccount that CALLS TokenRequest — the cert-manager controller,
  # NOT the ServiceAccount whose token is minted (that is
  # vault.auth.kubernetes.serviceAccountRef.name). Change this only if the
  # controller runs under a non-default ServiceAccount.
  tokenRequesterServiceAccount: cert-manager
