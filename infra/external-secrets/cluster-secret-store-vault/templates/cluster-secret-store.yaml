{{- /*
One ClusterSecretStore per KV mount.

`mounts` is what makes a cluster's stores a LIST rather than one hand-written
Application per mount. Every store shares the login — the same Vault server, the
same k8s-auth mount `<cluster>-eso`, the same `eso` ServiceAccount — and differs
only in which KV mount it opens. That is exactly the shape the ApplicationSet in
platforms/security needs: it reads the mounts off an annotation on the cluster
Secret and passes them straight through.

The annotation arrives as a comma-separated string, so a string is accepted as
well as a list. An entry is either a mount name or {mount, name} when the store
must be called something other than <namePrefix><mount>.

`mounts` empty keeps the single-store behaviour (`name` + `path`) the four
hand-written Applications still use — this chart is consumed by both while they
migrate.
*/ -}}
{{- $mounts := .Values.mounts | default (list) }}
{{- if kindIs "string" $mounts }}
  {{- $mounts = (splitList "," $mounts) }}
{{- end }}
{{- $entries := list }}
{{- range $m := $mounts }}
  {{- if kindIs "string" $m }}
    {{- $t := trim $m }}
    {{- if $t }}
      {{- $entries = append $entries (dict "path" $t "name" (printf "%s%s" $.Values.namePrefix $t)) }}
    {{- end }}
  {{- else }}
    {{- $p := trim (required "each mounts entry needs a mount" $m.mount) }}
    {{- $entries = append $entries (dict "path" $p "name" (default (printf "%s%s" $.Values.namePrefix $p) $m.name)) }}
  {{- end }}
{{- end }}
{{- if not $entries }}
  {{- $entries = list (dict "path" (required "either mounts or path must be set" .Values.path) "name" (required "either mounts or name must be set" .Values.name)) }}
{{- end }}
{{- range $e := $entries }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $e.name | quote }}
spec:
  provider:
    vault:
      server: {{ $.Values.server | quote }}
      path: {{ $e.path | quote }}
      version: {{ $.Values.version | quote }}
      caProvider:
        type: {{ $.Values.caProvider.type | quote }}
        name: {{ $.Values.caProvider.name | quote }}
        namespace: {{ $.Values.caProvider.namespace | quote }}
        key: {{ $.Values.caProvider.key | quote }}
      auth:
        kubernetes:
          mountPath: {{ $.Values.auth.kubernetes.mountPath | quote }}
          role: {{ $.Values.auth.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ $.Values.auth.kubernetes.serviceAccountRef.name | quote }}
            namespace: {{ $.Values.auth.kubernetes.serviceAccountRef.namespace | quote }}
{{- end }}
