---
# Every field is set by infra/prometheus-pve-exporter/install, which documents
# them; the defaults here only make the chart render standalone.
namespace: monitoring
image:
  repository: prompve/prometheus-pve-exporter
  tag: 3.10.1
target: set-pve-exporter-target.invalid
verifySSL: false
secretName: prometheus-pve-exporter
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStore:
    kind: ClusterSecretStore
    name: ""
  remoteKey: pve-exporter
  properties:
    user: user
    tokenName: token_name
    tokenValue: token_value
scrape:
  interval: 60s
  scrapeTimeout: 30s
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
reloader: true
dashboard:
  enabled: true
# Inert pass-through so the catalog verifier's probe values validate.
destination: {}
