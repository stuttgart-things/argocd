{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- if not $es.secretStore.name }}
{{- fail "externalSecrets.enabled is true but externalSecrets.secretStore.name is empty" }}
{{- end }}
---
# The read-only PVE API token (role PVEAuditor) the exporter reads via envFrom.
# Replaces the SOPS-encrypted Secret the Flux cluster repo supplies.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
  annotations:
    # Ahead of the Deployment, which cannot start without it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStore.kind | quote }}
    name: {{ $es.secretStore.name | quote }}
  target:
    name: {{ .Values.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: PVE_USER # pragma: allowlist secret
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.properties.user | quote }}
    - secretKey: PVE_TOKEN_NAME # pragma: allowlist secret
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.properties.tokenName | quote }}
    - secretKey: PVE_TOKEN_VALUE # pragma: allowlist secret
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.properties.tokenValue | quote }}
{{- end }}
