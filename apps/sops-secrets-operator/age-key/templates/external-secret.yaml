{{- range .Values.namespaces }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.secretName | quote }}
  namespace: {{ . | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $.Values.secretStoreRef.kind | quote }}
    name: {{ $.Values.secretStoreRef.name | quote }}
  target:
    name: {{ $.Values.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $.Values.dataKey | quote }}
      remoteRef:
        key: {{ $.Values.remoteKey | quote }}
        property: {{ $.Values.property | quote }}
{{- end }}
