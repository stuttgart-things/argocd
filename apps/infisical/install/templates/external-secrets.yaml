{{- if .Values.externalSecrets.enabled }}
{{- $defaultName := printf "infisical-%s" (sha1sum .Values.destination.server | trunc 8) }}
{{- $appName := .Values.applicationName | default $defaultName }}
{{- $keys := list "ENCRYPTION_KEY" "AUTH_SECRET" }}
{{- $templateData := dict }}
{{- /* Connection URLs are templated by ESO from the passwords, so the store
       holds each password once and the URL can never drift from it. The
       {{ .KEY }} references are ESO template syntax, emitted literally. */}}
{{- if .Values.postgresql.enabled }}
  {{- $keys = append $keys "DB_PASSWORD" }}
  {{- $_ := set $templateData "DB_CONNECTION_URI" (printf "postgresql://%s:{{ .DB_PASSWORD }}@postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.database) }}
{{- else }}
  {{- $keys = append $keys "DB_CONNECTION_URI" }}
{{- end }}
{{- if .Values.redis.enabled }}
  {{- $keys = append $keys "REDIS_PASSWORD" }}
  {{- $_ := set $templateData "REDIS_URL" "redis://default:{{ .REDIS_PASSWORD }}@redis-master:6379" }}
{{- else }}
  {{- $keys = append $keys "REDIS_URL" }}
{{- end }}
{{- $esValues := dict
      "namespace"       .Values.destination.namespace
      "secretName"      .Values.infisical.secretName
      "store"           .Values.externalSecrets.store
      "secretPath"      .Values.externalSecrets.secretPath
      "refreshInterval" .Values.externalSecrets.refreshInterval
      "keys"            $keys
      "templateData"    $templateData
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-external-secrets" $appName | quote }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/infisical/external-secrets
    helm:
      releaseName: infisical-external-secrets
      valuesObject:
        {{- toYaml $esValues | nindent 8 }}
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
