---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ .Values.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.store.name | quote }}
    kind: {{ .Values.store.kind | quote }}
  target:
    name: {{ .Values.secretName | quote }}
    creationPolicy: Owner
    {{- with .Values.templateData }}
    {{- /* Merge: the fetched keys stay in the Secret, the templated ones
           (ESO template syntax, passed through literally) are added. */}}
    template:
      mergePolicy: Merge
      data:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  data:
    {{- range .Values.keys }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ $.Values.secretPath | quote }}
        property: {{ . | quote }}
    {{- end }}
