{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
---
# Owner credentials for the RAG database. CNPG's bootstrap.initdb reads a
# Secret of type kubernetes.io/basic-auth (keys: username, password) named in
# the Cluster's bootstrap.initdb.secret. The Backstage RAG-AI plugin reads the
# same Secret, so app and database agree by construction.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.bootstrap.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    backup: backstage-rag-postgres
  annotations:
    # Ahead of the Cluster: initdb waits for this Secret.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStore.name | quote }}
    kind: {{ $es.secretStore.kind | quote }}
  target:
    name: {{ .Values.bootstrap.secretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # Lets CNPG reload the owner password when ESO rotates it.
          cnpg.io/reload: "true"
      data:
        username: {{ "{{ .username }}" | quote }}
        password: {{ "{{ .password }}" | quote }}
  data:
    - secretKey: username # pragma: allowlist secret
      remoteRef:
        key: {{ $es.credentials.remoteKey | quote }}
        property: {{ $es.credentials.usernameProperty | quote }}
    - secretKey: password # pragma: allowlist secret
      remoteRef:
        key: {{ $es.credentials.remoteKey | quote }}
        property: {{ $es.credentials.passwordProperty | quote }}
{{- if .Values.backup.enabled }}
---
# S3 credentials for the Barman Cloud ObjectStore (WAL + base backups) -- a
# bucket-scoped key pair. With backup.caConfigMap set, the CA the ObjectStore
# verifies the endpoint with is copied in from trust-manager's ConfigMap too:
# endpointCA must name a Secret, and templateFrom follows CA rotations.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.s3SecretName | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    backup: backstage-rag-postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStore.name | quote }}
    kind: {{ $es.secretStore.kind | quote }}
  target:
    name: {{ .Values.backup.s3SecretName | quote }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        ACCESS_KEY_ID: {{ "{{ .access_key }}" | quote }}
        SECRET_ACCESS_KEY: {{ "{{ .secret_key }}" | quote }}
      {{- with .Values.backup.caConfigMap }}
      templateFrom:
        {{- /* `target: Data` is the CRD default, written out: templateFrom is
               an atomic list, and a defaulted field inside an item keeps Argo
               OutOfSync forever. */}}
        - target: Data
          configMap:
            name: {{ . | quote }}
            items:
              - key: {{ $.Values.backup.caKey | quote }}
                templateAs: Values
      {{- end }}
  data:
    - secretKey: access_key # pragma: allowlist secret
      remoteRef:
        key: {{ $es.s3.remoteKey | quote }}
        property: {{ $es.s3.accessKeyProperty | quote }}
    - secretKey: secret_key # pragma: allowlist secret
      remoteRef:
        key: {{ $es.s3.remoteKey | quote }}
        property: {{ $es.s3.secretKeyProperty | quote }}
{{- end }}
{{- end }}
