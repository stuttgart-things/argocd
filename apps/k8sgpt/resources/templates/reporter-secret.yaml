{{- if .Values.reporterSecret.enabled }}
---
# The central omni-pitcher's bearer token for the reporter (the k8s-pitcher
# with nameSuffix -k8sgpt). Shared by every cluster: by default the entry
# _omni-pitcher, which kube-prometheus-stack's Alertmanager reads for the same
# token.
{{- $s := .Values.reporterSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ $s.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $s.secretStore.kind | quote }}
    name: {{ $s.secretStore.name | quote }}
  target:
    name: {{ $s.name | quote }}
    creationPolicy: Owner
  data:
    - secretKey: auth-token
      remoteRef:
        key: {{ $s.remoteKey | quote }}
        property: {{ $s.property | quote }}
{{- end }}
