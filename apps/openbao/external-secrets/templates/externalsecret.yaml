---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.store.name | quote }}
    kind: {{ .Values.store.kind | quote }}
  target:
    name: {{ .Values.secretName | quote }}
    # Orphan, not Owner: this Secret holds what unseals the raft data on the
    # PVC, and the PVC outlives an opt-out (Argo never deletes it). With Owner,
    # deleting this ExternalSecret garbage-collects the Secret, and an instance
    # whose store entry was rotated or removed since could never be unsealed
    # again. The Secret stays until somebody deletes it with the PVC.
    creationPolicy: Orphan
  data:
    {{- range .Values.keys }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ $.Values.remoteKey | quote }}
        property: {{ . | quote }}
    {{- end }}
