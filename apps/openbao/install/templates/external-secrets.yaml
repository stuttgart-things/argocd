{{- $seal := include "openbao-install.sealSecret" . | fromJson }}
{{- if and .Values.seal.externalSecret.enabled $seal }}
{{- $appName := include "openbao-install.appName" . }}
{{- $keys := list $seal.key }}
{{- if eq .Values.init.mode "self-init-userpass" }}
  {{- $keys = concat $keys (list "terraform-password" "admin-password") }}
{{- end }}
{{- $esValues := dict
      "namespace"       .Values.destination.namespace
      "secretName"      $seal.name
      "store"           .Values.seal.externalSecret.store
      "remoteKey"       .Values.seal.externalSecret.remoteKey
      "refreshInterval" .Values.seal.externalSecret.refreshInterval
      "keys"            $keys
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-external-secrets" $appName | quote }}
  namespace: argocd
  annotations:
    # Before openbao (0): the pod mounts the Secret as env and sits in
    # CreateContainerConfigError until it exists -- the flux openbao-prereqs
    # Kustomization that openbao dependsOn.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/openbao/external-secrets
    helm:
      releaseName: openbao-external-secrets
      valuesObject:
        {{- toYaml $esValues | nindent 8 }}
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
