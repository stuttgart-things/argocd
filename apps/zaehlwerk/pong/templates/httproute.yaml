{{- if .Values.httpRoute.enabled }}
---
# On the same gateway and listener as zaehlwerk's own route. `group` and `kind`
# spelled out because the Gateway API webhook defaults them in, and a manifest
# without them never matches the live object (same as apps/zaehlwerk/install).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: zaehlwerk
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.name }}
          port: 80
{{- end }}
