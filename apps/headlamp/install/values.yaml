---
# Reference back to this catalog repo — used by the optional rbac Application
# to load apps/headlamp/manifests/rbac from git.
catalog:
  repoURL: https://github.com/stuttgart-things/argocd.git
  targetRevision: HEAD

# ArgoCD AppProject both rendered Applications belong to.
project: default

# Where both rendered Applications deploy.
destination:
  server: https://kubernetes.default.svc
  namespace: headlamp

# Upstream Headlamp Helm chart (kubernetes-sigs/headlamp) version.
# renovate: datasource=helm depName=headlamp registryUrl=https://kubernetes-sigs.github.io/headlamp/
chartVersion: 0.46.0

# Gateway API HTTPRoute exposing Headlamp.
httpRoute:
  enabled: true
  hostname: headlamp.example.com
  gateway:
    name: cilium-gateway
    namespace: default

# Plugins pre-loaded by Headlamp's pluginsManager. Empty list disables pluginsManager.
plugins:
  - name: prometheus
    source: https://github.com/headlamp-k8s/plugins/releases/download/prometheus-0.8.2/prometheus-0.8.2.tar.gz

# Escape hatch: deep-merged on top of the computed valuesObject passed to the upstream chart.
# Use for any upstream Headlamp value not exposed as a first-class key above.
extraValues: {}

# Login via OIDC (ZITADEL) instead of the ServiceAccount token. Headlamp hands
# the user's ID token to the kube-apiserver, so the apiserver must accept the
# issuer with clientId as audience (--authentication-config) and RBAC must
# bind what it maps (e.g. infra/oidc-rbac) -- otherwise the login works and
# every request after it is 401. Same option as flux's headlamp-oidc.
oidc:
  # e.g. https://zitadel.infra.example, no trailing slash. Empty = off.
  issuer: ""
  # ZITADEL client ID (digits only -- keep it quoted). Also the apiserver's
  # audience.
  clientId: ""
  # Comma separated; Headlamp adds openid. ZITADEL: add
  # urn:zitadel:iam:org:projects:roles to get the project roles as groups.
  scopes: profile,email
  # Empty = https://<httpRoute.hostname>/oidc-callback. Must be a redirect URI
  # of the client.
  callbackUrl: ""
  # Existing Secret (SOPS / ESO) in the destination namespace with the client
  # secret.
  clientSecret:
    name: headlamp-oidc
    key: client-secret
  # CA bundle the issuer's certificate chains to. Empty = system roots.
  caConfigMap: cluster-trust-bundle
  caKey: trust-bundle.pem

# Opt-in ClusterRoleBinding granting cluster-admin to the headlamp ServiceAccount.
rbac:
  enabled: false

# Sync policy shared by both rendered Applications.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
