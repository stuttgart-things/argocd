{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
spec:
  parentRefs:
    # group + kind spelled out for the same reason `weight` is below: the
    # Gateway API admission webhook defaults them on the live object, and a
    # manifest that omits them leaves the Application permanently OutOfSync
    # while server-side-applying cleanly every time.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name | quote }}
      namespace: {{ $.Values.gateway.namespace | quote }}
  hostnames:
    - {{ .hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
          # Same defaulting as on parentRefs above: the admission webhook fills
          # group and kind in, so a manifest without them never reaches Synced.
        - group: ""
          kind: Service
          name: {{ .backend.name | quote }}
          port: {{ .backend.port }}
          # Render the Gateway API admission default explicitly so we
          # don't drift against the cilium-gateway-controller's
          # post-admission mutation. See stuttgart-things/argocd#114.
          weight: {{ .backend.weight | default 1 }}
{{- end }}
