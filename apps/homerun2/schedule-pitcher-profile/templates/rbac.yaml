{{- /* get on exactly the named Secrets, one Role + RoleBinding per
       namespace: what the profile's tokenFrom.secretKeyRef checks read
       (github-token-expiry, vault-token-ttl). Nothing cluster-wide. */}}
{{- range .Values.secretAccess }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-secrets" $.Values.serviceAccount.name | quote }}
  namespace: {{ .namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- toYaml .secrets | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-secrets" $.Values.serviceAccount.name | quote }}
  namespace: {{ .namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-secrets" $.Values.serviceAccount.name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name | quote }}
    namespace: {{ $.Values.serviceAccount.namespace | quote }}
{{- end }}
