---
# Name of the ConfigMap to materialize. Must match
# `schedulePitcher.profileConfigMap` in apps/homerun2/install, which is what
# the schedule-pitcher Deployment patch mounts (key profile.yaml).
name: homerun2-schedule-pitcher-profile

# The SchedulePitcherProfile as a YAML string
# (stuttgart-things/homerun2-schedule-pitcher, README "Profile"). Passed
# through verbatim. apps/homerun2/install always sets it; the default below
# is a minimal central profile without checks.
content: |
  apiVersion: homerun2.sthings.io/v1alpha1
  kind: SchedulePitcherProfile
  metadata:
    name: homerun2
  spec:
    pitcher:
      addr: http://homerun2-omni-pitcher.homerun2.svc.cluster.local/pitch/grafana
      format: grafana
    defaults:
      timezone: Europe/Berlin

# The schedule-pitcher's ServiceAccount, subject of the RoleBindings below.
serviceAccount:
  name: homerun2-schedule-pitcher
  namespace: homerun2

# One Role + RoleBinding (get on exactly these Secrets) per namespace, for the
# profile's tokenFrom.secretKeyRef checks. The namespaces must exist.
#
#   secretAccess:
#     - namespace: argocd
#       secrets: [argocd-repo-stuttgart-things]
secretAccess: []
