{{- if .Values.omniPitcher.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $name := "homerun2-omni-pitcher" }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-omni-pitcher" $appName | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ include "homerun2.kustomizeRepo" "omni-pitcher" | quote }}
    targetRevision: {{ .Values.omniPitcher.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        - target:
            kind: Ingress
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "networking.k8s.io/v1" "kind" "Ingress" "name" $name) | indent 12 }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.imagePatch" (dict "name" $name "tag" .Values.omniPitcher.version) | indent 12 }}
{{- if .Values.omniPitcher.routesContent }}
        # Config-driven stream routing (homerun2-omni-pitcher#105). ROUTES_CONFIG
        # names a file, so it needs the ConfigMap from
        # templates/omni-pitcher-routes.yaml mounted alongside it.
        #
        # Patched here rather than left to the kustomize OCI: that artifact is
        # rendered at release time from the repo's own KCL profile, where
        # routesConfig is empty, so the base ships no volume to fill.
        #
        # A strategic merge on the pod template: volumes and volumeMounts merge
        # by name, so `tmp` from the base survives and `routes` is added.
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
            spec:
              template:
                metadata:
                  annotations:
                    # omni-pitcher loads the routing file once at startup and
                    # exits if it is invalid; kubelet updates a mounted
                    # ConfigMap in place. Without this the change reaches the
                    # filesystem and not the process, and looks applied while
                    # nothing happened.
                    homerun2.sthings.io/routes-hash: {{ .Values.omniPitcher.routesContent | sha256sum | trunc 16 | quote }}
                spec:
                  volumes:
                    - name: routes
                      configMap:
                        name: {{ .Values.omniPitcherRoutesConfigMap | quote }}
                  containers:
                    - name: {{ $name }}
                      env:
                        - name: ROUTES_CONFIG
                          value: {{ printf "%s/routes.yaml" .Values.omniPitcher.routesPath | quote }}
                      volumeMounts:
                        - name: routes
                          mountPath: {{ .Values.omniPitcher.routesPath | quote }}
                          readOnly: true
{{- end }}
{{- if .Values.omniPitcher.inlineHttpRoute }}
        # Option B from stuttgart-things/argocd#116 — kustomize OCI ships the
        # HTTPRoute alongside Service so they land atomically. Patch parentRef
        # + hostname per env; the standalone httproute child Application no
        # longer renders omni-pitcher (see templates/httproute.yaml).
        - target:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
            name: {{ $name }}
          patch: |-
{{ include "homerun2.httpRouteJSONPatch" (dict "gateway" .Values.httpRoute.gateway "hostname" .Values.omniPitcher.hostname) | indent 12 }}
{{- end }}
{{- if .Values.authToken }}
        - target:
            kind: Secret
            name: {{ printf "%s-token" $name }}
          patch: |
{{ include "homerun2.authTokenPatch" (dict "secretName" (printf "%s-token" $name) "token" .Values.authToken) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-token" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-token" $name)) | indent 12 }}
{{- end }}
{{- if .Values.redisPassword }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.redisPasswordPatch" (dict "secretName" (printf "%s-redis" $name) "password" .Values.redisPassword) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-redis" $name)) | indent 12 }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.redisAddrPatch" (dict "name" $name "namespace" $ns "extraEnv" list) | indent 12 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
{{- if .Values.omniPitcher.inlineHttpRoute }}
  {{- include "homerun2.inlineRouteIgnoreDifferences" $name | nindent 2 }}
{{- end }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
