{{- if .Values.aiPitcher.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $name := "homerun2-ai-pitcher" }}
{{- $ns := .Values.destination.namespace }}
{{- /* The schedule-pitcher the runs read open findings from: this chart's
       own (in-cluster Service + its token Secret) while schedulePitcher is
       on, otherwise whatever aiPitcher.schedulePitcherURL names. Empty skips
       the findings; the base's default URL is always overwritten, so a
       cluster without one does not dial a Service that is not there. */}}
{{- $spURL := .Values.aiPitcher.schedulePitcherURL }}
{{- $spSecret := .Values.aiPitcher.schedulePitcherTokenSecret }}
{{- if .Values.schedulePitcher.enabled }}
  {{- $spURL = printf "http://homerun2-schedule-pitcher.%s.svc.cluster.local" $ns }}
  {{- $spSecret = "homerun2-schedule-pitcher-token" }}
{{- end }}
{{- /* v0.4.1 ships one CronJob per mode (homerun2-ai-pitcher#6, #9). The
       morning one keeps the historical name. */}}
{{- $modes := list
      (dict "key" "morning" "cronJob" $name)
      (dict "key" "evening" "cronJob" (printf "%s-evening" $name))
      (dict "key" "weekAhead" "cronJob" (printf "%s-week-ahead" $name))
      (dict "key" "weekly" "cronJob" (printf "%s-weekly" $name))
}}
---
{{- /* homerun2-ai-pitcher (stuttgart-things/homerun2-ai-pitcher): CronJobs
       that summarise scout's digest (and the schedule-pitcher's open
       findings) via OpenRouter and pitch it to omni-pitcher, one system per
       mode. Design: stuttgart-things/homerun-library#135.

       The base ships one Secret homerun2-ai-pitcher with four placeholder
       keys. ESO here writes one key per Secret, so the placeholder is
       deleted and the CronJobs read the Secrets this chart already has:
       scout and omni-pitcher share the `authToken` Vault field, so
       SCOUT_TOKEN and PITCHER_TOKEN come from their Secrets, the
       schedule-pitcher token from its own. Only the OpenRouter key gets its
       own ExternalSecret (templates/secrets.yaml, shared entry
       secrets.openrouterVaultSecretName). It is optional: without it every
       run pitches the plain digest marked "[AI n/a]". */}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-ai-pitcher" $appName | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ include "homerun2.kustomizeRepo" "ai-pitcher" | quote }}
    targetRevision: {{ .Values.aiPitcher.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        - target:
            kind: Secret
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" $name) | indent 12 }}
        # Every mode's CronJob: with a target, kustomize applies the patch to
        # each match and keeps its name. MODE stays the base's per CronJob.
        - target:
            kind: CronJob
            labelSelector: app.kubernetes.io/name={{ $name }}
          patch: |
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: {{ $name }}
            spec:
              timeZone: {{ .Values.aiPitcher.timeZone | quote }}
              suspend: {{ .Values.aiPitcher.suspend }}
              jobTemplate:
                spec:
                  template:
                    spec:
                      containers:
                        - name: {{ $name }}
                          image: {{ printf "ghcr.io/stuttgart-things/%s:%s" $name .Values.aiPitcher.version | quote }}
                          env:
                            - name: SCOUT_URL
                              value: {{ printf "http://homerun2-scout.%s.svc.cluster.local" $ns | quote }}
                            - name: SCOUT_TOKEN
                              valueFrom:
                                secretKeyRef:
                                  name: homerun2-scout-token
                                  key: auth-token
                            - name: PITCHER_URL
                              value: {{ printf "http://homerun2-omni-pitcher.%s.svc.cluster.local" $ns | quote }}
                            - name: PITCHER_TOKEN
                              valueFrom:
                                secretKeyRef:
                                  name: homerun2-omni-pitcher-token
                                  key: auth-token
                            - name: SCHEDULE_PITCHER_URL
                              value: {{ $spURL | quote }}
                            - name: SCHEDULE_PITCHER_TOKEN
                              valueFrom:
                                secretKeyRef:
                                  name: {{ $spSecret | quote }}
                                  key: auth-token
                                  optional: true
                            - name: OPENROUTER_API_KEY
                              valueFrom:
                                secretKeyRef:
                                  name: {{ printf "%s-openrouter" $name | quote }}
                                  key: api-key
                                  optional: true
                            - name: OPENROUTER_MODEL
                              value: {{ .Values.aiPitcher.model | quote }}
                            - name: SUMMARY_LANGUAGE
                              value: {{ .Values.aiPitcher.language | quote }}
                            - name: LLM_RETRIES
                              value: {{ .Values.aiPitcher.retries | toString | quote }}
{{- range $modes }}
{{- $mode := index $.Values.aiPitcher.modes .key }}
{{- if $mode.enabled }}
        - target:
            kind: CronJob
            name: {{ .cronJob }}
          patch: |
            apiVersion: batch/v1
            kind: CronJob
            metadata:
              name: {{ .cronJob }}
            spec:
              schedule: {{ $mode.schedule | quote }}
{{- else }}
        - target:
            kind: CronJob
            name: {{ .cronJob }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "batch/v1" "kind" "CronJob" "name" .cronJob) | indent 12 }}
{{- end }}
{{- end }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
