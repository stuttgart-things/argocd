{{- if and .Values.smokeTest.enabled .Values.omniPitcher.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- /* connectTo: an explicit override wins; otherwise derive the Cilium
       gateway's own Service from httpRoute.gateway, because a Cilium
       L2-announced LoadBalancer VIP is not reachable from Pods on the same
       cluster. Set `connectToGateway: false` on a cluster whose VIP does
       hairpin, or whose gateway Service is named by another convention. */}}
{{- $connectTo := .Values.smokeTest.external.connectTo }}
{{- if and (not $connectTo) .Values.smokeTest.external.connectToGateway }}
  {{- $connectTo = printf "cilium-gateway-%s.%s.svc.cluster.local" .Values.httpRoute.gateway.name .Values.httpRoute.gateway.namespace }}
{{- end }}
{{- $ext := dict
      "enabled"      .Values.smokeTest.external.enabled
      "hostname"     .Values.omniPitcher.hostname
      "caConfigMap"  .Values.smokeTest.external.caConfigMap
      "caKey"        .Values.smokeTest.external.caKey
      "connectTo"    $connectTo
      "insecure"     .Values.smokeTest.external.insecure
}}
{{- /* Liveness probes for the other enabled components. Only core-catcher
       and scout are derived automatically — both serve /health on port 80 in
       every published kustomize base. Anything else goes through
       smokeTest.extraProbes, so the chart never invents an endpoint a
       component may not have. `hostname` is only set when the component's own
       HTTPRoute exists, i.e. it is not silently probed through a route that
       was never rendered. */}}
{{- $probes := list }}
{{- if .Values.coreCatcher.enabled }}
  {{- $probes = append $probes (dict "name" "core-catcher" "service" "homerun2-core-catcher" "port" 80 "path" "/health" "hostname" (ternary .Values.coreCatcher.hostname "" .Values.httpRoute.enabled)) }}
{{- end }}
{{- if .Values.scout.enabled }}
  {{- $probes = append $probes (dict "name" "scout" "service" "homerun2-scout" "port" 80 "path" "/health" "hostname" (ternary .Values.scout.hostname "" .Values.httpRoute.enabled)) }}
{{- end }}
{{- /* light-catcher and wled-mock answer on /healthz, not /health — checked
       against light-catcher v1.0.0 and wled-mock v1.0.0. Getting this wrong
       fails the smoke test on a perfectly healthy component. */}}
{{- if .Values.lightCatcher.enabled }}
  {{- $probes = append $probes (dict "name" "light-catcher" "service" "homerun2-light-catcher" "port" 80 "path" "/healthz" "hostname" (ternary .Values.lightCatcher.hostname "" .Values.httpRoute.enabled)) }}
{{- end }}
{{- if .Values.wledMock.enabled }}
  {{- $probes = append $probes (dict "name" "wled-mock" "service" "homerun2-wled-mock" "port" 80 "path" "/healthz" "hostname" (ternary .Values.wledMock.hostname "" .Values.httpRoute.enabled)) }}
{{- end }}
{{- /* demo-pitcher serves the UI and /health on port 80 — checked against
       demo-pitcher v2.0.0. It is a UI, so /health is all the smoke test
       asserts; whether its pitches arrive is what core-catcher's and scout's
       own probes already cover downstream. */}}
{{- if .Values.demoPitcher.enabled }}
  {{- $probes = append $probes (dict "name" "demo-pitcher" "service" "homerun2-demo-pitcher" "port" 80 "path" "/health" "hostname" (ternary .Values.demoPitcher.hostname "" .Values.httpRoute.enabled)) }}
{{- end }}
{{- $probes = concat $probes .Values.smokeTest.extraProbes }}
{{- $stValues := dict
      "name"                 (printf "%s-smoke-test" $appName)
      "namespace"            .Values.destination.namespace
      "image"                .Values.smokeTest.image
      "podSecurityContext"   .Values.smokeTest.podSecurityContext
      "hook"                 .Values.smokeTest.hook
      "job"                  .Values.smokeTest.job
      "omniPitcher"          (dict "service" "homerun2-omni-pitcher" "port" 80)
      "authTokenSecretName"  "homerun2-omni-pitcher-token"
      "authTokenSecretKey"   "auth-token"
      "healthCheck"          .Values.smokeTest.healthCheck
      "unauthenticated"      .Values.smokeTest.unauthenticated
      "external"             $ext
      "events"               .Values.smokeTest.events
      "extraProbes"          $probes
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-smoke-test" $appName | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the components (0) and their routes (10) — the external pass
    # goes through the HTTPRoute, so the route has to exist first.
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/homerun2/smoke-test
    helm:
      releaseName: {{ printf "%s-smoke-test" $appName | quote }}
      valuesObject:
        {{- toYaml $stValues | nindent 8 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
