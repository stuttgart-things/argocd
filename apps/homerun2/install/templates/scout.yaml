{{- if .Values.scout.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $name := "homerun2-scout" }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-scout" $appName | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ include "homerun2.kustomizeRepo" "scout" | quote }}
    targetRevision: {{ .Values.scout.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        - target:
            kind: Ingress
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "networking.k8s.io/v1" "kind" "Ingress" "name" $name) | indent 12 }}
        # scout is the only base that ships its own Namespace. Left in place
        # this Application would OWN homerun2, and `prune: true` would delete
        # the namespace — with the whole stack inside it — the moment scout is
        # disabled. The parent chart creates the namespace via
        # CreateNamespace=true on the destination instead.
        - target:
            kind: Namespace
            name: {{ $ns }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Namespace" "name" $ns) | indent 12 }}
{{- if .Values.scout.inlineHttpRoute }}
        # Option B from stuttgart-things/argocd#116 — kustomize OCI ships the
        # HTTPRoute alongside Service so they land atomically. Patch parentRef
        # + hostname per env; the standalone httproute child Application no
        # longer renders scout (see templates/httproute.yaml).
        - target:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
            name: {{ $name }}
          patch: |-
{{ include "homerun2.httpRouteJSONPatch" (dict "gateway" .Values.httpRoute.gateway "hostname" .Values.scout.hostname) | indent 12 }}
{{- else }}
        - target:
            kind: HTTPRoute
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "gateway.networking.k8s.io/v1" "kind" "HTTPRoute" "name" $name) | indent 12 }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.imagePatch" (dict "name" $name "tag" .Values.scout.version) | indent 12 }}
{{- /* The base ships homerun2-scout-token with a literal `changeme`, and
       scout's /analytics/* endpoints are the only thing that Secret guards.
       Patch it from .Values.authToken, or delete it so an ESO-managed Secret
       of the same name takes over — never ship the placeholder. */}}
{{- if .Values.authToken }}
        - target:
            kind: Secret
            name: {{ printf "%s-token" $name }}
          patch: |
{{ include "homerun2.authTokenPatch" (dict "secretName" (printf "%s-token" $name) "token" .Values.authToken) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-token" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-token" $name)) | indent 12 }}
{{- end }}
{{- if .Values.redisPassword }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.redisPasswordPatch" (dict "secretName" (printf "%s-redis" $name) "password" .Values.redisPassword) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-redis" $name)) | indent 12 }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.redisAddrPatch" (dict "name" $name "namespace" $ns "extraEnv" list) | indent 12 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
{{- if .Values.scout.inlineHttpRoute }}
  {{- include "homerun2.inlineRouteIgnoreDifferences" $name | nindent 2 }}
{{- end }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
