{{- if .Values.scout.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $name := "homerun2-scout" }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-scout" $appName | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ include "homerun2.kustomizeRepo" "scout" | quote }}
    targetRevision: {{ .Values.scout.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        - target:
            kind: Ingress
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "networking.k8s.io/v1" "kind" "Ingress" "name" $name) | indent 12 }}
        # scout is the only base that ships its own Namespace. Left in place
        # this Application would OWN homerun2, and `prune: true` would delete
        # the namespace — with the whole stack inside it — the moment scout is
        # disabled. The parent chart creates the namespace via
        # CreateNamespace=true on the destination instead.
        - target:
            kind: Namespace
            name: {{ $ns }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Namespace" "name" $ns) | indent 12 }}
{{- if .Values.scout.inlineHttpRoute }}
        # Option B from stuttgart-things/argocd#116 — kustomize OCI ships the
        # HTTPRoute alongside Service so they land atomically. Patch parentRef
        # + hostname per env; the standalone httproute child Application no
        # longer renders scout (see templates/httproute.yaml).
        - target:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
            name: {{ $name }}
          patch: |-
{{ include "homerun2.httpRouteJSONPatch" (dict "gateway" .Values.httpRoute.gateway "hostname" .Values.scout.hostname) | indent 12 }}
{{- else }}
        - target:
            kind: HTTPRoute
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "gateway.networking.k8s.io/v1" "kind" "HTTPRoute" "name" $name) | indent 12 }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.imagePatch" (dict "name" $name "tag" .Values.scout.version "reloader" .Values.reloader) | indent 12 }}
{{- /* The base ships homerun2-scout-token with a literal `changeme`, and
       scout's /analytics/* endpoints are the only thing that Secret guards.
       Patch it from .Values.authToken, or delete it so an ESO-managed Secret
       of the same name takes over — never ship the placeholder. */}}
{{- if .Values.authToken }}
        - target:
            kind: Secret
            name: {{ printf "%s-token" $name }}
          patch: |
{{ include "homerun2.authTokenPatch" (dict "secretName" (printf "%s-token" $name) "token" .Values.authToken) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-token" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-token" $name)) | indent 12 }}
{{- end }}
{{- if .Values.redisPassword }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.redisPasswordPatch" (dict "secretName" (printf "%s-redis" $name) "password" .Values.redisPassword) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-redis" $name)) | indent 12 }}
{{- end }}
{{- /* With alerting in the ScoutProfile, scout pitches meta-alerts to
       omni-pitcher and needs its bearer token. It comes from omni-pitcher's own
       Secret in the same namespace - never from the CR, which lives in git.
       optional: scout still starts without it; the alerts are then answered
       401 and logged. */}}
{{- $scoutEnv := list }}
{{- $profile := include "homerun2.scoutProfile" . | fromYaml }}
{{- if and $profile.render (dig "alerting" "pitcherURL" "" $profile.spec) }}
  {{- $scoutEnv = append $scoutEnv (dict "name" "ALERT_PITCHER_TOKEN" "valueFrom" (dict "secretKeyRef" (dict "name" "homerun2-omni-pitcher-token" "key" "auth-token" "optional" true))) }}
{{- end }}
{{- /* The ai-pitcher's own messages (one system per mode, plus the ticker)
       stay out of scout's digests, so no digest counts an AI summary — as on
       LabUL platform-sthings. A ScoutProfile listing digest.excludeSystems
       wins over this env; homerun2.scoutProfile adds the same systems there. */}}
{{- if .Values.aiPitcher.enabled }}
  {{- $scoutEnv = append $scoutEnv (dict "name" "DIGEST_EXCLUDE_SYSTEMS" "value" (include "homerun2.aiPitcherSystems" .)) }}
{{- end }}
{{- /* Retention: the ai-pitcher's weekly mode compares this week with the
       one before, so scout has to keep 15 days (360h) instead of its 48h. A
       ScoutProfile's retention.ttl wins over this env. */}}
{{- $ttl := .Values.scout.retentionTTL }}
{{- if and (not $ttl) .Values.aiPitcher.enabled .Values.aiPitcher.modes.weekly.enabled }}
  {{- $ttl = "360h" }}
{{- end }}
{{- with $ttl }}
  {{- $scoutEnv = append $scoutEnv (dict "name" "SCOUT_RETENTION_TTL" "value" .) }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.redisAddrPatch" (dict "name" $name "namespace" $ns "extraEnv" $scoutEnv) | indent 12 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
{{- if .Values.scout.inlineHttpRoute }}
  {{- include "homerun2.inlineRouteIgnoreDifferences" $name | nindent 2 }}
{{- end }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
