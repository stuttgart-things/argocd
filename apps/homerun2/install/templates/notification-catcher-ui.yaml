{{- /* The catcher's read-only HTTP UI (homerun2-notification-catcher
       docs/http-ui.md): templates/notification-catcher.yaml patches
       HTTP_ADDR, the container port and a readiness probe on /healthz into
       the Deployment; this sub-Application adds the Service the base does not
       ship; templates/httproute.yaml routes ui.hostname to it. */}}
{{- if and .Values.notificationCatcher.enabled .Values.notificationCatcher.ui.enabled }}
{{- $appName := include "homerun2.appName" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-notification-catcher-ui" $appName | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/homerun2/notification-catcher-ui
    helm:
      releaseName: {{ include "homerun2.releaseName" (printf "%s-notification-catcher-ui" $appName) | quote }}
      valuesObject:
        name: homerun2-notification-catcher
        port: 80
        targetPort: 8080
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
