{{- if .Values.notificationCatcher.sink.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-notification-catcher-sink" $appName | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    {{- /* Its own base, not the catcher's: an Application can patch but not
           add resources. It ships ServiceAccount, Deployment and Service
           `homerun2-notification-catcher-sink` with the image already pinned
           to this tag, no Namespace, no Secret, no route — so no patches. */}}
    repoURL: {{ include "homerun2.kustomizeRepo" "notification-catcher-sink" | quote }}
    targetRevision: {{ .Values.notificationCatcher.sink.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
