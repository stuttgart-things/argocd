{{- if .Values.wledMock.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $name := "homerun2-wled-mock" }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-wled-mock" $appName | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ include "homerun2.kustomizeRepo" "wled-mock" | quote }}
    targetRevision: {{ .Values.wledMock.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        # Like scout, wled-mock's base ships its own Namespace. Left in place
        # this Application would OWN homerun2 and `prune: true` would delete
        # it — with the whole stack in it — as soon as wledMock is disabled.
        # The parent chart creates the namespace via CreateNamespace=true.
        - target:
            kind: Namespace
            name: {{ $ns }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Namespace" "name" $ns) | indent 12 }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.imagePatch" (dict "name" $name "tag" .Values.wledMock.version) | indent 12 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
