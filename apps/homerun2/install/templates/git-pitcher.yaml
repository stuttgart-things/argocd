{{- if .Values.gitPitcher.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- $name := "homerun2-git-pitcher" }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-git-pitcher" $appName | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ include "homerun2.kustomizeRepo" "git-pitcher" | quote }}
    targetRevision: {{ .Values.gitPitcher.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
{{- if .Values.gitPitcher.inlineHttpRoute }}
        # Option B from stuttgart-things/argocd#116 — kustomize OCI ships the
        # HTTPRoute alongside Service so they land atomically. Patch parentRef
        # + hostname per env; the standalone httproute child Application no
        # longer renders git-pitcher (see templates/httproute.yaml).
        - target:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
            name: {{ $name }}
          patch: |-
{{ include "homerun2.httpRouteJSONPatch" (dict "gateway" .Values.httpRoute.gateway "hostname" .Values.gitPitcher.hostname) | indent 12 }}
{{- else }}
        - target:
            kind: HTTPRoute
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "gateway.networking.k8s.io/v1" "kind" "HTTPRoute" "name" $name) | indent 12 }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.imagePatch" (dict "name" $name "tag" .Values.gitPitcher.version) | indent 12 }}
{{- if .Values.redisPassword }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.redisPasswordPatch" (dict "secretName" (printf "%s-redis" $name) "password" .Values.redisPassword) | indent 12 }}
{{- else }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-redis" $name)) | indent 12 }}
{{- end }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.redisAddrPatch" (dict "name" $name "namespace" $ns "extraEnv" list) | indent 12 }}
        {{- /* The kustomize base sets AUTH_TOKEN as a PLAIN env value literal
               `changeme`, not a secretKeyRef like every other component's
               token. That literal guards POST /pitch, which this chart
               publishes through the gateway — left alone it is a
               world-writable entry point into the message bus, and no Secret
               delete patch can reach it because there is no Secret.
               `value: null` is load-bearing: strategic merge merges env
               entries by name, so without it the container ends up with both
               `value` and `valueFrom` and the API server rejects the
               Deployment outright. */}}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: {{ $name }}
            spec:
              template:
                spec:
                  containers:
                    - name: {{ $name }}
                      env:
                        - name: AUTH_TOKEN
                        {{- if .Values.authToken }}
                          value: {{ .Values.authToken | quote }}
                        {{- else }}
                          value: null
                          valueFrom:
                            secretKeyRef:
                              name: {{ printf "%s-token" $name | quote }}
                              key: auth-token
                        {{- end }}
        {{- /* The base ships homerun2-git-pitcher-github holding the literal
               `changeme`. A GitHub PAT is never something this chart inlines
               from values, so the placeholder is always deleted and the
               Secret comes from ESO (secrets.enabled adds the row) or
               out-of-band. Note the token is NOT optional: git-pitcher's
               config loader fails startup on an empty GITHUB_TOKEN, so a
               missing Vault field is a CrashLoopBackOff, not degraded
               polling. */}}
        - target:
            kind: Secret
            name: {{ printf "%s-github" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-github" $name)) | indent 12 }}
{{- if not .Values.gitPitcher.inlineWatchConfig }}
        {{- /* Which repos are watched is cluster-specific, the same way
               k8sPitcherProfileConfigMap is. With inlineWatchConfig false the
               base's ConfigMap is dropped and the volume points at an
               out-of-band one; this chart does not create it. */}}
        - target:
            kind: ConfigMap
            name: {{ printf "%s-watch-config" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "ConfigMap" "name" (printf "%s-watch-config" $name)) | indent 12 }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ toYaml (dict
     "apiVersion" "apps/v1"
     "kind" "Deployment"
     "metadata" (dict "name" $name)
     "spec" (dict "template" (dict "spec" (dict
       "volumes" (list (dict "name" "watch-config" "configMap" (dict "name" .Values.gitPitcherWatchConfigMap)))
     )))
   ) | indent 12 }}
{{- end }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
{{- if .Values.gitPitcher.inlineHttpRoute }}
  {{- include "homerun2.inlineRouteIgnoreDifferences" $name | nindent 2 }}
{{- end }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
