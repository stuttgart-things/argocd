{{- if .Values.secrets.enabled }}
{{- $appName := include "homerun2.appName" . }}
{{- /* Build the components list from which components are enabled. Each
       redis-consuming component whose `redisPassword` is empty gets a
       `<name>-redis` ExternalSecret. Always include the omni-pitcher
       token + redis-stack-auth Secrets (omni-pitcher is the gateway, and
       redis-stack itself reads from the auth Secret via `existingSecret`). */}}
{{- $components := list }}
{{- if .Values.omniPitcher.enabled }}
  {{- $components = append $components (dict "name" "omni-pitcher-token" "secretName" "homerun2-omni-pitcher-token" "dataKey" "auth-token" "vaultProperty" "authToken") }}
  {{- $components = append $components (dict "name" "omni-pitcher-redis" "secretName" "homerun2-omni-pitcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.redisStack.enabled }}
  {{- $components = append $components (dict "name" "redis-stack-auth" "secretName" "redis-stack-auth" "dataKey" "redis-password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.coreCatcher.enabled }}
  {{- $components = append $components (dict "name" "core-catcher-redis" "secretName" "homerun2-core-catcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.scout.enabled }}
  {{- /* scout's /analytics/* endpoints take the same bearer token as
         omni-pitcher's /pitch — one Vault field, two consumers. */}}
  {{- $components = append $components (dict "name" "scout-token" "secretName" "homerun2-scout-token" "dataKey" "auth-token" "vaultProperty" "authToken") }}
  {{- $components = append $components (dict "name" "scout-redis" "secretName" "homerun2-scout-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.lightCatcher.enabled }}
  {{- $components = append $components (dict "name" "light-catcher-redis" "secretName" "homerun2-light-catcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.ledCatcher.enabled }}
  {{- $components = append $components (dict "name" "led-catcher-redis" "secretName" "homerun2-led-catcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.gitPitcher.enabled }}
  {{- $components = append $components (dict "name" "git-pitcher-redis" "secretName" "homerun2-git-pitcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
  {{- /* git-pitcher publishes an authenticated POST /pitch and the base
         hardcodes AUTH_TOKEN=changeme; templates/git-pitcher.yaml overrides
         the env to read this Secret instead. Same Vault property as
         omni-pitcher's token — one token, every /pitch endpoint. */}}
  {{- $components = append $components (dict "name" "git-pitcher-token" "secretName" "homerun2-git-pitcher-token" "dataKey" "auth-token" "vaultProperty" "authToken") }}
  {{- /* The GitHub PAT the watcher polls with. NOT optional: git-pitcher's
         config loader errors out on an empty GITHUB_TOKEN, so if this Vault
         property is missing the ExternalSecret stays SecretSyncedError and
         the Pod never starts. Same property name the preview AppSet already
         uses. */}}
  {{- $gh := dict "name" "git-pitcher-github" "secretName" "homerun2-git-pitcher-github" "dataKey" "token" "vaultProperty" "githubToken" }}
  {{- /* The GitHub PAT is not an installation's own secret: a per-cluster
         entry (homerun2/<cluster>) carries authToken and redisPassword only,
         and the PAT is SHARED in its own entry (homerun2/_git-pat,
         crossplane-configurations#464). githubTokenVaultSecretName points
         this one component there; empty keeps it on vaultSecretName. */}}
  {{- with .Values.secrets.githubTokenVaultSecretName }}
  {{- $_ := set $gh "vaultSecretName" . }}
  {{- end }}
  {{- $components = append $components $gh }}
{{- end }}
{{- if .Values.k8sPitcher.enabled }}
  {{- /* k8s-pitcher POSTs to omni-pitcher's authenticated /pitch, reading the
         token through the profile's auth.tokenFrom.secretKeyRef. Nothing else
         creates that Secret: templates/k8s-pitcher.yaml deletes the placeholder
         the kustomize base ships whenever `.Values.authToken` is empty, which
         is the normal case. Same Vault property as every other /pitch client. */}}
  {{- $components = append $components (dict "name" "k8s-pitcher-token" "secretName" "homerun2-k8s-pitcher-token" "dataKey" "auth-token" "vaultProperty" "authToken") }}
{{- end }}
{{- if .Values.aiPitcher.enabled }}
  {{- /* OpenRouter API key of homerun2-ai-pitcher. Not an installation's own
         secret but SHARED in its own entry (e.g. homerun2/_openrouter), like
         the Teams webhook, so it is only rendered when
         openrouterVaultSecretName points there. Fail-open: the CronJobs read
         it with optional: true and without it pitch the plain digest marked
         "[AI n/a]" -- whereas an ExternalSecret against an entry without the
         property would sit in SecretSyncedError and take the secrets
         Application Degraded. Same store as the rest. */}}
  {{- with .Values.secrets.openrouterVaultSecretName }}
  {{- $components = append $components (dict "name" "ai-pitcher-openrouter" "secretName" "homerun2-ai-pitcher-openrouter" "dataKey" "api-key" "vaultProperty" "openrouterApiKey" "vaultSecretName" .) }}
  {{- end }}
{{- end }}
{{- if .Values.schedulePitcher.enabled }}
  {{- /* schedule-pitcher's own API/UI/findings token. A property of its own,
         not `authToken`: agents on other clusters and jobs on VMs carry it to
         POST /findings, and it should not double as this cluster's /pitch
         token. ai-pitcher reads the same Secret. The pitch token is
         omni-pitcher's (templates/schedule-pitcher.yaml), so no Secret here. */}}
  {{- $components = append $components (dict "name" "schedule-pitcher-token" "secretName" "homerun2-schedule-pitcher-token" "dataKey" "auth-token" "vaultProperty" "schedulePitcherAuthToken") }}
  {{- $components = append $components (dict "name" "schedule-pitcher-redis" "secretName" "homerun2-schedule-pitcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
{{- end }}
{{- if .Values.soundCatcher.enabled }}
  {{- /* The kustomize base ships neither Secret, it only references both
         (optional). /play, replay and mute take the stack's `authToken`: who
         holds it can pitch any announcement through omni-pitcher already. */}}
  {{- $components = append $components (dict "name" "sound-catcher-redis" "secretName" "homerun2-sound-catcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
  {{- $components = append $components (dict "name" "sound-catcher-api" "secretName" "homerun2-sound-catcher-api" "dataKey" "token" "vaultProperty" "authToken") }}
{{- end }}
{{- if .Values.notificationCatcher.enabled }}
  {{- $components = append $components (dict "name" "notification-catcher-redis" "secretName" "homerun2-notification-catcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
  {{- /* The Teams webhook URL. Like the GitHub PAT it is not an
         installation's own secret but SHARED in its own entry (e.g.
         homerun2/_teams-webhook, published by the ClusterStack through the
         AppSecretProfile's `teamsWebhookUrl: {shared: teams-webhook}`), so
         it is only rendered when teamsWebhookVaultSecretName points there —
         a per-cluster entry carries no webhook, and an ExternalSecret
         against it would sit in SecretSyncedError. Same store as the rest.
         templates/notification-catcher.yaml deletes the base's placeholder
         Secret of this name to make room for it. A literal
         notificationCatcher.teamsWebhookUrl wins: that path patches the
         base's Secret instead, and two owners of one Secret would fight. */}}
  {{- if and .Values.secrets.teamsWebhookVaultSecretName (not .Values.notificationCatcher.teamsWebhookUrl) }}
  {{- $components = append $components (dict "name" "notification-catcher-teams" "secretName" "homerun2-notification-catcher-secrets" "dataKey" "TEAMS_WEBHOOK_URL" "vaultProperty" "teamsWebhookUrl" "vaultSecretName" .Values.secrets.teamsWebhookVaultSecretName) }}
  {{- end }}
{{- end }}
{{- if .Values.demoPitcher.enabled }}
  {{- $components = append $components (dict "name" "demo-pitcher-redis" "secretName" "homerun2-demo-pitcher-redis" "dataKey" "password" "vaultProperty" "redisPassword") }}
  {{- /* Only when demo-pitcher posts to omni-pitcher instead of writing to
         Redis itself: templates/demo-pitcher.yaml then adds AUTH_TOKEN from
         this Secret, and the Pod does not start without it (the kustomize
         base ships no token Secret at all, so nothing else would create it).
         Same Vault property as omni-pitcher-token — one token, both sides of
         the hop. The preview AppSet materialises this row unconditionally;
         here it is gated on the URL so a demo-pitcher left on its Redis
         backend does not grow an unused Secret. */}}
  {{- if .Values.demoPitcher.omniPitcherUrl }}
    {{- $components = append $components (dict "name" "demo-pitcher-token" "secretName" "homerun2-demo-pitcher-token" "dataKey" "auth-token" "vaultProperty" "authToken") }}
  {{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-secrets" $appName | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    # Sync ahead of the component Applications — they reference the
    # materialised Secrets by name at Pod start, so the ExternalSecrets
    # must reconcile first.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/homerun2/secrets
    helm:
      releaseName: {{ include "homerun2.releaseName" (printf "%s-secrets" $appName) | quote }}
      valuesObject:
        namespace: {{ .Values.destination.namespace | quote }}
        clusterSecretStoreName: {{ .Values.secrets.clusterSecretStoreName | quote }}
        vaultSecretName: {{ .Values.secrets.vaultSecretName | quote }}
        refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
        components:
          {{- toYaml $components | nindent 10 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
