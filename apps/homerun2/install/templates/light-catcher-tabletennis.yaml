{{- if .Values.lightCatcherTabletennis.enabled }}
{{- /* THE STREAM HAS TO BE ROUTED, or this catcher watches an empty one. The
       failure is silent on every side: zaehlwerk's pitch returns 200,
       omni-pitcher puts the message on `messages` because nothing told it
       otherwise, and this Pod reports Healthy with no events. Fail the render
       instead — unless the consumer wrote their own routing file, in which case
       trust it. */}}
{{- if and (not .Values.omniPitcher.tabletennisStream) (not .Values.omniPitcher.routesContent) }}
{{- fail "lightCatcherTabletennis.enabled needs a `tabletennis` stream on omni-pitcher: set omniPitcher.tabletennisStream=true, or write the stream into omniPitcher.routesContent yourself. Without it zaehlwerk's scores land on `messages`, the pitch still returns 200, and this catcher never sees an event." }}
{{- end }}
{{- $appName := include "homerun2.appName" . }}
{{- /* The base names every object homerun2-light-catcher and selects on those
       labels — the Service, the Deployment selector, its pod anti-affinity. So
       this is a SECOND INSTANCE IN ITS OWN NAMESPACE, not a name suffix:
       renamed into the homerun2 namespace the two Services would each route to
       both instances. In a namespace of its own the base applies unchanged. */}}
{{- $name := "homerun2-light-catcher" }}
{{- $ns := .Values.lightCatcherTabletennis.namespace }}
{{- /* Redis stays where the rest of homerun2 is — this instance reaches across
       namespaces to it rather than running one of its own. */}}
{{- $redisNs := .Values.destination.namespace }}
{{- $wled := .Values.lightCatcherTabletennis.wledEndpoint }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-light-catcher-tabletennis" $appName | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    {{- /* Same artifact as the other light-catcher, deliberately pinned to the
           same value: two instances of one component on two versions is a
           difference nobody is tracking. REQUIRES v1.1.0 or later — the rules
           below match on tags, which an older catcher ignores, and then the
           first rule takes every set AND match and side a's colour every
           point. */}}
    repoURL: {{ include "homerun2.kustomizeRepo" "light-catcher" | quote }}
    targetRevision: {{ .Values.lightCatcher.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        - target:
            kind: Ingress
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "networking.k8s.io/v1" "kind" "Ingress" "name" $name) | indent 12 }}
        {{- /* No route. This instance drives the strip at the table and has no
               reader; the dashboard on the other light-catcher is the one worth
               exposing, and a second route would need a second hostname to say
               nothing new. */}}
        - target:
            kind: HTTPRoute
            name: {{ $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "gateway.networking.k8s.io/v1" "kind" "HTTPRoute" "name" $name) | indent 12 }}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.imagePatch" (dict "name" $name "tag" .Values.lightCatcher.version) | indent 12 }}
{{- if .Values.redisPassword }}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.redisPasswordPatch" (dict "secretName" (printf "%s-redis" $name) "password" .Values.redisPassword) | indent 12 }}
{{- else }}
        {{- /* Deleted so an ESO-managed Secret of the same name takes over —
               `secrets.enabled` renders one into THIS namespace, see
               templates/secrets.yaml. */}}
        - target:
            kind: Secret
            name: {{ printf "%s-redis" $name }}
          patch: |
{{ include "homerun2.deletePatch" (dict "apiVersion" "v1" "kind" "Secret" "name" (printf "%s-redis" $name)) | indent 12 }}
{{- end }}
        {{- /* REDIS_ADDR crosses into the homerun2 namespace, plus the stream
               and a consumer group of its own. The group name is per stream, so
               it would not collide with the other light-catcher today — but a
               shared name is one REDIS_STREAMS change away from two catchers
               splitting the table's points between them. */}}
        - target:
            kind: Deployment
            name: {{ $name }}
          patch: |
{{ include "homerun2.redisAddrPatch" (dict "name" $name "namespace" $redisNs "extraEnv" (list (dict "name" "REDIS_STREAM" "value" .Values.lightCatcherTabletennis.redisStream) (dict "name" "CONSUMER_GROUP" "value" .Values.lightCatcherTabletennis.consumerGroup))) | indent 12 }}
        {{- /* The WHOLE profile, replacing the base's wildcard rules — and that
               replacement is the reason this is a second instance rather than a
               second stream on the first one. The base matches `info` on
               systems ["*"] and fires DJ Light for three seconds, so every point
               would trigger it; a profile has no rule that matches and does
               nothing, nor one that excludes a system.

               First match wins, in document order (light-catcher v1.0.2+).
               zaehlwerk tags every transition `transition=<kind>` and, where it
               went to one, `side=a|b` (zaehlwerk v0.3.0+). What has no rule — an
               undo, a correction that lowered a score — lights nothing and logs
               `no matching effect`.

               match_won is SUCCESS like set_won, so the tags are what tells them
               apart. A point's one-second flash does not cut the match effect
               short: the older timer stands down for the newer effect. */}}
        - target:
            kind: ConfigMap
            name: {{ printf "%s-profile" $name }}
          patch: |
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: {{ printf "%s-profile" $name }}
            data:
              profile.yaml: |
{{- if .Values.lightCatcherTabletennis.profileContent }}
{{ .Values.lightCatcherTabletennis.profileContent | trimSuffix "\n" | indent 16 }}
{{- else }}
                effects:
                  tabletennis-match:
                    systems: [tabletennis]
                    severity: [success]
                    tags: [transition=match_won]
                    fx: Fireworks
                    duration: 10
                    color: forest
                    segments: [0]
                    endpoint: {{ $wled }}
                  tabletennis-set:
                    systems: [tabletennis]
                    severity: [success]
                    tags: [transition=set_won]
                    fx: Rainbow
                    duration: 4
                    color: forest
                    segments: [0]
                    endpoint: {{ $wled }}
                  tabletennis-point-a:
                    systems: [tabletennis]
                    severity: [info]
                    tags: [transition=point, side=a]
                    fx: Solid
                    duration: 1
                    color: blue
                    segments: [0]
                    endpoint: {{ $wled }}
                  tabletennis-point-b:
                    systems: [tabletennis]
                    severity: [info]
                    tags: [transition=point, side=b]
                    fx: Solid
                    duration: 1
                    color: red
                    segments: [0]
                    endpoint: {{ $wled }}
{{- end }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
