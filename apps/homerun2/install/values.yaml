---
# Reference back to this catalog repo — used by the redis-stack / secrets / httpRoute
# sub-Applications to load apps/redis-stack/install + apps/homerun2/{secrets,httproute} from git.
catalog:
  repoURL: https://github.com/stuttgart-things/argocd.git
  targetRevision: HEAD

# ArgoCD AppProject all rendered Applications belong to.
project: default

# Where all rendered Applications deploy. Provide either `server` (cluster URL
# — typical for single-cluster deploys, e.g. https://kubernetes.default.svc)
# OR `name` (Argo-registered cluster name — useful for cross-cluster deploys
# from a management cluster). Mutually exclusive per ArgoCD; the schema
# enforces oneOf.
destination:
  server: https://kubernetes.default.svc
  # name: homerun2-dev
  namespace: homerun2

# Sync policy applied to all rendered Applications.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # Honour the chart's ignoreDifferences during sync and selfHeal, so the
    # controller never tries to rewrite fields the API server owns.
    - RespectIgnoreDifferences=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m

# trust-manager bundle used by k8s-pitcher (mounted at /etc/ssl/custom/trust-bundle.pem).
trustBundleConfigMap: cluster-trust-bundle

# K8sPitcherProfile ConfigMap name — what the k8s-pitcher Deployment patch
# mounts at /etc/k8s-pitcher. By default the ConfigMap itself is provisioned
# out-of-band (cluster-specific config) and the chart only references it; set
# `k8sPitcher.profileContent` to have the chart materialize it under this name
# instead.
# Name of the ConfigMap holding omni-pitcher's routing file. Only used when
# omniPitcher.routesContent is set, in which case the chart both creates it and
# mounts it, so the two cannot drift apart.
omniPitcherRoutesConfigMap: homerun2-omni-pitcher-routes

k8sPitcherProfileConfigMap: homerun2-k8s-pitcher-profile
# Out-of-band ConfigMap holding git-pitcher's watch-profile.yaml, used only
# when gitPitcher.inlineWatchConfig is false. Provision it yourself; the key
# must be `watch-profile.yaml` (the base's WATCH_CONFIG points at
# /config/watch-profile.yaml).
gitPitcherWatchConfigMap: homerun2-git-pitcher-watch-config

# Shared credentials. Each component's kustomize base ships its own per-component
# Secret (e.g. `homerun2-omni-pitcher-redis`, `homerun2-omni-pitcher-token`) which
# we patch inline via kustomize.patches in the rendered Application — same pattern
# the flux release.yaml uses, just expressed declaratively here.
#
# Inline literals are dev-only. For production, supply these values through an
# ArgoCD Vault Plugin / SOPS overlay so the Application's `helm.values` resolves
# them at sync time.
redisPassword: ""                         # pragma: allowlist secret
authToken: ""                             # pragma: allowlist secret

# Default profile = flux apps/homerun2/profiles/base: redis-stack + omni-pitcher + core-catcher + scout.
# Flip individual `enabled` keys to compose other profiles.

# redis-stack sub-Application (delegates to apps/redis-stack/install in this catalog).
redisStack:
  enabled: true
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/redis/redis
  chartVersion: 17.1.4
  serviceType: ClusterIP
  # Optional: have redis-stack read its password from a pre-existing Secret
  # rather than the inline `redisPassword` literal. Useful when ESO / CSI
  # populates the Secret out-of-band (e.g. the PR-preview Kyverno policy
  # generates an ExternalSecret per namespace). Leave empty for the inline-
  # literal path. When set, the same value must be the target Secret name
  # the ESO/CSI flow materializes.
  auth:
    existingSecret: ""
    existingSecretPasswordKey: redis-password
  persistence:
    enabled: true
    storageClass: standard
    size: 8Gi
  image:
    registry: ghcr.io
    repository: stuttgart-things/redis-stack-server
    # renovate: datasource=docker depName=ghcr.io/stuttgart-things/redis-stack-server
    tag: 7.2.0-v18
  sentinel:
    registry: ghcr.io
    repository: stuttgart-things/redis-sentinel
    # renovate: datasource=docker depName=ghcr.io/stuttgart-things/redis-sentinel
    tag: 7.4.2-debian-12-r9

# omni-pitcher (HTTP gateway → Redis Streams).
omniPitcher:
  enabled: true
  # v2.1.1+ retries Redis at startup (REDIS_STARTUP_TIMEOUT, 120s) and v2.1.2
  # adds the startupProbe that keeps liveness from killing it meanwhile;
  # v2.1.3 ends that wait on SIGTERM instead of sitting out the timeout.
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-omni-pitcher
  version: v2.3.3
  hostname: omni-pitcher.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the omni-pitcher kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # omni-pitcher. Flip to true on consumers (AppSet valuesObject) once they
  # consume an OCI tag built after stuttgart-things/homerun2-omni-pitcher#125.
  inlineHttpRoute: false

  # Config-driven stream routing (homerun2-omni-pitcher#105): an allowlist of
  # streams, a default, and ordered rules matching on system, author, tags or
  # title. Empty — the default — keeps the single-stream path, where
  # REDIS_STREAM takes every message and no ConfigMap, volume or env var is
  # rendered at all.
  #
  # Set it, and the chart materializes the routing file as a ConfigMap and
  # mounts it. Worth setting as soon as a second consumer wants a stream of its
  # own: without a rule a producer's messages land on the default stream, the
  # pitch still succeeds, and a catcher watching the other stream shows nothing
  # while both sides look healthy.
  #
  #   routesContent: |
  #     streams: [messages, tabletennis]
  #     default_stream: messages
  #     routes:
  #       - match: { system: tabletennis }
  #         stream: tabletennis
  routesContent: ""

  # Where the routing file is mounted. ROUTES_CONFIG points at
  # <routesPath>/routes.yaml.
  routesPath: /config/routing

# core-catcher (Redis Streams consumer + web dashboard).
coreCatcher:
  enabled: true
  # v1.0.1+ retries Redis at startup instead of exiting on the first dial;
  # v1.0.2 adds the startupProbe covering that wait; v1.0.3 ends the wait
  # on SIGTERM.
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher
  version: v1.1.1
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-core-catcher-kustomize
  kustomizeVersion: v1.1.1               # may differ from image tag (e.g. -web suffix on older versions)
  hostname: core-catcher.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the core-catcher kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # core-catcher. Flip to true on consumers (AppSet valuesObject) once they
  # consume a kustomize OCI tag built after
  # stuttgart-things/homerun2-core-catcher#63 (which enables HTTPRoute
  # rendering in the kustomize base).
  inlineHttpRoute: false
  # Optional override for REDIS_STREAM (the stream name core-catcher
  # consumes). When empty, the kustomize base default (messages) is
  # used. Set this when co-tenanting with a producer that writes to a
  # different stream — e.g. git-pitcher's feat/14 changed its default
  # to `homerun`, so the git-pitcher PR-preview AppSet pins
  # coreCatcher.redisStream: homerun to keep them aligned.
  redisStream: ""

# scout (web dashboard / monitoring).
scout:
  enabled: true
  # v0.8.3 re-creates its RediSearch index until it exists instead of trying
  # once at startup. v0.11.1 restarts itself when its ScoutProfile changes;
  # the chart no longer rolls scout for a changed profile, so older versions
  # would keep the profile they started with. v0.12.0 adds the weekly window
  # and /analytics/messages that aiPitcher's weekly mode and activity read.
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-scout
  version: v0.12.0
  hostname: scout.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the scout kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # scout. Flip to true on consumers (AppSet valuesObject) once they
  # consume a kustomize OCI tag built after
  # stuttgart-things/homerun2-scout#55 (which enables HTTPRoute rendering
  # in the kustomize base).
  inlineHttpRoute: false
  # ScoutProfile CR (apps/homerun2/scout-profile, sync-wave 1). scout reads it
  # at startup and every SCOUT_INTERVAL after, restarting itself when it was
  # created, changed or deleted; without one it logs "could not load
  # ScoutProfile" and runs on its environment defaults, which leave alerting off. `name` must match the
  # base's SCOUT_PROFILE_NAME (`default`). With alerting.pitcherURL set, scout
  # gets ALERT_PITCHER_TOKEN from homerun2-omni-pitcher-token - do not put a
  # pitcherToken into spec (the schema rejects it).
  profile:
    enabled: false
    name: default
    spec:
      retention:
        enabled: true
      # alerting:
      #   pitcherURL: http://homerun2-omni-pitcher.homerun2.svc.cluster.local  # base URL; scout appends /pitch
      #   errorThreshold: 20
      #   criticalThreshold: 5
      #   cooldown: 30m
    # The same spec as a YAML string — what a cluster annotation can carry
    # (platforms/homerun2: …/scout-profile). Set, it REPLACES `spec` above and
    # renders the ScoutProfile even with `enabled: false`. Empty (the default)
    # keeps `enabled` + `spec`. With aiPitcher on, the ai-* systems are added
    # to a `digest.excludeSystems` it lists (see aiPitcher below).
    #
    #   content: |
    #     retention:
    #       enabled: true
    #       ttl: 360h
    #     alerting:
    #       pitcherURL: http://homerun2-omni-pitcher.homerun2.svc.cluster.local
    #     digest:
    #       enabled: true
    #       timezone: Europe/Berlin
    #       dailyAt: "07:00"
    content: ""
  # SCOUT_RETENTION_TTL env of scout (how long messages are kept; scout's own
  # default is 48h). Empty sets nothing — except with aiPitcher's weekly mode
  # on, which needs 15 days (this week and the one before) and gets 360h. A
  # ScoutProfile's retention.ttl wins over this env either way.
  retentionTTL: ""

# k8s-pitcher (informers/collectors → omni-pitcher). Often deployed in a different
# namespace from the rest of the stack; override `namespace` if needed.
k8sPitcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-k8s-pitcher
  version: v1.2.1
  namespace: homerun2
  # When true, keep the K8sPitcherProfile ConfigMap shipped inside the
  # k8s-pitcher kustomize OCI instead of deleting it and remounting an
  # out-of-band one. Set this on PR-preview consumers, whose ephemeral
  # namespaces have no out-of-band profile ConfigMap — the preview kustomize
  # OCI carries a namespace-scoped profile (built from
  # tests/kcl-deploy-profile-preview.yaml in the SUT repo).
  inlineProfile: false
  # The K8sPitcherProfile document, as a YAML string. Empty (the default)
  # keeps the historical contract: `k8sPitcherProfileConfigMap` names a
  # ConfigMap somebody provisioned out-of-band and the chart only references
  # it. Set it, and templates/k8s-pitcher-profile.yaml materializes that
  # ConfigMap for you via a sub-Application at sync-wave -10 — the same shape
  # apps/machinery/install uses for machinery's config.json.
  #
  # Ignored when inlineProfile is true (that branch never remounts).
  #
  # Worth scoping deliberately: the profile shipped in the kustomize base
  # watches Pods and Events across ALL namespaces every 15-30s, and every one
  # of those becomes a message in the stream that core-, light- and
  # led-catcher read.
  #
  # The profile's pitcher is the in-cluster omni-pitcher
  # (http://homerun2-omni-pitcher.<destination.namespace>.svc.cluster.local/pitch)
  # and its token auth.tokenFrom.secretKeyRef homerun2-k8s-pitcher-token /
  # auth-token in k8sPitcher.namespace — the Secret templates/secrets.yaml
  # materializes.
  profileContent: ""
  # Extra ClusterRole rules for the profile. The kustomize base's ClusterRole
  # homerun2-k8s-pitcher grants get/list/watch on pods, nodes, events,
  # deployments and replicasets and get on secrets (the profile's token), which
  # covers the base profile. A profile that informs on anything else (a CRD,
  # jobs, ...) needs its rule here, or the informer fails with "forbidden".
  #
  #   extraRbacRules:
  #     - apiGroups: [batch]
  #       resources: [jobs, cronjobs]
  #       verbs: [get, list, watch]
  extraRbacRules: []

# light-catcher (Redis Streams consumer → WLED HTTP).
lightCatcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-light-catcher
  version: v1.7.0
  hostname: light-catcher.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the light-catcher kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # light-catcher. Flip to true on consumers (AppSet valuesObject) once they
  # consume a kustomize OCI tag built after
  # stuttgart-things/homerun2-light-catcher#16 (which enables HTTPRoute
  # rendering in the kustomize base).
  inlineHttpRoute: false

# wled-mock (mock WLED device + dashboard, for dev/testing).
# Note: the homerun2-wled-mock-kustomize OCI ships from the
# homerun2-light-catcher repo's kcl-wled-mock module and is tagged with
# that repo's release version — published tags start at v0.4.1, so any
# pin below that 404s on resolve.
wledMock:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-wled-mock
  version: v1.7.0
  hostname: wled-mock.example.com

# config-viewer (read-only view of which alert triggers what in which catcher,
# stuttgart-things/homerun-library#122). Reads the Deployments and ConfigMaps of
# destination.namespace through the Kubernetes API with the Role its kustomize
# base ships (get/list deployments + configmaps, nothing else). No Redis, no
# Secrets. The base ships its HTTPRoute: set inlineHttpRoute to patch it in
# place, otherwise the standalone homerun2-httproute Application renders one.
configViewer:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-config-viewer
  version: v0.2.3
  hostname: config-viewer.example.com
  inlineHttpRoute: false

# demo-pitcher (web UI for manually pitching messages to Redis Streams).
demoPitcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-demo-pitcher
  version: v2.0.6
  hostname: demo-pitcher.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the demo-pitcher kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # demo-pitcher. Flip to true on consumers (AppSet valuesObject) once they
  # consume a kustomize OCI tag built after
  # stuttgart-things/homerun2-demo-pitcher#25 (which enables HTTPRoute
  # rendering in the kustomize base).
  inlineHttpRoute: false
  # When set, the chart patches the Deployment to add PITCH_TARGET=omni-pitcher +
  # OMNI_PITCHER_URL=<this URL>, flipping demo-pitcher's /pitch endpoint
  # from its default RedisPitcher backend to an HTTPPitcher that posts to
  # the given omni-pitcher endpoint. Used in PR-preview envs to chain
  # demo-pitcher → omni-pitcher → Redis so reviewers see the full HTTP
  # round-trip in the UI (otherwise the UI's "Target Pitcher URL" shows
  # demo-pitcher's compiled-in fallback http://localhost:4000 and misleads
  # the reviewer about where pitches actually go).
  omniPitcherUrl: ""

# led-catcher (Redis Streams consumer → LED display).
ledCatcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-led-catcher
  version: v0.16.0
  hostname: led-catcher.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the led-catcher kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # led-catcher. Flip to true on consumers (AppSet valuesObject) once they
  # consume a kustomize OCI tag built after
  # stuttgart-things/homerun2-led-catcher#32 (which enables HTTPRoute
  # rendering in the kustomize base).
  inlineHttpRoute: false

# notification-catcher (Redis Streams consumer → MS Teams / generic webhooks).
# The other half of the Alertmanager/Grafana chain: omni-pitcher takes the
# alert, this fans it out. No Service and no route — it only consumes.
notificationCatcher:
  enabled: false
  # v3.0.1 waits for Redis at startup (REDIS_STARTUP_TIMEOUT) instead of exiting.
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-notification-catcher
  version: v3.1.0
  # Stream to consume. `messages` is where omni-pitcher's default_stream puts
  # everything; a cluster that routes alerts onto their own stream (the flux
  # side sends /pitch/grafana to `alerts`) sets that here instead.
  redisStream: messages
  # Several streams, comma-separated (e.g. `messages,tabletennis`), consumed by
  # the one Deployment: the catcher reads REDIS_STREAMS first and only falls
  # back to redisStream above when it is empty. Empty (the default) renders no
  # REDIS_STREAMS at all, i.e. redisStream alone.
  redisStreams: ""
  # true = log what would be sent and send nothing. Worth leaving on until the
  # notify config below is known-good, because the first wrong filter posts to
  # a real Teams channel.
  dryRun: false
  # ConfigMap holding config.yaml — which stream entries go to which webhook,
  # with filters. Created by this chart only when notifyConfig below is set;
  # otherwise provision it out-of-band (cluster-specific, the same way
  # k8sPitcherProfileConfigMap is). See the README for the shape.
  notifyConfigMap: homerun2-notification-catcher-notify
  # The notify config itself, as a YAML string. Empty (the default) keeps the
  # out-of-band contract above. Set it, and
  # templates/notification-catcher-notify.yaml materializes notifyConfigMap
  # via a sub-Application at sync-wave -10 and the Pod rolls whenever the
  # content changes. `${TEAMS_WEBHOOK_URL}` placeholders pass through
  # verbatim — the catcher expands them from its Secret at runtime.
  #
  #   notifyConfig: |
  #     outputs:
  #       - name: teams-grafana-alerts
  #         type: msteams
  #         webhook_url: "${TEAMS_WEBHOOK_URL}"
  #         filters:
  #           match:
  #             author: grafana
  notifyConfig: ""
  # Webhook URL. Empty (the default) deletes the Secret the base ships, so an
  # out-of-band or ESO-managed `homerun2-notification-catcher-secrets` takes
  # over — which is the right way round for a credential; the chart renders
  # that ExternalSecret itself with secrets.teamsWebhookVaultSecretName.
  # Setting it here inlines a literal (and suppresses the ExternalSecret), so
  # only do that from an ArgoCD Vault Plugin / SOPS overlay.
  teamsWebhookUrl: ""                       # pragma: allowlist secret

# git-pitcher (watches Git repos → Redis Streams).
gitPitcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-git-pitcher
  version: v1.3.1
  hostname: git-pitcher.example.com
  # Option B from stuttgart-things/argocd#116 — when true, the chart patches
  # the HTTPRoute shipped inside the git-pitcher kustomize OCI (parentRef +
  # hostname) and the standalone homerun2-httproute Application skips
  # git-pitcher. Flip to true on consumers (AppSet valuesObject) once they
  # consume a kustomize OCI tag built after
  # stuttgart-things/homerun2-git-pitcher#27 (which enables HTTPRoute
  # rendering in the kustomize base).
  inlineHttpRoute: false
  # true = keep the watch profile shipped inside the kustomize OCI (which
  # repos are polled, at which interval, for which events). false = delete it
  # and mount gitPitcherWatchConfigMap instead — cluster-specific, and NOT
  # created by this chart, the same way k8sPitcherProfileConfigMap is not.
  inlineWatchConfig: true

# homerun2-ai-pitcher: CronJobs, AI summaries of scout's digest (and the
# schedule-pitcher's open findings) via OpenRouter
# (stuttgart-things/homerun2-ai-pitcher, stuttgart-things/homerun-library#135).
# Needs scout and omni-pitcher. Pairs with schedulePitcher below: with it on,
# every run also reads its open findings from the in-cluster Service.
#
# The OpenRouter key is optional on purpose (fail-open): with
# secrets.openrouterVaultSecretName set, an ExternalSecret reads property
# `openrouterApiKey` from that SHARED entry (e.g. `_openrouter`); without it
# every run still pitches the plain digest, marked "[AI n/a]".
#
# Each mode is its own CronJob and pitches as its own system; scout leaves
# those systems out of its digests whenever this is on (templates/scout.yaml),
# so no digest counts an AI summary:
#   mode        CronJob                          system          ticker
#   morning     homerun2-ai-pitcher              ai-digest       yes (ai-ticker)
#   evening     homerun2-ai-pitcher-evening      ai-evening      no
#   weekAhead   homerun2-ai-pitcher-week-ahead   ai-week-ahead   no
#   weekly      homerun2-ai-pitcher-weekly       ai-weekly       yes (ai-ticker)
# weekly reads scout's weekly window (scout v0.12+) and needs 15 days of
# retention; see scout.retentionTTL.
aiPitcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-ai-pitcher-kustomize
  version: v0.4.1
  timeZone: Europe/Berlin
  # Suspends every mode at once.
  suspend: false
  # A disabled mode's CronJob is not deployed. Defaults: all four, on the
  # schedules the kustomize base ships (= LabUL platform-sthings).
  modes:
    morning:
      enabled: true
      schedule: "45 7 * * 1-5"
    evening:
      enabled: true
      schedule: "45 18 * * 1-5"
    weekAhead:
      enabled: true
      schedule: "50 7 * * 1"
    weekly:
      enabled: true
      schedule: "0 15 * * 5"
  # OpenRouter model id or a comma-separated list, tried in groups of 3.
  # Most reliable free models first (local runs 2026-10-14,
  # stuttgart-things/homerun2-ai-pitcher#4); openrouter/free alone can route
  # to tiny or classifier models. Applied to all modes.
  model: nvidia/nemotron-3-super-120b-a12b:free,cohere/north-mini-code:free,nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-31b-it:free,openrouter/free
  language: German
  # More tries after a failed model call (free models fail often).
  retries: 2
  # A schedule-pitcher NOT installed by this chart (schedulePitcher.enabled
  # false), e.g. a central one elsewhere: its URL and the Secret (key
  # auth-token) holding its API token. Ignored while schedulePitcher is on —
  # then the in-cluster Service and homerun2-schedule-pitcher-token are used.
  # Both empty/absent: the findings are skipped.
  schedulePitcherURL: ""
  schedulePitcherTokenSecret: homerun2-schedule-pitcher-token

# homerun2-schedule-pitcher, central instance
# (stuttgart-things/homerun2-schedule-pitcher): token/certificate expiry
# checks, reminders and findings reported by agents and other jobs
# (POST /findings), delivered in office hours through the in-cluster
# omni-pitcher. Serves a web UI and JSON API on port 80 (route below);
# aiPitcher reads its open findings.
#
# Secrets (secrets.enabled): its own API/UI/findings token from the
# per-cluster Vault property `schedulePitcherAuthToken` (a token of its own:
# agents on other clusters carry it), the Redis password from
# `redisPassword`. It pitches with omni-pitcher's token (homerun2-omni-pitcher-token).
schedulePitcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-schedule-pitcher
  version: v1.10.0
  hostname: schedule-pitcher.example.com
  # Option B from stuttgart-things/argocd#116 — patch the HTTPRoute the
  # kustomize OCI ships instead of rendering one in the standalone
  # homerun2-httproute Application.
  inlineHttpRoute: false
  # ConfigMap the chart creates (sub-Application
  # apps/homerun2/schedule-pitcher-profile, sync-wave -10) and the Deployment
  # mounts as profile.yaml. The one the kustomize base ships is deleted.
  profileConfigMap: homerun2-schedule-pitcher-profile
  # The SchedulePitcherProfile document as a YAML string: checks, reminders,
  # office hours. Empty renders a minimal profile — no checks of its own, the
  # in-cluster omni-pitcher (grafana format), Europe/Berlin — which still
  # takes findings from agents and keeps the heartbeat. A changed profile
  # rolls the Pod (it is read at start).
  #
  # Pitch to the in-cluster omni-pitcher, e.g.
  #   addr: http://homerun2-omni-pitcher.homerun2.svc.cluster.local/pitch/grafana
  # The token is injected (PITCHER_TOKEN), so no spec.pitcher.auth.
  #
  #   profileContent: |
  #     apiVersion: homerun2.sthings.io/v1alpha1
  #     kind: SchedulePitcherProfile
  #     metadata:
  #       name: my-cluster
  #     spec:
  #       pitcher:
  #         addr: http://homerun2-omni-pitcher.homerun2.svc.cluster.local/pitch/grafana
  #         format: grafana
  #       defaults:
  #         timezone: Europe/Berlin
  #       checks:
  #         - id: git-pitcher-github-token
  #           type: github-token-expiry
  #           tokenFrom:
  #             secretKeyRef: { name: homerun2-git-pitcher-github, namespace: homerun2, key: token }
  profileContent: ""
  # get on exactly these Secrets for the profile's tokenFrom.secretKeyRef
  # checks: one Role + RoleBinding (homerun2-schedule-pitcher-secrets) per
  # namespace for the ServiceAccount homerun2-schedule-pitcher. The kustomize
  # base ships no Roles. The namespaces must exist.
  #
  #   secretAccess:
  #     - namespace: homerun2
  #       secrets: [homerun2-git-pitcher-github]
  #     - namespace: argocd
  #       secrets: [argocd-repo-stuttgart-things]
  secretAccess: []

# homerun2-sound-catcher (stuttgart-things/homerun2-sound-catcher): messages
# as clips and spoken announcements. In a cluster there is no speaker — the
# browser player page behind the route is where they are heard
# (SOUND_SINKS=browser). Rules and quiet hours are the kustomize base's default
# profile. One replica, Recreate: its history lives in the Pod.
#
# Secrets (secrets.enabled): the Redis password from `redisPassword`, and the
# bearer token of /play, replay-on-speaker and mute from `authToken` — the same
# token that can already pitch anything onto the stream it reads. Without
# secrets.enabled neither Secret exists (both optional in the Deployment):
# Redis then refuses the connection.
soundCatcher:
  enabled: false
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/homerun2-sound-catcher
  version: v1.0.0
  hostname: sound-catcher.example.com
  # Comma-separated streams to announce.
  redisStreams: messages

# Gateway API HTTPRoutes for every enabled component that exposes one.
httpRoute:
  enabled: true
  gateway:
    name: cilium-gateway
    namespace: default

# Optional ExternalSecrets sub-Application (apps/homerun2/secrets in this
# catalog). Off by default — when enabled, renders one ExternalSecret per
# Secret-needed-by-the-stack (omni-pitcher auth-token + redis password,
# redis-stack auth) against the named ClusterSecretStore and Vault KV
# secret. Useful for steady-state envs where the chart's `authToken` /
# `redisPassword` literals are left empty (the chart deletes the kustomize-
# shipped Secrets in that case, expecting an ESO-managed Secret to take
# their place).
#
# The named ClusterSecretStore must already exist on the workload cluster.
# For homerun2-dev, `vault-homerun2-pr` (shared with the PR-preview path)
# is the pragmatic choice; staging + prod should point at dedicated Vault
# paths when those are provisioned.
secrets:
  enabled: false
  clusterSecretStoreName: vault-homerun2-pr
  vaultSecretName: preview-env
  # Entry the git-pitcher's `githubToken` comes from, when it is not the
  # installation's own: a per-cluster entry holds authToken + redisPassword
  # only, the PAT is shared (e.g. `_git-pat` in the homerun2 mount). Same store.
  # Empty reads it from vaultSecretName, as before.
  githubTokenVaultSecretName: ""
  # Entry the notification-catcher's Teams webhook comes from (property
  # `teamsWebhookUrl`), e.g. `_teams-webhook` — shared like the PAT, same
  # store. Set, and with notificationCatcher enabled and its teamsWebhookUrl
  # empty, an ExternalSecret materializes `homerun2-notification-catcher-secrets`
  # (key TEAMS_WEBHOOK_URL). Empty renders none: the Secret then has to come
  # from the literal or out-of-band.
  teamsWebhookVaultSecretName: ""
  # Entry the ai-pitcher's OpenRouter key comes from (property
  # `openrouterApiKey`), e.g. `_openrouter` — shared like the webhook, same
  # store. Set, and with aiPitcher enabled, an ExternalSecret materializes
  # `homerun2-ai-pitcher-openrouter` (key api-key). Empty renders none and the
  # ai-pitcher runs without AI: it pitches the plain digest marked "[AI n/a]".
  openrouterVaultSecretName: ""
  refreshInterval: 1h

# Optional smoke-test sub-Application (apps/homerun2/smoke-test in this
# catalog). Off by default. When enabled, renders a Job that probes the
# deployed omni-pitcher: waits for /health on the in-cluster Service,
# asserts an unauthenticated POST /pitch is rejected, posts a fixture with
# the bearer token, and — with `external.enabled` — repeats all three
# through the public HTTPRoute with TLS verified against the trust bundle.
#
# The Job is rendered as a REGULAR resource of its own Application, not as
# a PostSync hook: an Application whose desired state is only hooks has
# nothing to apply, so ArgoCD reports it Synced without running a sync
# operation and the hook never fires (observed on homerun2-test1). As a
# regular resource it runs on creation and ArgoCD's Job health check turns
# a failed assertion into a Degraded Application — the signal we want.
# Re-run it by deleting the Job; automated sync recreates it.
#
# Requires the omni-pitcher auth-token Secret to exist in
# `destination.namespace` — i.e. either `authToken` inline or
# `secrets.enabled`.
smokeTest:
  enabled: false
  # renovate: datasource=docker depName=curlimages/curl
  image: curlimages/curl:8.23.0
  # runAsUser must stay numeric — see apps/homerun2/smoke-test/values.yaml.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
  hook:
    enabled: false
    deletePolicy: BeforeHookCreation
  job:
    backoffLimit: 2
    # Empty = no TTL. A number makes the test recurring: the Job is
    # garbage-collected, ArgoCD sees the drift and recreates it.
    ttlSecondsAfterFinished: null
    activeDeadlineSeconds: 900
  healthCheck:
    attempts: 60
    intervalSeconds: 5
  unauthenticated:
    enabled: true
    expectStatus: 401
  external:
    # Second pass through the gateway. The hostname is NOT configured here —
    # it is taken from `omniPitcher.hostname`, so the test can never drift
    # from the route the chart actually publishes.
    enabled: true
    caConfigMap: cluster-trust-bundle
    caKey: trust-bundle.pem
    # A Cilium L2-announced LoadBalancer VIP is not reachable from Pods on
    # the same cluster, so the Job dials the gateway's own Service
    # (`cilium-gateway-<gateway>.<ns>.svc.cluster.local`, derived from
    # httpRoute.gateway) while keeping the public hostname for SNI, Host and
    # certificate validation. Everything but the VIP itself is exercised.
    connectToGateway: true
    # Explicit override; wins over connectToGateway. Empty + no derivation
    # means plain DNS resolution of the public hostname.
    connectTo: ""
    insecure: false
  # core-catcher, scout, light-catcher, wled-mock, demo-pitcher and
  # led-catcher are probed automatically when enabled — /health for
  # core-catcher, scout and demo-pitcher, /healthz for the rest. Use this
  # list for anything else — one entry per component,
  # `{name, service, port, path?, hostname?}`; `hostname` adds the same probe
  # through the public HTTPRoute.
  extraProbes: []
  events:
    - title: Smoke Test
      message: omni-pitcher smoke test — authenticated pitch via in-cluster Service
      severity: info
      author: smoke-test
      system: smoke-test
      tags: smoke,internal

# Whether deleting the parent Application also prunes what it deployed.
#
# ON (the default) puts a `resources-finalizer.argocd.argoproj.io` on every
# child Application this chart renders, so Argo prunes the workloads before
# removing the child. A per-PR preview wants that: a closed PR must take its
# namespace with it. The value is passed on to apps/redis-stack/install, whose
# Application sits one level further down; it has to be, or Redis is the one
# workload a teardown leaves behind.
#
# OFF is what a long-lived PLATFORM install wants, and the platforms/ AppSets
# set it. There an opt-out should stop Argo CD managing the stack, not delete
# it — and against an already deregistered cluster the prune can never
# complete, so the child Applications hang in Terminating and then block their
# AppProject (stuttgart-things/argocd#324). Without the finalizer the children
# are removed immediately and the workloads are left running, unmanaged, which
# is the intended outcome for an opt-out.
cascadingDelete: true

# Stakater Reloader annotation (reloader.stakater.com/auto) on every component
# Deployment and on the redis-stack StatefulSet: roll them when a Secret or
# ConfigMap they reference changes. All of them read the Redis password and
# token only at start, so without this a rotated secret sits unused until each
# one is restarted by hand. A no-op on clusters without the Reloader controller
# (infra/reloader/install), so it is on by default — same as apps/zaehlwerk.
reloader: true
