{{- $recovery := .Values.recovery | default dict }}
{{- $serverName := .Values.backup.serverName | default "" }}
{{- if and $recovery.enabled .Values.backup.enabled }}
{{- /* Unset, the plugin archives under the Cluster name -- so that is what
       has to differ from the source, not the value of backup.serverName. */}}
{{- $archivesAs := $serverName | default .Values.name }}
{{- if eq $archivesAs ($recovery.sourceServerName | default "") }}
{{- fail (printf "this Cluster would archive as %q, the server it recovers from: set backup.serverName to something else. The plugin refuses a non-empty archive, so it would come up healthy and never back itself up" $archivesAs) }}
{{- end }}
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Values.namespace | quote }}
  {{- if .Values.protect }}
  annotations:
    # The PVC carries an ownerReference to this Cluster, and CNPG has no
    # retention flag — delete the Cluster and the volume is garbage-collected
    # with it. Two ordinary GitOps events reach that: the resource falls out of
    # the render (Prune), or the Application is deleted and its
    # resources-finalizer cascades (Delete). Both are switched off here, on the
    # RESOURCE rather than on the Application, so the protection travels with
    # the object instead of depending on how a consumer wires its sync policy.
    #
    # The price is honest: this database has to be removed by hand. For an
    # object whose deletion cannot be restored from git, that is the right
    # trade.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  {{- end }}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName | quote }}
  enableSuperuserAccess: {{ .Values.enableSuperuserAccess }}
  storage:
    size: {{ .Values.storage.size | quote }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  {{- if .Values.backup.enabled }}
  # WAL goes through the Barman Cloud plugin into the ObjectStore of the same
  # name (templates/backup.yaml). Adding this to a running Cluster restarts it.
  plugins:
    {{- /* `enabled` is the CRD default, written out. `plugins` is an atomic
           list, so Argo compares each item whole: a default the API server
           fills in inside an item is a diff on every comparison, and
           selfHeal re-applies the Cluster in a loop that changes nothing.
           Same for `target` in backup.yaml. */}}
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.name | quote }}
        {{- with $serverName }}
        # The directory inside the bucket this Cluster archives into. Unset,
        # the plugin uses the Cluster name — which is why a Cluster rebuilt
        # under the old name would write into the old server's WAL. Set here,
        # archiving starts a path of its own.
        serverName: {{ . | quote }}
        {{- end }}
  {{- end }}
  bootstrap:
  {{- if $recovery.enabled }}
    # Read only at creation. On a Cluster that already exists this changes
    # nothing — including after the rebuild it was switched on for.
    recovery:
      source: origin
      {{- with $recovery.recoveryTarget }}
      recoveryTarget:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- else }}
    initdb:
      database: {{ .Values.bootstrap.database | quote }}
      owner: {{ .Values.bootstrap.owner | quote }}
      encoding: {{ .Values.bootstrap.encoding | quote }}
      localeCollate: {{ .Values.bootstrap.localeCollate | quote }}
      localeCType: {{ .Values.bootstrap.localeCType | quote }}
      secret:
        name: {{ .Values.bootstrap.secretName | quote }}
  {{- end }}
  # The owner role's password, reconciled instead of inherited.
  #
  # `bootstrap` is read ONLY at creation, and on the recovery path it is not
  # read at all: the role and its SCRAM verifier come out of the restored data,
  # so a recovered Cluster accepts the SOURCE cluster's password and nothing
  # else. Measured on homerun2-dev2, 2026-09-27: the data restored perfectly
  # (18 players, 77 matches, identical last played_at) and the app's `migrate`
  # init container crashlooped anyway --
  #
  #   failed SASL auth: FATAL: password authentication failed
  #   for user "schmetterpause" (SQLSTATE 28P01)
  #
  # -- because the ClusterStack model gives every cluster its own Vault entry
  # (crossplane-configurations#464), so the consumer's password is by design
  # NOT the source's. Nothing reports the mismatch; the Cluster is "in healthy
  # state" and only the app fails.
  #
  # Declaring the role here makes CNPG reconcile the password from the same
  # Secret the app reads, on every reconcile, so recovery and rotation both
  # land without a hand-run ALTER ROLE.
  #
  # On an EXISTING cluster this is a no-op as long as the Secret already holds
  # the live password -- which it must, or the app would not be connecting.
  # Note that CNPG sets the attributes it does not list to their defaults; the
  # owner role initdb creates has LOGIN and nothing else, which is what is
  # written out below.
  managed:
    roles:
      - name: {{ .Values.bootstrap.owner | quote }}
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        # The two attributes CNPG's webhook defaults on admission. Written out
        # because `roles` is an ATOMIC list in the CRD (no list-type): Argo owns
        # the whole list, and its diff -- local, without the webhook -- compared
        # this list to the defaulted one forever. Every schmetterpause database
        # Application sat OutOfSync and re-synced every five minutes while the
        # server saw nothing to change. Both values are CNPG's defaults, so on a
        # live cluster this changes nothing.
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: {{ .Values.bootstrap.secretName | quote }}
  {{- if $recovery.enabled }}
  # The server to replay from, through the read-only ObjectStore in
  # templates/backup.yaml. Reading only: nothing here can write to that path.
  externalClusters:
    - name: origin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: {{ printf "%s-origin" .Values.name | quote }}
          serverName: {{ $recovery.sourceServerName | quote }}
  {{- end }}
