---
# Reference back to this catalog repo — the database sub-Application loads
# apps/schmetterpause/database from git.
catalog:
  repoURL: https://github.com/stuttgart-things/argocd.git
  targetRevision: HEAD

# Base name for the rendered Applications. Empty means derive it from the
# destination as `schmetterpause-<sha1(destination)[:8]>`, because both
# Applications land in the `argocd` namespace of ONE management cluster: a fixed
# name would make two clusters' deployments of this app collide on the same
# object. Set it to something readable when this catalog entry is used for a
# single cluster — that is what the homerun2-test1 consumer does.
applicationName: ""

# AppProject both rendered Applications belong to.
project: default

# Where they deploy. Provide either `server` (cluster URL) or `name` (the
# Argo-registered cluster name); mutually exclusive per ArgoCD.
destination:
  server: https://kubernetes.default.svc
  # name: homerun2-test1
  namespace: schmetterpause

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # Honour the chart's ignoreDifferences during sync and selfHeal, so the
    # controller never tries to rewrite fields the API server owns.
    - RespectIgnoreDifferences=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m

# Tag of the published kustomize artifact. CI tags the artifact and the
# container image with the same commit SHA and bakes that image reference into
# the rendered Deployment — so pinning this pins the application version too,
# and no image patch is needed here.
#
# UPSTREAM IS PRE-1.0, AND THAT CHANGES WHAT A BUMP MEANS HERE. The patch
# surface this chart drives — gateway name, hostname in three places, both
# secretStoreRefs, the two listener names — is the interface between the two
# repositories, and it is still moving. Under 0.x a rename in it is a MINOR
# bump, not a major, so a minor of this package can require a change here.
# renovate.json keeps these two packages out of the shared images group and
# off auto-merge for exactly that reason; do not fold them back in.
#
# renovate: datasource=docker depName=ghcr.io/stuttgart-things/schmetterpause-kustomize
version: v0.11.0

# FQDN the app is served on. Patched into both HTTPRoutes and into
# SP_PUBLIC_BASE_URL, which the app uses to build absolute links — the base
# ships schmetterpause.cluster.example.com in all three places.
hostname: schmetterpause.cluster.example.com

# Display name of the player who gets the admin flag at every start
# (SP_BOOTSTRAP_ADMIN, schmetterpause ADR-0008). Empty sets nothing. The player
# has to have joined first; a name nobody has is a warning in the log, not a
# failed start. Not a secret: it grants nothing without that player's own PIN.
bootstrapAdmin: ""

# Gateway the HTTPRoutes attach to. The base names a Gateway called `gateway`
# in `default`.
#
# The listener names are values because the patches replace `parentRefs`
# wholesale and would otherwise bake them in: a Gateway whose listeners are
# named differently would leave both routes attached to EVERY listener, and the
# redirect would then redirect HTTPS to HTTPS — a loop that turns nothing red.
# The upstream base parametrises the same two names.
gateway:
  name: gateway
  namespace: default
  sectionNameHTTPS: https
  sectionNameHTTP: http

# ClusterSecretStore the two ExternalSecrets read from. The base points at
# `vault-cluster`.
secretStore:
  kind: ClusterSecretStore
  name: vault-cluster

# Entry under the store's mount that session-key, username and password come
# from. Empty keeps the base's `schmetterpause` — one fleet-wide entry, which is
# what every hand-seeded environment uses.
#
# A ClusterStack writes one entry PER CLUSTER instead (crossplane-configurations
# #464): `<cluster>` in the mount, and `<cluster>-scoreboard` for the token.
# Setting this patches the key of all three remoteRefs. Each patch first TESTS
# that the base still asks for `schmetterpause` at that index, so a base that
# reorders or renames its data fails the sync loudly instead of reading the
# wrong property from the right entry.
vaultEntry: ""

# CloudNativePG database, rendered from apps/schmetterpause/database as its own
# Application at sync-wave -10 — the app's Deployment waits on the Secret the
# database bootstraps from, so the database goes first.
#
# Needs the CNPG operator on the target cluster (infra/cloudnative-pg/install).
database:
  enabled: true
  name: schmetterpause-db
  instances: 1
  # PostgreSQL 18, the major schmetterpause runs on everywhere else — Compose,
  # its kcl default and Azure — so a dump moves between them (schmetterpause
  # ADR-0016, #213). A dump only ever goes into the same or a newer major.
  #
  # For a consumer that does not set this, raising it is an offline in-place
  # major upgrade of an existing Cluster by CloudNativePG (pg_upgrade --link):
  # the database is down for the upgrade. A Cluster holding data worth keeping
  # should pin imageName in its consumer file, as homerun2-test1 does, and
  # take a backup before moving it.
  imageName: ghcr.io/cloudnative-pg/postgresql:18
  storage:
    size: 8Gi
    storageClass: ""
  bootstrap:
    database: schmetterpause
    owner: schmetterpause
    secretName: schmetterpause-db
    encoding: UTF8
    localeCollate: C
    localeCType: C
  enableSuperuserAccess: false
  # Prune=false + Delete=false on the Cluster object. On by default, and it has
  # to be: the PVC holds an ownerReference on the Cluster, so a prune or a
  # cascading Application delete takes the data with it.
  #
  # Switch it off ONLY where the database is meant to die with its Application
  # — a per-PR preview is the case it exists for. With it on, tearing a preview
  # down leaves the Postgres pod, its Services and its volume running in a
  # namespace nothing points at any more.
  protect: true
  # Backups through the Barman Cloud plugin -- WAL archiving and a daily base
  # backup. Off by default. Every field is explained in
  # apps/schmetterpause/database/values.yaml; switching it on for an existing
  # Cluster restarts its Postgres pod. secretStore.name empty means the
  # top-level secretStore above.
  backup:
    enabled: false
    endpointURL: ""
    destinationPath: ""
    # Server directory inside destinationPath. Empty means the Cluster name,
    # and it is that effective name which must differ from
    # recovery.sourceServerName -- see database.recovery below.
    serverName: ""
    retentionPolicy: 30d
    schedule: "0 0 3 * * *"
    immediate: false
    secretStore:
      kind: ClusterSecretStore
      name: ""
    remoteKey: ""
    accessKeyProperty: access_key
    secretKeyProperty: secret_key
    caConfigMap: cluster-trust-bundle
    caKey: trust-bundle.pem
  # Rebuild: bring the Cluster up from another server's backups instead of an
  # empty database. Off by default. It reads that bucket through a second,
  # read-only ObjectStore, so it needs the coordinates under database.backup
  # (endpointURL, destinationPath, remoteKey, secretStore) -- but NOT
  # database.backup.enabled. With backup off it recovers and archives nowhere,
  # which is the restore-probe shape rather than the rebuild one.
  #
  # This is what a cluster lost and rebuilt from git needs. Without it the
  # Application comes back healthy with an empty ranking. spec.bootstrap is
  # read only at creation, so leaving it on afterwards changes nothing on the
  # running Cluster -- but the next rebuild has to name the CURRENT
  # backup.serverName as its source. Every field is explained in
  # apps/schmetterpause/database/values.yaml.
  recovery:
    enabled: false
    sourceServerName: schmetterpause-db
    recoveryTarget: {}

# PodMonitors for the app's /metrics and the database's exporter, plus alert
# rules (app, database, and — with database.backup.enabled — WAL archiving and
# base backups), rendered from apps/schmetterpause/monitoring as its own
# Application at sync-wave 5.
#
# Off by default: it needs the Prometheus Operator CRDs on the target cluster
# (infra/kube-prometheus-stack), and without them this Application cannot sync.
# It also needs a `version` of v0.8.0 or later — the release that added the
# container port `metrics`; against an older one the app monitor finds nothing
# and SchmetterpauseMetricsDown fires.
# The Zählwerk's JSON surface: GET /api/players and POST /api/results, which a
# counter at the table uses to hand a finished match over (schmetterpause
# ADR-0015). Off by default.
#
# On means one more entry in the app's ExternalSecret, read from the same Vault
# path as the session key. It is NOT in the published base: rendered there,
# every environment would need a scoreboard-token property, and ESO fails the
# whole secret over one missing property -- session key and database URL
# included. So it is appended here by the environments that want it.
#
# The property has to exist in Vault BEFORE this is switched on, or the app's
# secret stops syncing. Check with:
#
#   kubectl -n schmetterpause get externalsecret schmetterpause-app
#
# Without the variable the application registers neither route, so there is no
# half-on state: unset means the surface does not exist.
scoreboard:
  enabled: false
  # Entry under the store's mount, and its OWN entry rather than the one the
  # app already reads. That is not a preference:
  #
  # vault-base-setup writes an entry with data_json, which rewrites it WHOLE.
  # Putting this token on the `schmetterpause` entry means restating
  # session-key, username and password in the same JSON, and getting session-key
  # wrong signs every player out at once. The backup key pair is a separate
  # entry for exactly this reason, and says so in
  # apps/schmetterpause/database/values.yaml.
  #
  # There is deliberately no fallback to the app's entry: the template fails to
  # render without a value here rather than quietly addressing the dangerous
  # one.
  vaultPath: schmetterpause-scoreboard
  vaultProperty: token

monitoring:
  enabled: false
  interval: 60s
  # The ScheduledBackup is daily; alert once the newest base backup is older.
  backupMaxAgeHours: 26

# The admission policy that checks the application image carries a keyless
# signature made by schmetterpause's CI (schmetterpause ADR-0020, #230),
# rendered as its own Application at sync-wave -5. Its source is
# policy/verify-image-signature.yaml in the schmetterpause repository at the
# same tag as `version`, not a copy in this catalog, so the policy on a cluster
# is the one that release was tested against.
#
# Off by default. It needs Kyverno serving policies.kyverno.io/v1 on the target
# cluster (infra/kyverno/install; 1.19 does), and a `version` of v0.9.0 or
# later: earlier tags carry a kyverno.io/v1 ClusterPolicy that Kyverno 1.19
# refuses, or none, and the chart fails to render rather than deploy either.
#
# The policy is cluster-scoped. Enable it in one consumer per cluster, or two
# Applications fight over the same object.
#
# With monitoring.enabled as well, the monitoring Application scrapes Kyverno
# for this policy's results and alerts on a refusal. The policy runs in Audit,
# so an unsigned image still starts, and that alert is the only place a refusal
# reaches a human.
policy:
  enabled: false

# Whether deleting the parent Application also prunes what it deployed.
#
# ON (the default) puts a `resources-finalizer.argocd.argoproj.io` on every
# child Application this chart renders, so Argo prunes the workloads before
# removing the child. A per-PR preview wants that: a closed PR must take its
# namespace with it.
#
# OFF is what a long-lived PLATFORM install wants, and the platforms/ AppSets
# set it. There an opt-out should stop Argo CD managing the stack, not delete
# it — and against an already deregistered cluster the prune can never
# complete, so the child Applications hang in Terminating and then block their
# AppProject (stuttgart-things/argocd#324). Without the finalizer the children
# are removed immediately and the workloads are left running, unmanaged, which
# is the intended outcome for an opt-out.
cascadingDelete: true
