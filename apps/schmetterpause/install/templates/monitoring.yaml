{{- if .Values.monitoring.enabled }}
{{- $name := include "schmetterpause.appName" . }}
{{- $monValues := dict
      "namespace" .Values.destination.namespace
      "interval"  .Values.monitoring.interval
      "app" (dict
        "podLabels" (dict "app.kubernetes.io/name" "schmetterpause")
        "port" "metrics")
      "database" (dict
        "enabled"     .Values.database.enabled
        "clusterName" .Values.database.name)
      "backup" (dict
        "enabled"     (and .Values.database.enabled (dig "backup" "enabled" false .Values.database))
        "maxAgeHours" .Values.monitoring.backupMaxAgeHours)
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-monitoring" $name | quote }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After the app and its database: the monitors select their pods.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/schmetterpause/monitoring
    helm:
      releaseName: {{ printf "%s-monitoring" $name | quote }}
      valuesObject:
        {{- toYaml $monValues | nindent 8 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
