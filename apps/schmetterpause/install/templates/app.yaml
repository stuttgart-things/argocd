{{- $name := include "schmetterpause.appName" . }}
{{- $ns := .Values.destination.namespace }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    # The `oci://` prefix is required — without it Argo treats repoURL as a git
    # URL and fails with "failed to list refs: repository not found".
    repoURL: oci://ghcr.io/stuttgart-things/schmetterpause-kustomize
    targetRevision: {{ .Values.version | quote }}
    path: .
    kustomize:
      namespace: {{ $ns | quote }}
      patches:
        {{- /* Both routes: same Gateway, same hostname, different listener.
               parentRefs is replaced wholesale rather than field by field, so
               `sectionName` has to be repeated here — dropping it would attach
               the route to every listener on the Gateway, which for the
               redirect route means redirecting HTTPS to HTTPS. */}}
        - target:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
            name: schmetterpause
          patch: |-
            - op: replace
              path: /spec/parentRefs
              value:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: {{ .Values.gateway.name }}
                  namespace: {{ .Values.gateway.namespace }}
                  sectionName: {{ .Values.gateway.sectionNameHTTPS }}
            - op: replace
              path: /spec/hostnames
              value:
                - {{ .Values.hostname | quote }}
        - target:
            group: gateway.networking.k8s.io
            version: v1
            kind: HTTPRoute
            name: schmetterpause-redirect
          patch: |-
            - op: replace
              path: /spec/parentRefs
              value:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: {{ .Values.gateway.name }}
                  namespace: {{ .Values.gateway.namespace }}
                  sectionName: {{ .Values.gateway.sectionNameHTTP }}
            - op: replace
              path: /spec/hostnames
              value:
                - {{ .Values.hostname | quote }}
        {{- /* The Zählwerk's token (schmetterpause ADR-0015). An append
               rather than a value in the published base, because the base is
               shared: rendered there, EVERY environment's ExternalSecret would
               demand a scoreboard-token property, and ESO fails the whole
               secret when one property is missing -- taking the session key
               and the database URL with it, not just the new routes.

               So the base renders one data entry and an environment that wants
               the surface appends a second. `-` appends, so this survives the
               base gaining entries of its own.

               Without the variable the application does not register
               /api/players or /api/results at all, which is why this is the
               only switch: there is no "enabled but locked" state to reach. */}}
        {{- if .Values.scoreboard.enabled }}
        - target:
            group: external-secrets.io
            kind: ExternalSecret
            name: schmetterpause-app
          patch: |-
            - op: add
              path: /spec/data/-
              value:
                secretKey: SP_SCOREBOARD_TOKEN
                remoteRef:
                  key: {{ required "scoreboard.vaultPath is required when scoreboard.enabled" .Values.scoreboard.vaultPath | quote }}
                  property: {{ .Values.scoreboard.vaultProperty | quote }}
        {{- end }}
        {{- /* Per-cluster entries (crossplane-configurations#464). `test`
               before `replace`: the patch addresses data by INDEX, so it first
               asserts the base still has `schmetterpause` there. A base that
               reorders its data then fails the sync instead of silently
               mapping the password onto the username. */}}
        {{- with .Values.vaultEntry }}
        - target:
            group: external-secrets.io
            kind: ExternalSecret
            name: schmetterpause-app
          patch: |-
            - op: test
              path: /spec/data/0/remoteRef/key
              value: schmetterpause
            - op: replace
              path: /spec/data/0/remoteRef/key
              value: {{ . | quote }}
        - target:
            group: external-secrets.io
            kind: ExternalSecret
            name: schmetterpause-db
          patch: |-
            - op: test
              path: /spec/data/0/remoteRef/key
              value: schmetterpause
            - op: replace
              path: /spec/data/0/remoteRef/key
              value: {{ . | quote }}
            - op: test
              path: /spec/data/1/remoteRef/key
              value: schmetterpause
            - op: replace
              path: /spec/data/1/remoteRef/key
              value: {{ . | quote }}
        {{- end }}
        {{- /* Both ExternalSecrets read from the same store. */}}
        {{- range $es := list "schmetterpause-app" "schmetterpause-db" }}
        - target:
            group: external-secrets.io
            kind: ExternalSecret
            name: {{ $es }}
          patch: |-
            - op: replace
              path: /spec/secretStoreRef/kind
              value: {{ $.Values.secretStore.kind }}
            - op: replace
              path: /spec/secretStoreRef/name
              value: {{ $.Values.secretStore.name }}
        {{- end }}
        {{- /* SP_PUBLIC_BASE_URL is what the app puts into absolute links; it
               has to agree with the hostname the routes answer on. */}}
        - target:
            kind: ConfigMap
            name: schmetterpause-config
          patch: |
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: schmetterpause-config
            data:
              SP_PUBLIC_BASE_URL: {{ printf "https://%s" .Values.hostname | quote }}
              {{- with .Values.bootstrapAdmin }}
              SP_BOOTSTRAP_ADMIN: {{ . | quote }}
              {{- end }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ $ns | quote }}
  # The redirect route declares no `matches` — it redirects everything on the
  # hostname — and the API server defaults one in (PathPrefix /). The rendered
  # manifest cannot carry it without asserting a match the base deliberately
  # leaves open, so the Application would sit OutOfSync forever while
  # server-side-applying cleanly. Observed on homerun2-test1: 7 of 8 resources
  # Synced, this one not. The main route declares its own matches and needs no
  # such exception.
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
