{{- $ns := .Values.namespace }}
{{- $db := .Values.database.clusterName }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: schmetterpause
  namespace: {{ $ns | quote }}
spec:
  groups:
    - name: schmetterpause.app
      rules:
        # No healthy /metrics target. Also fires while the app is scaled to 0
        # on purpose — a restore — which is the one time somebody is watching
        # anyway. Whether the site answers at all is the blackbox probe's job
        # on platform-sthings; this is the inside view.
        - alert: SchmetterpauseMetricsDown
          expr: absent(up{namespace="{{ $ns }}", job="{{ $ns }}/schmetterpause"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: schmetterpause exposes no metrics
            description: No schmetterpause pod in {{ $ns }} has answered on /metrics for 10 minutes.
{{- if .Values.database.enabled }}
    - name: schmetterpause.database
      rules:
        - alert: SchmetterpauseDatabaseExporterDown
          expr: absent(cnpg_collector_up{namespace="{{ $ns }}", cluster="{{ $db }}"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $db }} exports no metrics"
            description: The CloudNativePG exporter of {{ $db }} in {{ $ns }} has reported nothing for 10 minutes, so its backup and archiving alerts cannot fire either.
{{- end }}
{{- if and .Values.database.enabled .Values.backup.enabled }}
    - name: schmetterpause.backup
      rules:
        # Not "seconds since the last archival": with nobody writing, no WAL
        # segment fills and that number grows all night while everything is
        # fine. A failure newer than the last success is the signal.
        - alert: SchmetterpauseWALArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time{namespace="{{ $ns }}"} > cnpg_pg_stat_archiver_last_archived_time{namespace="{{ $ns }}"}
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: WAL archiving of {{ $db }} is failing
            description: The last WAL archive attempt of {{ $db }} failed and none has succeeded since, for 15 minutes. Point-in-time recovery stops at the last archived segment.
        - alert: SchmetterpauseWALArchiveBacklog
          expr: cnpg_collector_pg_wal_archive_status{namespace="{{ $ns }}", value="ready"} > 10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: WAL segments of {{ $db }} are waiting to be archived
            description: 'More than 10 WAL segments of {{ $db }} have been ready for archiving for 30 minutes.'
        # The Barman Cloud plugin's own timestamp: cnpg_collector_last_available_backup_timestamp
        # stays 0 for plugin backups. 0 here means "never" and alerts, as it should.
        - alert: SchmetterpauseBackupTooOld
          expr: time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="{{ $ns }}"} > {{ mul .Values.backup.maxAgeHours 3600 }}
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No recent base backup of {{ $db }}
            description: The newest base backup of {{ $db }} is older than {{ .Values.backup.maxAgeHours }} hours; the daily ScheduledBackup has not completed.
        - alert: SchmetterpauseBackupFailed
          expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="{{ $ns }}"} > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="{{ $ns }}"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: The last base backup of {{ $db }} failed
            description: A base backup of {{ $db }} failed after the last successful one. kubectl -n {{ $ns }} get backup shows which.
{{- end }}
{{- if .Values.policy.enabled }}
    - name: schmetterpause.policy
      rules:
        # The image-signature policy is in Audit: an unsigned image still
        # starts, and this alert is the only place the refusal reaches a human.
        #
        # The `unless ... offset 15m` half is not decoration. Kyverno creates
        # the counter at its first evaluation, so the first refusal after a
        # Kyverno restart is a new series already at 1, and increase() over a
        # series with a single sample is 0. Without it, exactly the first
        # refusal would be missed.
        #
        # The `> 0` on the increase() half is what makes that work. `or` adds a
        # right-hand element only when no left-hand element has the same labels,
        # the metric name aside, so an increase() of 0 hides the right half.
        # Without the filter the first refusal fired for one evaluation and
        # resolved a minute later (homerun2-test1, 2026-09-15).
        #
        # A server-side dry-run is counted too, and no label tells it apart.
        # A real pod leaves a PolicyReport in its namespace; a dry-run does not.
        - alert: SchmetterpauseUnsignedImageAdmitted
          expr: |
            sum by (resource_namespace) (
              (increase(kyverno_image_validating_policy_results_total{policy_name="schmetterpause-verify-image-signature", result="fail"}[15m]) > 0)
              or
              (
                kyverno_image_validating_policy_results_total{policy_name="schmetterpause-verify-image-signature", result="fail"}
                unless
                kyverno_image_validating_policy_results_total{policy_name="schmetterpause-verify-image-signature", result="fail"} offset 15m
              )
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: An image not signed by the schmetterpause CI workflow was admitted
            description: 'The Kyverno policy schmetterpause-verify-image-signature (Audit) found no signature from the schmetterpause CI workflow on an image admitted in the last 15 minutes. The resource_namespace label says where; kubectl -n that-namespace get policyreport names the pod. A server-side dry-run counts too.'
        # The other way an unverified image gets in, and the one the policy's
        # own results cannot show: the webhook did not answer at all.
        #
        # failurePolicy is Ignore, so when Kyverno cannot be reached -- it is
        # restarting, its certificate expired, the registry holding the
        # signature is unreachable, the 30s timeout elapses -- the API server
        # admits the pod without the signature having been checked, and
        # kyverno_image_validating_policy_results_total gains no sample at all.
        # Nothing else here would say so.
        #
        # That hole is the price of Ignore, and Ignore is deliberate
        # (schmetterpause#262, decided 2026-09-16): Fail would make a GHCR
        # outage stop every schmetterpause pod, a rebuilt cluster's first pod
        # included, which is a worse failure than the hole on a cluster the
        # office plays on. This alert is what pays for it -- the hole is loud
        # rather than silent.
        #
        # The name says what happened rather than what the policy did, so it
        # stays true through the Audit -> Deny flip: a fail-open means admitted
        # without a check in either mode. SchmetterpauseUnsignedImageAdmitted
        # above does not have that property and has to be reworded with the
        # flip.
        #
        # name is matched loosely on purpose. Kyverno composes the webhook as
        # ivpol.validate.kyverno.svc-<failurePolicy>-finegrained-<policy>, so
        # the exact string encodes the very setting this alert exists to cover
        # and would stop matching if it ever changed.
        #
        # The counter comes from the API server. Whether it is scraped at all
        # is the platform's KubeAPIDown and TargetDown, so there is no guard
        # for it here -- unlike the Kyverno scrape below, which nothing else
        # watches.
        #
        # Same first-sample handling as SchmetterpauseUnsignedImageAdmitted
        # above, for the same reason and with the same reasoning: the series
        # does not exist until the first fail-open, and increase() over a
        # single sample is 0.
        - alert: SchmetterpauseSignatureCheckSkipped
          expr: |
            sum(
              (increase(apiserver_admission_webhook_fail_open_count{job="apiserver", name=~".*schmetterpause-verify-image-signature"}[15m]) > 0)
              or
              (
                apiserver_admission_webhook_fail_open_count{job="apiserver", name=~".*schmetterpause-verify-image-signature"}
                unless
                apiserver_admission_webhook_fail_open_count{job="apiserver", name=~".*schmetterpause-verify-image-signature"} offset 15m
              )
            ) > 0
          labels:
            severity: warning
          annotations:
            summary: A pod was admitted without its image signature being checked
            description: 'The image-signature admission webhook failed and failurePolicy is Ignore, so the API server admitted the pod unchecked in the last 15 minutes. This is not a refusal - the policy never ran. Start with Kyverno: kubectl -n kyverno get pods, and its logs for registry or certificate errors. kubectl -n schmetterpause get pods -o jsonpath to see which images are running.'
        # Without the scrape the alert above cannot fire, and a silent alert
        # looks exactly like nothing being wrong.
        - alert: SchmetterpauseKyvernoMetricsDown
          expr: absent(up{namespace="kyverno", job="kyverno-svc-metrics"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kyverno admission metrics are not scraped
            description: No healthy kyverno-svc-metrics target for 10 minutes, so SchmetterpauseUnsignedImageAdmitted cannot fire.
{{- end }}
