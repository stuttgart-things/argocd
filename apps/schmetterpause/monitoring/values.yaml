---
# Namespace schmetterpause and its database run in.
namespace: schmetterpause

# Scrape interval for both PodMonitors.
interval: 60s

# The app's pods, selected by the label the kustomize base puts on them. Their
# container port `metrics` exists since schmetterpause v0.8.0
# (SP_METRICS_ADDR); the Service does not name it, so it is reachable from
# inside the cluster only.
app:
  podLabels:
    app.kubernetes.io/name: schmetterpause
  port: metrics

# The CloudNativePG Cluster. Its instances export on port `metrics` (9187),
# including the Barman Cloud plugin's backup timestamps.
database:
  enabled: true
  clusterName: schmetterpause-db

# Rules about WAL archiving and base backups. Only meaningful with
# database.backup.enabled in the install chart — without a plugin there is no
# archive to fail.
backup:
  enabled: false
  # The schedule is daily; 26 h leaves room for one slow run before it alerts.
  maxAgeHours: 26

# Results waiting on a player or an admin (schmetterpause#251), read off
# schmetterpause_matches_oldest_open_seconds, which exists from schmetterpause
# v0.12.0 on. Thresholds live here, not in the app.
results:
  # A match entered Friday afternoon and confirmed Monday stays quiet.
  pendingMaxAgeHours: 72
  # A dispute waits on an admin, not on the calendar.
  disputedMaxAgeHours: 24

# The image-signature policy's refusals (apps/schmetterpause/install
# policy.enabled). The policy runs in Deny from schmetterpause v0.16.0, so an
# unsigned image is refused, and this is how a refusal reaches a human beyond
# whoever was deploying: a ServiceMonitor on
# Kyverno's admission controller that keeps nothing but this policy's result
# counter, and two alerts.
policy:
  enabled: false

# Inert pass-through so the catalog verifier's probe values validate.
destination: {}
