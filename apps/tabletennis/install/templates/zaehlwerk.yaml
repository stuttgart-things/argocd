{{- if .Values.zaehlwerk.enabled }}
{{- $appName := include "tabletennis.appName" . }}
{{- $name := printf "%s-zaehlwerk" $appName }}
{{- $ns := .Values.zaehlwerk.namespace }}
{{- /* Per-cluster secrets (#464): the panel reads homerun2's own entry
       through homerun2's store; the handover token stays schmetterpause's,
       through schmetterpause's store when that differs. */}}
{{- $srcs := .Values.secretSources | default dict }}
{{- $hrSrc := $srcs.homerun2 | default dict }}
{{- $spSrc := $srcs.schmetterpause | default dict }}
{{- $panelStore := $hrSrc.store | default .Values.secretStore.name }}
{{- /* The panel: on when this platform asks for one AND homerun2 is on this
       cluster to receive it. One namespace derives both URLs — where the scores
       go, and the led-catcher zaehlwerk takes over for the duration of a match.
       With homerun2.namespace empty the sub-chart gets no panel at all, which is
       a supported and silent mode rather than a degraded one. */}}
{{- /* `panel` is true/false as before, or the mode spelled out: `homerun2`
       (= true), `off` (= false), or `redis` -- straight into homerun2's Redis
       onto `panelStream`, never switching the catcher (zaehlwerk ADR-0016),
       the Pong sandbox's way onto the office's panel. Compared as a string, so
       the "false" a platform AppSet hands over is off rather than truthy. */}}
{{- $panelMode := toString .Values.zaehlwerk.panel }}
{{- if eq $panelMode "true" }}{{ $panelMode = "homerun2" }}{{ end }}
{{- $panel := dict }}
{{- if and (eq $panelMode "homerun2") .Values.homerun2.namespace }}
{{- $panel = dict "homerun2Namespace" .Values.homerun2.namespace }}
{{- /* What the catcher returns to after a match. The office next to a Pong
       sandbox lists the sandbox's stream here (messages,tabletennis-sandbox),
       so the sandbox's matches show while the table is free. */}}
{{- with .Values.zaehlwerk.catcherIdleStreams }}
{{- $_ := set $panel "idleStreams" . }}
{{- end }}
{{- else if eq $panelMode "redis" }}
{{- if not .Values.homerun2.namespace }}
{{- fail "zaehlwerk.panel redis needs homerun2.namespace: the stream goes into homerun2's Redis (redis-stack.<namespace>)" }}
{{- end }}
{{- /* REDIS_ADDR rather than omni-pitcher: over omni-pitcher the stream is the
       pitcher's routing decision, by system, which both instances share;
       straight into Redis, PANEL_STREAM is the stream. No catcher URL on
       purpose: two zaehlwerks switching one catcher would take the panel from
       each other. The password is the Secret's REDIS_PASSWORD, homerun2's. */}}
{{- $panel = dict "redisAddr" (printf "redis-stack.%s.svc.cluster.local" .Values.homerun2.namespace) "redisPort" "6379" }}
{{- with .Values.zaehlwerk.panelStream }}
{{- $_ := set $panel "stream" . }}
{{- end }}
{{- end }}
{{- /* The handover to schmetterpause (zaehlwerk ADR-0004, schmetterpause
       ADR-0015). Derived rather than configured, because this chart already
       knows both halves and they have to agree:

         url   schmetterpause's own hostname, the one its HTTPRoute serves
         token the SAME Vault entry the scoreboard token comes from

       Gated on `schmetterpause.scoreboard.enabled` and not on `handover` alone:
       the URL without the receiving surface is a 404 per finished match, and
       upstream reads the URL as the on-switch. So a platform turns the feature
       on in ONE place and both sides move together. */}}
{{- /* The scoreboard as schmetterpause actually gets it: the bundle's own
       `schmetterpause.scoreboard`, overridden by `schmetterpause.values.scoreboard`
       the same way schmetterpause.yaml hands it down. platforms/tabletennis
       sets the switch ONLY in the override (from the cluster annotation), so
       reading the bundle-level key alone left every AppSet cluster with
       schmetterpause's /api on and zaehlwerk's SCHMETTERPAUSE_URL off --
       homerun2-dev2 logged "schmetterpause handover disabled" from its first
       start (schmetterpause#188, 2026-10-06). */}}
{{- $spOverride := include "tabletennis.schmetterpauseOverride" .Values.schmetterpause.values | fromJson }}
{{- $scoreboard := mergeOverwrite (deepCopy .Values.schmetterpause.scoreboard) ((get $spOverride "scoreboard") | default dict) }}
{{- $scoreboardPath := .Values.schmetterpause.scoreboard.vaultPath }}
{{- if $spSrc.entry }}
{{- $scoreboardPath = printf "%s-scoreboard" $spSrc.entry }}
{{- end }}
{{- with (get ((get $spOverride "scoreboard") | default dict) "vaultPath") }}
{{- $scoreboardPath = . }}
{{- end }}
{{- $handover := dict }}
{{- if and .Values.zaehlwerk.handover .Values.schmetterpause.enabled $scoreboard.enabled }}
{{- /* `zaehlwerk.schmetterpauseURL` replaces the route with another address
       -- the sandbox's in-cluster Service, so its league depends on no
       certificate. */}}
{{- $handover = dict
      "url"           (.Values.zaehlwerk.schmetterpauseURL | default (printf "https://%s" (include "tabletennis.hostname" (dict "root" . "name" "schmetterpause"))))
      "vaultPath"     $scoreboardPath
      "vaultProperty" $scoreboard.vaultProperty }}
{{- if and $spSrc.store (ne $spSrc.store $panelStore) }}
{{- $_ := set $handover "secretStore" (dict "kind" .Values.secretStore.kind "name" $spSrc.store) }}
{{- end }}
{{- end }}
{{- /* The live score (schmetterpause#188): the browser on schmetterpause's
       origin reads GET /live/stream directly, so that origin has to be in
       ALLOWED_ORIGINS. Appended to whatever the platform lists itself. The
       other half, SP_ZAEHLWERK_URL, is set in schmetterpause.yaml under the
       same condition. */}}
{{- $origins := list }}
{{- with .Values.zaehlwerk.allowedOrigins }}{{ $origins = append $origins . }}{{ end }}
{{- if and .Values.zaehlwerk.liveScore .Values.schmetterpause.enabled }}
{{- $origins = append $origins (printf "https://%s" (include "tabletennis.hostname" (dict "root" . "name" "schmetterpause"))) }}
{{- end }}
{{- /* `cascadingDelete` is threaded into the sub-chart too: an opt-out at
       the platform level has to reach the leaves, or the children this
       sub-chart renders keep their finalizers and hang in Terminating
       against a deregistered cluster (argocd#324). */}}
{{- $computed := dict
      "applicationName" (printf "%s-delegate" $name)
      "project"         .Values.project
      "destination"     (dict "namespace" $ns)
      "syncPolicy"      .Values.syncPolicy
      "cascadingDelete" .Values.cascadingDelete
      "version"         .Values.zaehlwerk.version
      "hostname"        (include "tabletennis.hostname" (dict "root" . "name" "zaehlwerk"))
      "gateway"         (dict
                          "name"        .Values.gateway.name
                          "namespace"   .Values.gateway.namespace
                          "sectionName" .Values.gateway.sectionNameHTTPS)
      "secretStore"     (dict "kind" .Values.secretStore.kind "name" $panelStore)
      "allowedOrigins"  (join "," ($origins | uniq))
      "panel"           $panel
      "schmetterpause"  $handover
}}
{{- if $hrSrc.entry }}
{{- $_ := set $computed "homerun2Secrets" (dict "vaultEntry" $hrSrc.entry) }}
{{- end }}
{{- /* MATCHES_TOKEN, the Pong sandbox's door (zaehlwerk ADR-0015). Only
       with the handover in place: zaehlwerk opens POST /matches with ids only
       when it has a schmetterpause to report to. */}}
{{- $matches := .Values.zaehlwerk.matches | default dict }}
{{- if eq (toString ($matches.enabled | default false)) "true" }}
{{- if not $handover }}
{{- fail "zaehlwerk.matches.enabled needs the handover: schmetterpause.enabled, schmetterpause.scoreboard.enabled and zaehlwerk.handover" }}
{{- end }}
{{- $_ := set $computed "matches" (dict "enabled" true "vaultPath" $matches.vaultPath "vaultProperty" $matches.vaultProperty) }}
{{- end }}
{{- /* PONG_URL for the watch screen's screensaver: the game's route, the
       address a browser at the table reaches it at. */}}
{{- if include "tabletennis.pongEnabled" . }}
{{- $_ := set $computed "pongURL" (printf "https://%s" (include "tabletennis.pongHostname" .)) }}
{{- end }}
{{- if .Values.destination.name }}
{{- $_ := set (index $computed "destination") "name" .Values.destination.name }}
{{- else }}
{{- $_ := set (index $computed "destination") "server" .Values.destination.server }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name | quote }}
  namespace: argocd
  {{- /* ALWAYS a resources-finalizer on this middle layer, whatever
         cascadingDelete says: everything it renders is an Application in
         `argocd` here, never a workload. Without it, deleting this Application
         (the ApplicationSet does, when a cluster leaves the platform) left the
         sub-chart's Applications behind, pointing at a gone cluster and
         blocking its AppProject (rancher-join-test8, crossplane-configurations
         #464). The workloads stay protected by the LEAVES: with
         cascadingDelete false they carry no finalizer, so removing them
         removes only Argo's record, never the running resources. */}}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/zaehlwerk/install
    helm:
      releaseName: {{ include "tabletennis.releaseName" ($name) | quote }}
      valuesObject:
        {{- include "tabletennis.subValues" (dict "computed" $computed "override" .Values.zaehlwerk.values) | nindent 8 }}
  {{- /* THIS Application renders Applications (the sub-chart's app,
         database, monitoring, policy), so it belongs to the Argo CD that runs
         it — never to the target cluster, which has no argoproj.io API. The
         target reaches the sub-chart as `destination` in its values and is
         used there, by the Applications that deploy workloads. Pointing this
         one at the target failed every sync on a centrally managed cluster
         with "failed to discover server resources for group version
         argoproj.io/v1alpha1" (rancher-join-test8, crossplane-configurations
         #464). */}}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
