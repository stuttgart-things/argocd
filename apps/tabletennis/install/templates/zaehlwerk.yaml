{{- if .Values.zaehlwerk.enabled }}
{{- $appName := include "tabletennis.appName" . }}
{{- $name := printf "%s-zaehlwerk" $appName }}
{{- $ns := .Values.zaehlwerk.namespace }}
{{- /* Per-cluster secrets (#464): the panel reads homerun2's own entry
       through homerun2's store; the handover token stays schmetterpause's,
       through schmetterpause's store when that differs. */}}
{{- $srcs := .Values.secretSources | default dict }}
{{- $hrSrc := $srcs.homerun2 | default dict }}
{{- $spSrc := $srcs.schmetterpause | default dict }}
{{- $panelStore := $hrSrc.store | default .Values.secretStore.name }}
{{- /* The panel: on when this platform asks for one AND homerun2 is on this
       cluster to receive it. One namespace derives both URLs — where the scores
       go, and the led-catcher zaehlwerk takes over for the duration of a match.
       With homerun2.namespace empty the sub-chart gets no panel at all, which is
       a supported and silent mode rather than a degraded one. */}}
{{- $panel := dict }}
{{- if and .Values.zaehlwerk.panel .Values.homerun2.namespace }}
{{- $panel = dict "homerun2Namespace" .Values.homerun2.namespace }}
{{- end }}
{{- /* The handover to schmetterpause (zaehlwerk ADR-0004, schmetterpause
       ADR-0015). Derived rather than configured, because this chart already
       knows both halves and they have to agree:

         url   schmetterpause's own hostname, the one its HTTPRoute serves
         token the SAME Vault entry the scoreboard token comes from

       Gated on `schmetterpause.scoreboard.enabled` and not on `handover` alone:
       the URL without the receiving surface is a 404 per finished match, and
       upstream reads the URL as the on-switch. So a platform turns the feature
       on in ONE place and both sides move together. */}}
{{- $handover := dict }}
{{- if and .Values.zaehlwerk.handover .Values.schmetterpause.enabled .Values.schmetterpause.scoreboard.enabled }}
{{- $handover = dict
      "url"           (printf "https://%s" (include "tabletennis.hostname" (dict "root" . "name" "schmetterpause")))
      "vaultPath"     (ternary (printf "%s-scoreboard" ($spSrc.entry | default "")) .Values.schmetterpause.scoreboard.vaultPath (not (empty $spSrc.entry)))
      "vaultProperty" .Values.schmetterpause.scoreboard.vaultProperty }}
{{- if and $spSrc.store (ne $spSrc.store $panelStore) }}
{{- $_ := set $handover "secretStore" (dict "kind" .Values.secretStore.kind "name" $spSrc.store) }}
{{- end }}
{{- end }}
{{- /* `cascadingDelete` is threaded into the sub-chart too: an opt-out at
       the platform level has to reach the leaves, or the children this
       sub-chart renders keep their finalizers and hang in Terminating
       against a deregistered cluster (argocd#324). */}}
{{- $computed := dict
      "applicationName" (printf "%s-delegate" $name)
      "project"         .Values.project
      "destination"     (dict "namespace" $ns)
      "syncPolicy"      .Values.syncPolicy
      "cascadingDelete" .Values.cascadingDelete
      "version"         .Values.zaehlwerk.version
      "hostname"        (include "tabletennis.hostname" (dict "root" . "name" "zaehlwerk"))
      "gateway"         (dict
                          "name"        .Values.gateway.name
                          "namespace"   .Values.gateway.namespace
                          "sectionName" .Values.gateway.sectionNameHTTPS)
      "secretStore"     (dict "kind" .Values.secretStore.kind "name" $panelStore)
      "allowedOrigins"  .Values.zaehlwerk.allowedOrigins
      "panel"           $panel
      "schmetterpause"  $handover
}}
{{- if $hrSrc.entry }}
{{- $_ := set $computed "homerun2Secrets" (dict "vaultEntry" $hrSrc.entry) }}
{{- end }}
{{- if .Values.destination.name }}
{{- $_ := set (index $computed "destination") "name" .Values.destination.name }}
{{- else }}
{{- $_ := set (index $computed "destination") "server" .Values.destination.server }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name | quote }}
  namespace: argocd
  {{- /* ALWAYS a resources-finalizer on this middle layer, whatever
         cascadingDelete says: everything it renders is an Application in
         `argocd` here, never a workload. Without it, deleting this Application
         (the ApplicationSet does, when a cluster leaves the platform) left the
         sub-chart's Applications behind, pointing at a gone cluster and
         blocking its AppProject (rancher-join-test8, crossplane-configurations
         #464). The workloads stay protected by the LEAVES: with
         cascadingDelete false they carry no finalizer, so removing them
         removes only Argo's record, never the running resources. */}}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/zaehlwerk/install
    helm:
      releaseName: {{ include "tabletennis.releaseName" ($name) | quote }}
      valuesObject:
        {{- include "tabletennis.subValues" (dict "computed" $computed "override" .Values.zaehlwerk.values) | nindent 8 }}
  {{- /* THIS Application renders Applications (the sub-chart's app,
         database, monitoring, policy), so it belongs to the Argo CD that runs
         it — never to the target cluster, which has no argoproj.io API. The
         target reaches the sub-chart as `destination` in its values and is
         used there, by the Applications that deploy workloads. Pointing this
         one at the target failed every sync on a centrally managed cluster
         with "failed to discover server resources for group version
         argoproj.io/v1alpha1" (rancher-join-test8, crossplane-configurations
         #464). */}}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
