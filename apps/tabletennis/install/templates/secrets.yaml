{{- if and .Values.secrets.enabled (include "tabletennis.lightCatcherEnabled" .) }}
{{- $appName := include "tabletennis.appName" . }}
{{- $name := printf "%s-light-catcher-secrets" $appName }}
{{- $ns := .Values.lightCatcher.namespace }}
{{- $hrSrc := (.Values.secretSources | default dict).homerun2 | default dict }}
{{- $store := .Values.secrets.clusterSecretStoreName | default $hrSrc.store | default .Values.secretStore.name }}
{{- $entry := $hrSrc.entry | default .Values.secrets.vaultSecretName }}
{{- /* An ExternalSecret for the light-catcher's Redis password, in the
       light-catcher's own namespace. It reuses apps/homerun2/secrets, which is a
       generic ExternalSecret renderer — the same Vault entry and property every
       other homerun2 component reads, because it is the same Redis.

       Its own Application, at wave -10, is also what CREATES that namespace
       (CreateNamespace=true) ahead of the catcher at wave 0.

       schmetterpause and zaehlwerk need nothing here: their ExternalSecrets ship
       inside their own published kustomize bases, and each chart patches the
       store onto them. */}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name | quote }}
  namespace: argocd
  {{- if $.Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/homerun2/secrets
    helm:
      releaseName: {{ include "tabletennis.releaseName" ($name) | quote }}
      valuesObject:
        namespace: {{ $ns | quote }}
        clusterSecretStoreName: {{ $store | quote }}
        vaultSecretName: {{ $entry | quote }}
        refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
        components:
          - name: light-catcher-redis
            secretName: homerun2-light-catcher-redis
            dataKey: password
            vaultProperty: redisPassword
  destination:
    {{- include "tabletennis.destination" (dict "root" . "namespace" $ns) | nindent 4 }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
