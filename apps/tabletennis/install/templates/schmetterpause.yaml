{{- if .Values.schmetterpause.enabled }}
{{- $appName := include "tabletennis.appName" . }}
{{- $name := printf "%s-schmetterpause" $appName }}
{{- $ns := .Values.schmetterpause.namespace }}
{{- /* Per-cluster secrets (#464): schmetterpause's own store and entry, and
       the scoreboard token as `<entry>-scoreboard` next to it. */}}
{{- $spSrc := (.Values.secretSources | default dict).schmetterpause | default dict }}
{{- $spStore := $spSrc.store | default .Values.secretStore.name }}
{{- $spScoreboardPath := .Values.schmetterpause.scoreboard.vaultPath }}
{{- if $spSrc.entry }}
{{- $spScoreboardPath = printf "%s-scoreboard" $spSrc.entry }}
{{- end }}
{{- /* `cascadingDelete` is threaded into the sub-chart too: an opt-out at
       the platform level has to reach the leaves, or the children this
       sub-chart renders keep their finalizers and hang in Terminating
       against a deregistered cluster (argocd#324). */}}
{{- $computed := dict
      "applicationName" (printf "%s-delegate" $name)
      "project"         .Values.project
      "catalog"         (dict "repoURL" .Values.catalog.repoURL "targetRevision" .Values.catalog.targetRevision)
      "destination"     (dict "namespace" $ns)
      "syncPolicy"      .Values.syncPolicy
      "cascadingDelete" .Values.cascadingDelete
      "version"         .Values.schmetterpause.version
      "hostname"        (include "tabletennis.hostname" (dict "root" . "name" "schmetterpause"))
      "gateway"         (dict
                          "name"             .Values.gateway.name
                          "namespace"        .Values.gateway.namespace
                          "sectionNameHTTPS" .Values.gateway.sectionNameHTTPS
                          "sectionNameHTTP"  .Values.gateway.sectionNameHTTP)
      "secretStore"     (dict "kind" .Values.secretStore.kind "name" $spStore)
      "bootstrapAdmin"  .Values.schmetterpause.bootstrapAdmin
      "scoreboard"      (dict
                          "enabled"       .Values.schmetterpause.scoreboard.enabled
                          "vaultPath"     $spScoreboardPath
                          "vaultProperty" .Values.schmetterpause.scoreboard.vaultProperty)
      "policy"          (dict "enabled" .Values.schmetterpause.policy.enabled)
}}
{{- if $spSrc.entry }}
{{- $_ := set $computed "vaultEntry" $spSrc.entry }}
{{- end }}
{{- /* The sub-chart's destination takes `server` or `name`, same as ours. */}}
{{- if .Values.destination.name }}
{{- $_ := set (index $computed "destination") "name" .Values.destination.name }}
{{- else }}
{{- $_ := set (index $computed "destination") "server" .Values.destination.server }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name | quote }}
  namespace: argocd
  {{- /* ALWAYS a resources-finalizer on this middle layer, whatever
         cascadingDelete says: everything it renders is an Application in
         `argocd` here, never a workload. Without it, deleting this Application
         (the ApplicationSet does, when a cluster leaves the platform) left the
         sub-chart's Applications behind, pointing at a gone cluster and
         blocking its AppProject (rancher-join-test8, crossplane-configurations
         #464). The workloads stay protected by the LEAVES: with
         cascadingDelete false they carry no finalizer, so removing them
         removes only Argo's record, never the running resources. */}}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/schmetterpause/install
    helm:
      releaseName: {{ include "tabletennis.releaseName" ($name) | quote }}
      valuesObject:
        {{- include "tabletennis.subValues" (dict "computed" $computed "override" .Values.schmetterpause.values) | nindent 8 }}
  {{- /* THIS Application renders Applications (the sub-chart's app,
         database, monitoring, policy), so it belongs to the Argo CD that runs
         it — never to the target cluster, which has no argoproj.io API. The
         target reaches the sub-chart as `destination` in its values and is
         used there, by the Applications that deploy workloads. Pointing this
         one at the target failed every sync on a centrally managed cluster
         with "failed to discover server resources for group version
         argoproj.io/v1alpha1" (rancher-join-test8, crossplane-configurations
         #464). */}}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  {{- /* This Application's own desired state is three Applications, so its sync
         is cheap; the database's own wave (-10) orders things inside it. */}}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
