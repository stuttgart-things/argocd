---
# ArgoCD AppProject the rendered Application belongs to.
project: default

# Where the rendered Application deploys.
destination:
  server: https://kubernetes.default.svc
  namespace: redis-stack

# Upstream stuttgart-things/redis Helm chart (OCI: ghcr.io/stuttgart-things/charts/redis).
# renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/redis/redis
chartVersion: 17.1.4

# Root Redis password. Set `password` for an inline literal (don't check real
# secrets into git — use an ArgoCD Vault Plugin / SOPS overlay), OR
# `existingSecret` to point at a Secret populated out-of-band (e.g. by ESO
# or a Vault CSI driver). Bitnami prefers existingSecret when both are set.
auth:
  password: ""                       # pragma: allowlist secret
  existingSecret: ""
  existingSecretPasswordKey: redis-password

# Redis container image — defaults to the stuttgart-things redis-stack-server mirror
# which bundles RediSearch/RedisJSON/RedisTimeSeries/RedisBloom.
image:
  registry: ghcr.io
  repository: stuttgart-things/redis-stack-server
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/redis-stack-server
  tag: 7.2.0-v18

# Sentinel sidecar — enabled by default so the cluster runs in HA mode.
sentinel:
  enabled: true
  masterSet: mymaster
  quorum: 1
  parallelSyncs: 1
  serviceType: ClusterIP
  image:
    registry: ghcr.io
    repository: stuttgart-things/redis-sentinel
    # renovate: datasource=docker depName=ghcr.io/stuttgart-things/redis-sentinel
    tag: 7.4.2-debian-12-r9

# Persistence — shared by master + replica StatefulSets.
persistence:
  enabled: true
  storageClass: standard
  size: 8Gi

# Replica count for the replica StatefulSet.
replicaCount: 1

# Deep-merged on top of the computed valuesObject passed to the upstream redis chart.
# Use for any upstream key not exposed as a first-class value above.
extraValues: {}

# Whether the rendered Application carries resources-finalizer.argocd.argoproj.io.
# With it, deleting the Application deletes Redis with it; without it, deleting
# the Application removes only Argo's record and Redis keeps running, unmanaged.
#
# false by default so nothing changes for a consumer that does not set it. A
# parent that removes this chart's Application as part of its own teardown has
# to pass its own cascadingDelete through, or the teardown stops one level short
# of Redis: apps/homerun2/install did not, and every closed homerun2 PR preview
# left its redis-stack running in the preview namespace — which the preview
# sweep never removes, because it only reaps namespaces without pods.
cascadingDelete: false

# Sync policy applied to the rendered Application.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # Honour the chart's ignoreDifferences during sync and selfHeal, so the
    # controller never tries to rewrite fields the API server owns.
    - RespectIgnoreDifferences=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
