---
# Reference back to this catalog repo — used by the certs + httpRoute Applications
# to load apps/minio/{certs,httproute} from git.
catalog:
  repoURL: https://github.com/stuttgart-things/argocd.git
  targetRevision: HEAD

# ArgoCD AppProject all rendered Applications belong to.
project: default

# Where all rendered Applications deploy.
destination:
  server: https://kubernetes.default.svc
  namespace: minio

# Upstream MinIO OCI chart version (ghcr.io/stuttgart-things/charts/minio).
# 16.x, NOT 17: chart 17 runs the console as its own Deployment whose image
# resolves to ghcr.io/bitnami/minio-object-browser and cannot be pulled.
# renovate.json holds this chart below 17 ("Hold the minio chart at 16.x").
# renovate: datasource=docker depName=ghcr.io/stuttgart-things/charts/minio/minio
chartVersion: 16.0.10

# Pinned MinIO image (stuttgart-things mirror). global.security.allowInsecureImages=true
# is set because this overrides the chart's default image digest.
image:
  registry: ghcr.io
  repository: stuttgart-things/minio
  # renovate: datasource=docker depName=ghcr.io/stuttgart-things/minio
  tag: 2025.4.22-debian-12-r1

# Persistence — StorageClass and PVC size.
storageClass: nfs4-csi
storageSize: 10Gi

# Credentials.
# If `existingSecret` is non-empty, rootUser + rootPassword are omitted from the
# rendered valuesObject (the chart reads credentials from the named Secret instead).
# Otherwise, the root credentials are inlined — set them via consumer valuesObject or an
# ArgoCD Vault Plugin / SOPS overlay. Defaults are empty placeholders — don't deploy as-is.
auth:
  rootUser: ""                      # pragma: allowlist secret
  rootPassword: ""                  # pragma: allowlist secret
  existingSecret: ""                # preferred — name of a pre-existing Secret with root-user / root-password keys

# Pod resources.
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 1Gi

# MinIO web console — shared between certs + httproute when both are enabled.
console:
  hostname: artifacts-console.example.com
  tlsSecret: artifacts-console-ingress-tls

# MinIO S3 API — shared between certs + httproute when both are enabled.
api:
  hostname: artifacts.example.com
  tlsSecret: artifacts-ingress-tls

# cert-manager Certificates sub-Application.
certs:
  enabled: true
  issuer:
    name: cluster-ca
    kind: ClusterIssuer

# Gateway API HTTPRoute sub-Application.
httpRoute:
  enabled: true
  gateway:
    name: cilium-gateway
    namespace: default

# Console login via ZITADEL (OIDC), next to the root user. Port of flux's
# minio-oidc component. MinIO maps a claim to its policies; the claim must be a
# string or a list of policy names (consoleAdmin, readwrite, readonly, ...).
# stuttgart-things' zitadel-config roots put such a list into minio_policy
# with an action. The redirect URI is https://<console.hostname>/oauth_callback.
oidc:
  # ZITADEL issuer, e.g. https://zitadel.platform.sthings.lab. Empty = off.
  issuer: ""
  # Secret in destination.namespace with keys client-id and client-secret
  # (confidential web client).
  secretName: minio-oidc-zitadel
  # Claim with the user's MinIO policies.
  claim: minio_policy
  # Comma separated.
  scopes: openid,profile,email
  # Label of the console's login button.
  displayName: ZITADEL
  # ConfigMap with the issuer's CA. It becomes MinIO's root store
  # (SSL_CERT_FILE), so it must carry the public roots too (trust-manager's
  # useDefaultCAs).
  caConfigMap: cluster-trust-bundle
  caKey: trust-bundle.pem

# Deep-merged on top of the computed valuesObject passed to the upstream MinIO chart.
# Use for any upstream key not exposed as a first-class value above.
extraValues: {}

# Sync policy applied to all rendered Applications.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
