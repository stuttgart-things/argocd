{{- /* Fields the API server defaults are spelled out: left implicit they
       come back on the live object, and Argo reports the route OutOfSync
       forever while it works (group/kind/weight, and PathPrefix / for a
       rule without matches). */}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: {{ .Values.namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - {{ .Values.fqdn | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
        - path:
            type: PathPrefix
            value: /v2/
        - path:
            type: PathPrefix
            value: /service/
        - path:
            type: PathPrefix
            value: /c/
        - path:
            type: PathPrefix
            value: /chartrepo/
        - path:
            type: PathPrefix
            value: /harbor/
      backendRefs:
        - name: harbor-core
          port: 80
          group: ""
          kind: Service
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-portal
          port: 80
          group: ""
          kind: Service
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-project-proxy
  namespace: {{ .Values.namespace | quote }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - {{ .Values.wildcard | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-project-proxy
          port: 80
          group: ""
          kind: Service
          weight: 1
