{{- if .Values.gitAuth.enabled }}
---
# git-sync credentials (HTTPS token) for a private repository, from Vault.
# Keys username / password, as the git-sync env expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: git-sync-auth
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.gitAuth.secretStore.kind }}
    name: {{ required "gitAuth.secretStore.name is required" .Values.gitAuth.secretStore.name | quote }}
  target:
    name: {{ .Values.gitAuth.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: username  # pragma: allowlist secret
      remoteRef:
        key: {{ required "gitAuth.path is required" .Values.gitAuth.path | quote }}
        property: {{ .Values.gitAuth.usernameProperty | quote }}
    - secretKey: password  # pragma: allowlist secret
      remoteRef:
        key: {{ .Values.gitAuth.path | quote }}
        property: {{ .Values.gitAuth.passwordProperty | quote }}
{{- end }}
{{- if .Values.kubeconfigs.enabled }}
---
# One kubeconfig per cluster, from the KV mount the ClusterStack plays write to
# (path = cluster name, property `kubeconfig`), as one Secret with one key per
# cluster — the layout -kubeconfig-dir expects.
#
# `find` selects the clusters by name, so the lab's cluster list stays one
# value (a regexp) instead of one data entry per cluster. find returns each
# Vault entry as JSON; the template keeps only its `kubeconfig` property. The
# ESO template is passed through Helm verbatim (raw string), so its
# $variables are not Helm's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clusterscope-kubeconfigs
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.kubeconfigs.secretStore.kind }}
    name: {{ .Values.kubeconfigs.secretStore.name | quote }}
  target:
    name: clusterscope-kubeconfigs
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - target: Data
          literal: |
{{- `
            {{- range $cluster, $entry := . }}
            {{ $cluster }}: {{ (fromJson $entry).kubeconfig | toJson }}
            {{- end }}` }}
  dataFrom:
    - find:
        name:
          regexp: {{ .Values.kubeconfigs.clusters | squote }}
{{- end }}
