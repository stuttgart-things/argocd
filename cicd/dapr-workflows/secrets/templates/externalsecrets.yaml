{{- /* Only when something is requested: the default (no secrets) renders
       nothing, which is what lint and the catalog probe see. */}}
{{- if and .Values.secrets (not .Values.clusterSecretStoreName) }}
{{- fail "clusterSecretStoreName is required: the ClusterSecretStore on the workload cluster" }}
{{- end }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName | quote }}
  namespace: {{ $.Values.namespace | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.clusterSecretStoreName | quote }}
  target:
    name: {{ .secretName | quote }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .vaultSecretName | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
