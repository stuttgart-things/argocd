---
# Namespace the ExternalSecrets (and the Secrets they materialise) land in.
namespace: backstage-workflows

# ClusterSecretStore on the workload cluster. Required.
clusterSecretStoreName: ""

refreshInterval: 1h

# One ExternalSecret per entry. `vaultSecretName` is the KV entry under the
# store's path, `property` the field inside it.
#
#   - secretName: github-token
#     data:
#       - secretKey: token
#         vaultSecretName: dapr-workflows
#         property: github_token
secrets: []
