{{- if and .Values.redis.enabled (or .Values.templateExecution.enabled .Values.clusterBuildWatch.enabled) }}
{{- $appName := include "daprWorkflows.appName" . }}
{{- /* Both workers keep their dapr state (workflow + actor) here. One node,
       sentinel on with a single replica -- the redis-stack Service then
       always points at the master, the same shape cicd-machinery-test5 ran
       under Flux. The password comes from `redis-auth` (secrets.yaml). */}}
{{- $rsValues := dict
      "project"         .Values.project
      "applicationName" (printf "%s-redis-delegate" $appName)
      "destination"     (dict "server" .Values.destination.server "namespace" .Values.redis.namespace)
      "chartVersion"    .Values.redis.chartVersion
      "auth"            (dict "existingSecret" "redis-auth" "existingSecretPasswordKey" "redis-password")
      "persistence"     (dict "enabled" true "storageClass" .Values.redis.storageClass "size" .Values.redis.size)
      "image"           .Values.redis.image
      "syncPolicy"      .Values.syncPolicy
      "cascadingDelete" .Values.cascadingDelete
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-redis" $appName | quote }}
  namespace: argocd
  {{- /* Middle layer: it renders an Application, never a workload, so it
         always carries the finalizer (see apps/homerun2 redis-stack.yaml). */}}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: apps/redis-stack/install
    helm:
      releaseName: dapr-workflows-redis
      valuesObject:
        {{- toYaml $rsValues | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
