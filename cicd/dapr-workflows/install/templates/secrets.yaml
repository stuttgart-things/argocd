{{- $appName := include "daprWorkflows.appName" . }}
{{- $s := .Values.secrets }}
{{- $kv := $s.vaultSecretName }}
{{- /* One ExternalSecret: Secret name, key in the Secret, entry, property and
       -- for a shared entry -- that entry's own store. */}}
{{- define "daprWorkflows.es" -}}
{{- $e := dict "secretName" .name "data" (list (dict "secretKey" .key "vaultSecretName" .entry "property" .property)) -}}
{{- if .store }}{{- $_ := set $e "clusterSecretStoreName" .store }}{{- end -}}
{{- toJson $e -}}
{{- end }}
{{- $sh := $s.shared }}
{{- $redisPw := include "daprWorkflows.es" (dict "name" "redis-password" "key" "password" "entry" $kv "property" "redisPassword") | fromJson }}
{{- /* namespace -> ExternalSecrets. Secret names and keys are the ones the
       OCI kustomize bases reference; their placeholder Secrets are deleted
       by the worker Applications, so ESO is the only writer. */}}
{{- $byNs := dict }}
{{- if and .Values.redis.enabled (or .Values.templateExecution.enabled .Values.clusterBuildWatch.enabled) }}
{{- $_ := set $byNs .Values.redis.namespace (list
      (include "daprWorkflows.es" (dict "name" "redis-auth" "key" "redis-password" "entry" $kv "property" "redisPassword") | fromJson)) }}
{{- end }}
{{- if .Values.templateExecution.enabled }}
{{- $_ := set $byNs .Values.templateExecution.namespace (list
      (include "daprWorkflows.es" (dict "name" "github-token" "key" "token" "entry" $sh.githubToken.vaultSecretName "property" "githubToken" "store" $sh.githubToken.clusterSecretStoreName) | fromJson)
      (include "daprWorkflows.es" (dict "name" "backstage-auth-token" "key" "token" "entry" $sh.backstageToken.vaultSecretName "property" "backstageToken" "store" $sh.backstageToken.clusterSecretStoreName) | fromJson)
      $redisPw) }}
{{- end }}
{{- if .Values.clusterBuildWatch.enabled }}
{{- $cbw := list $redisPw }}
{{- if .Values.clusterBuildWatch.homerunPitchURL }}
{{- $cbw = append $cbw (include "daprWorkflows.es" (dict "name" "homerun-pitcher-token" "key" "token" "entry" $sh.homerunAuthToken.vaultSecretName "property" "homerunAuthToken" "store" $sh.homerunAuthToken.clusterSecretStoreName) | fromJson) }}
{{- end }}
{{- if .Values.clusterBuildWatch.machineryAuth.enabled }}
{{- $cbw = append $cbw (include "daprWorkflows.es" (dict "name" "machinery-auth-token" "key" "token" "entry" $sh.machineryToken.vaultSecretName "property" "machineryToken" "store" $sh.machineryToken.clusterSecretStoreName) | fromJson) }}
{{- end }}
{{- $_ := set $byNs .Values.clusterBuildWatch.namespace $cbw }}
{{- end }}
{{- range $ns := keys $byNs | sortAlpha }}
{{- if not $s.clusterSecretStoreName }}
{{- fail "secrets.clusterSecretStoreName is required when a worker is enabled" }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-secrets-%s" $appName $ns | quote }}
  namespace: argocd
  {{- include "daprWorkflows.leafFinalizer" $ | nindent 0 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: {{ $.Values.project | quote }}
  source:
    repoURL: {{ $.Values.catalog.repoURL | quote }}
    targetRevision: {{ $.Values.catalog.targetRevision | quote }}
    path: cicd/externalsecrets
    helm:
      valuesObject:
        namespace: {{ $ns | quote }}
        clusterSecretStoreName: {{ $s.clusterSecretStoreName | quote }}
        refreshInterval: {{ $s.refreshInterval | quote }}
        secrets:
          {{- toYaml (get $byNs $ns) | nindent 10 }}
  destination:
    server: {{ $.Values.destination.server | quote }}
    namespace: {{ $ns | quote }}
  syncPolicy:
    {{- toYaml $.Values.syncPolicy | nindent 4 }}
{{- end }}
