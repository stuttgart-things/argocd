---
# ArgoCD AppProject the rendered Application belongs to.
project: default

# Where the rendered Application deploys.
destination:
  server: https://kubernetes.default.svc
  namespace: tekton-operator

# Source for the vendored Tekton Operator manifests. The rendered Application
# uses a `directory:` source (non-recursive) — the upstream manifests (~15k
# lines since the CRDs carry full schemas, one crd-<plural>.yaml per CRD) live
# in the Flux repo to avoid duplicating across repos.
#
# PINNED to a flux tag, not HEAD: HEAD made every flux merge a possible
# operator change on every cicd cluster, outside this catalog's own pin
# (stuttgart-things/stuttgart-things#3798). TODO(tag to be set after flux
# release): the tag carrying stuttgart-things/flux#779 = operator v0.81.2
# (previous pin v1.157.0 = operator v0.79.0). No renovate comment on purpose:
# flux releases several times a day and this directory almost never changes —
# move the tag together with a re-vendor of cicd/tekton/components/operator in
# flux (hack/vendor-tekton-operator.py there).
source:
  repoURL: https://github.com/stuttgart-things/flux.git
  targetRevision: v1.164.0  # PLACEHOLDER: tag to be set after flux release
  path: cicd/tekton/components/operator

# Sync policy applied to the rendered Application.
# sync-wave: -10 so the Operator CRDs register before dependent CRs
# (TektonConfig, etc.) in other sub-entries.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
