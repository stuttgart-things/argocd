{{- if .Values.hostname }}
{{- $appName := include "harborCicd.appName" . }}
{{- $list := list }}
{{- range $name, $keys := (include "harborCicd.secretMap" . | fromYaml) }}
{{- $data := list }}
{{- range $k, $prop := $keys }}
{{- $data = append $data (dict "secretKey" $k "vaultSecretName" $.Values.secrets.vaultSecretName "property" $prop) }}
{{- end }}
{{- $entry := dict "secretName" $name "data" $data }}
{{- if eq $name "harbor-eso-registry-credentials" }}
{{- /* Escaped for helm: ESO evaluates this, not this chart. */}}
{{- $_ := set $entry "template" (dict
      "REGISTRY_PASSWD" (printf "%s .registry_password %s" "{{" "}}")
      "REGISTRY_HTPASSWD" (printf "%s htpasswd \"harbor_registry_user\" .registry_password \"bcrypt\" %s" "{{" "}}")) }}
{{- end }}
{{- $list = append $list $entry }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-secrets" $appName | quote }}
  namespace: argocd
  {{- if .Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    # Before Harbor: its pods mount these Secrets and fail without them.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: cicd/externalsecrets
    helm:
      valuesObject:
        namespace: {{ .Values.destination.namespace | quote }}
        clusterSecretStoreName: {{ .Values.secrets.clusterSecretStoreName | quote }}
        refreshInterval: {{ .Values.secrets.refreshInterval | quote }}
        secrets:
          {{- toYaml $list | nindent 10 }}
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-token-cert" $appName | quote }}
  namespace: argocd
  {{- if .Values.cascadingDelete }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: cicd/harbor/token-cert
    helm:
      valuesObject:
        namespace: {{ .Values.destination.namespace | quote }}
        secretName: harbor-core-token-cert
  destination:
    server: {{ .Values.destination.server | quote }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
