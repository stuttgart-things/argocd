{{- /* Only when something is requested: the default (no secrets) renders
       nothing, which is what lint and the catalog probe see. */}}
{{- range .Values.secrets }}
{{- if not (.clusterSecretStoreName | default $.Values.clusterSecretStoreName) }}
{{- fail (printf "no ClusterSecretStore for %s: set clusterSecretStoreName (chart-wide or on the secret)" .secretName) }}
{{- end }}
{{- end }}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName | quote }}
  namespace: {{ $.Values.namespace | quote }}
spec:
  refreshInterval: {{ $.Values.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .clusterSecretStoreName | default $.Values.clusterSecretStoreName | quote }}
  target:
    name: {{ .secretName | quote }}
    {{- with .template }}
    {{- /* Values built from the fetched keys, e.g. a bcrypt htpasswd line:
           {{ htpasswd "user" .password "bcrypt" }} (ESO >= 2.x, sprig). */}}
    template:
      engineVersion: v2
      data:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ .vaultSecretName | quote }}
        property: {{ .property | quote }}
    {{- end }}
{{- end }}
