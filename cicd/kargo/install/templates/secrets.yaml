{{- /* kargo-admin from Vault, as a sibling Application (cicd/kargo/secrets).

       ON ONLY WHEN A STORE IS NAMED, and the store name is a string on purpose:
       an ApplicationSet can template only strings into valuesObject, so a
       `secrets.enabled` boolean could not come from a cluster label. appset-kargo
       passes the store only when the cluster carries the gate
       cicd-platform.stuttgart-things.com/secrets-config: "true", which a
       ClusterStack with the kargo profile derives. Everywhere else it is "" and
       nothing changes: kargo-admin stays the hand-made Secret the README
       describes. */ -}}
{{- with .Values.secrets }}
{{- if .clusterSecretStoreName }}
{{- $defaultName := printf "kargo-%s" (sha1sum $.Values.destination.server | trunc 8) }}
{{- $appName := $.Values.applicationName | default $defaultName }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-secrets" $appName | quote }}
  namespace: argocd
  annotations:
    # Ahead of kargo itself: kargo-api reads kargo-admin at pod start.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: {{ $.Values.project | quote }}
  source:
    repoURL: {{ $.Values.catalog.repoURL | quote }}
    targetRevision: {{ required "catalog.targetRevision: the tag this chart is rendered from, so the Secret and the install move together" $.Values.catalog.targetRevision | quote }}
    path: cicd/kargo/secrets
    helm:
      releaseName: kargo-secrets
      valuesObject:
        namespace: {{ $.Values.destination.namespace | quote }}
        clusterSecretStoreName: {{ .clusterSecretStoreName | quote }}
        vaultSecretName: {{ required "secrets.vaultSecretName: the Vault entry holding password and tokenSigningKey" .vaultSecretName | quote }}
        secretName: {{ .secretName | quote }}
  destination:
    server: {{ $.Values.destination.server | quote }}
    namespace: {{ $.Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml $.Values.syncPolicy | nindent 4 }}
{{- end }}
{{- end }}
