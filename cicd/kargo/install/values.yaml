---
# ArgoCD AppProject the rendered Application belongs to.
project: default

# Where the rendered Application deploys.
destination:
  server: https://kubernetes.default.svc
  namespace: kargo

# Upstream akuity/kargo OCI Helm chart version.
# renovate: datasource=docker depName=ghcr.io/akuity/kargo-charts/kargo
chartVersion: "1.12.7"

# Kargo API configuration.
api:
  # External hostname the API is reached at. Override per cluster. Must match
  # the httproute/ hostname and the cert Certificate dnsNames.
  host: kargo.example.com
  service:
    type: ClusterIP
  # TLS terminates at the Gateway / Ingress in front of the API Service —
  # not inside the Service itself.
  tls:
    enabled: false
  # The chart's own Ingress is disabled in favor of the httproute/ entry.
  ingress:
    enabled: false
  # Admin account credentials. SHIP AS EMPTY PLACEHOLDERS — don't deploy
  # as-is. See README.md "Credentials" for the three supported injection
  # patterns (External Secrets / AVP / SOPS overlay).
  adminAccount:
    passwordHash: ""     # pragma: allowlist secret
    tokenSigningKey: ""  # pragma: allowlist secret
    tokenTTL: 24h

# Controller + GC log levels (DEBUG / INFO / WARN / ERROR).
controller:
  logLevel: INFO
garbageCollector:
  logLevel: INFO

# Webhook server bootstraps TLS via its own self-signed cert, not cert-manager.
webhooksServer:
  tls:
    selfSignedCert: true

# Login via OIDC (ZITADEL) next to the local admin, as flux's kargo-oidc
# (stuttgart-things#4859). Kargo runs the authorization code flow with PKCE
# in the browser: a PUBLIC client (ZITADEL: user agent app, auth method none),
# so there is no client secret.
oidc:
  # e.g. https://zitadel.infra.example, no trailing slash. Empty = off.
  issuer: ""
  # ZITADEL client ID (digits only -- keep it quoted).
  clientId: ""
  # ID token claim the role mapping reads: a LIST of role keys. Kargo, like
  # Argo CD, cannot read ZITADEL's roles map; the zitadel-config roots add
  # argocd_roles with an action for the argocd project.
  rolesClaim: argocd_roles
  # Role keys mapped to Kargo admin / viewer (read-only, no Secrets).
  adminRole: argocd-admin
  viewerRole: argocd-reader
  # Sent next to openid profile email.
  additionalScopes:
    - urn:zitadel:iam:org:projects:roles
  # CA bundle ConfigMap for the issuer (the chart's cabundle init container
  # splits a multi-cert bundle itself). Empty = system roots.
  caConfigMap: cluster-trust-bundle

# kargo-admin from Vault through External Secrets (../secrets). OFF while
# clusterSecretStoreName is empty -- then kargo-admin is the hand-made Secret
# ../README.md describes. A string, not an `enabled` flag, because an
# ApplicationSet can template only strings into these values.
secrets:
  clusterSecretStoreName: ""
  # Vault KV entry carrying `password` and `tokenSigningKey`; on a ClusterStack
  # cluster, the cluster's own name.
  vaultSecretName: ""
  # Must match the upstream chart's `api.secret.name`, which the consumer sets.
  secretName: kargo-admin

# Where ../secrets is read from. targetRevision is required once secrets are on:
# the tag this chart itself is rendered from, so the two cannot drift.
catalog:
  repoURL: https://github.com/stuttgart-things/argocd.git
  targetRevision: ""

# Deep-merged on top of the computed valuesObject passed to the upstream chart.
# Use for any upstream key not exposed as a first-class value above (resources,
# nodeSelector, image pinning, extra env, OIDC config, etc.).
extraValues: {}

# Sync policy applied to the rendered Application.
syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  retry:
    limit: 5
    backoff:
      duration: 10s
      factor: 2
      maxDuration: 3m
