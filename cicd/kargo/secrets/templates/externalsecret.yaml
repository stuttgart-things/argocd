{{- /* kargo-admin, from the Vault entry a ClusterStack writes for the kargo
       profile (AppSecretProfile `kargo`, stuttgart-things/stuttgart-things#3232).

       Kargo wants ADMIN_ACCOUNT_PASSWORD_HASH as a bcrypt hash, $2a$ variant.
       Vault holds the password IN PLAIN -- an AppSecretProfile can generate a
       value but not hash one -- so the hash is made here, by ESO's template
       engine (sprig `bcrypt`, golang.org/x/crypto: $2a$).

       refreshPolicy CreatedOnce, because bcrypt salts: a periodic refresh
       would write a new, equally valid hash every interval and churn a Secret
       nothing is waiting on. Kargo reads it only at pod start anyway. To
       rotate: change the Vault entry, delete this Secret, restart kargo-api --
       the same two steps the README's hand-made Secret needed, minus making
       the hash. */ -}}
{{- if .Values.vaultSecretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName | quote }}
  namespace: {{ .Values.namespace | quote }}
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.clusterSecretStoreName | quote }}
  target:
    name: {{ .Values.secretName | quote }}
    template:
      engineVersion: v2
      data:
        ADMIN_ACCOUNT_PASSWORD_HASH: {{ `"{{ .password | bcrypt }}"` }}
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: {{ `"{{ .tokenSigningKey }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.vaultSecretName | quote }}
        property: password
    - secretKey: tokenSigningKey
      remoteRef:
        key: {{ .Values.vaultSecretName | quote }}
        property: tokenSigningKey
{{- end }}
