# Namespace kargo-admin lands in -- the one the kargo chart reads it from.
namespace: kargo

# ClusterSecretStore the ExternalSecret reads through. Must exist on the
# workload cluster; on a ClusterStack cluster the stack derives it (vault-kargo).
clusterSecretStoreName: vault-kargo

# Vault KV entry under the store's mount, carrying `password` and
# `tokenSigningKey` (AppSecretProfile `kargo`: kargo/<cluster>). Empty renders
# NOTHING rather than a guessed entry: a default here would read some other
# cluster's admin credential without a word. ../install, the only caller,
# requires it.
vaultSecretName: ""

# The Secret name. It is what the kargo chart is told to consume through
# `api.secret.name`, so the two must agree.
secretName: kargo-admin
