{{- $route := .Values.httpRoute | default dict }}
{{- if eq (toString ($route.enabled | default false)) "true" }}
{{- if not $route.hostname }}
{{- fail "httpRoute.enabled is true but httpRoute.hostname is empty" }}
{{- end }}
{{- $gw := $route.gateway | default dict }}
{{- if not $gw.name }}
{{- fail "httpRoute.enabled is true but httpRoute.gateway.name is empty" }}
{{- end }}
{{- $destKey := .Values.destination.name | default .Values.destination.server }}
{{- $defaultName := printf "komoplane-%s" (sha1sum $destKey | trunc 8) }}
{{- $appName := .Values.applicationName | default $defaultName }}
{{- $routeValues := dict
      "namespace" .Values.destination.namespace
      "hostname"  $route.hostname
      "gateway"   (dict "name" $gw.name "namespace" ($gw.namespace | default "default") "sectionName" ($gw.sectionName | default ""))
      "backend"   (dict "name" "komoplane" "port" 8090)
}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "%s-httproute" $appName | quote }}
  namespace: argocd
  annotations:
    # After the chart: the route's backend is the Service it creates.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: {{ .Values.project | quote }}
  source:
    repoURL: {{ .Values.catalog.repoURL | quote }}
    targetRevision: {{ .Values.catalog.targetRevision | quote }}
    path: cicd/komoplane/httproute
    helm:
      releaseName: komoplane-httproute
      valuesObject:
        {{- toYaml $routeValues | nindent 8 }}
  destination:
    {{- if .Values.destination.name }}
    name: {{ .Values.destination.name | quote }}
    {{- else }}
    server: {{ .Values.destination.server | quote }}
    {{- end }}
    namespace: {{ .Values.destination.namespace | quote }}
  syncPolicy:
    {{- toYaml .Values.syncPolicy | nindent 4 }}
{{- end }}
