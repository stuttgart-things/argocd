---
# Komoplane has NO authentication: anyone who reaches this hostname reads every
# Crossplane claim, composite and managed resource. Lab-internal Gateways only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: komoplane
  namespace: {{ .Values.namespace | quote }}
  labels:
    app.kubernetes.io/name: komoplane
spec:
  {{- /* Fields the API server defaults (group/kind/weight) are written out:
         implicit, they come back on the live object and Argo reports the
         route OutOfSync forever while it works. */}}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name | quote }}
      namespace: {{ .Values.gateway.namespace | quote }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.backend.name | quote }}
          port: {{ .Values.backend.port }}
          weight: 1
