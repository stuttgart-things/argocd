---
# kured (Kubernetes Reboot Daemon), as part of the base platform.
#
# Reboots a node after an OS update asked for it (/var/run/reboot-required),
# one node at a time, with cordon and drain, inside a weekday window
# (infra/kured/install/values.yaml: mo-fr 04:00-06:00 UTC). Runs ON THE
# WORKLOAD CLUSTER: it reboots the nodes it runs on.
#
# OPT-IN, unlike the other components of this platform and the convention in
# platforms/README.md: a component that reboots nodes must never arrive on a
# cluster because it carries the umbrella label. Both labels are required:
#
#   base-platform: "true"
#   base-platform/kured: "true"
#
# Why: stuttgart-things/stuttgart-things#4590 -- nine VMs of the fleet waited
# for a reboot after kernel/libc updates, some with two kernel generations.
#
# NOTIFICATIONS to the central homerun2 (drain / reboot / uncordon, system
# `kured`), opt-in per cluster with `base-platform/kured-notify: "true"`.
# Where to and with what, from the cluster secret's annotations -- the
# kured-specific one first, else the K8sGPT reporter's, which already points
# at the central omni-pitcher:
#   base-platform.stuttgart-things.com/kured-notify-url  | observability-platform.stuttgart-things.com/k8sgpt-central-url
#   base-platform.stuttgart-things.com/kured-notify-ca   | observability-platform.stuttgart-things.com/k8sgpt-central-ca
#   base-platform.stuttgart-things.com/kured-notify-secret-key | observability-platform.stuttgart-things.com/k8sgpt-reporter-secret-key | _omni-pitcher
#   base-platform.stuttgart-things.com/secret-store      | observability-platform.stuttgart-things.com/secret-store | vault
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kured-base
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # No `preserveResourcesOnDeletion`: this AppSet generates an app-of-apps
  # parent, see appset-reloader.yaml (#324).
  generators:
    - clusters:
        selector:
          matchLabels:
            base-platform: "true"
            base-platform/kured: "true"
  template:
    metadata:
      name: 'kured-base-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    spec:
      project: '{{ .name }}'
      # The parent renders an Application CRD into argocd on the management
      # cluster; the child targets the workload cluster via destination.server.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # The first tag with infra/kured/resources (notify).
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.119.0
        path: infra/kured/install
        helm:
          releaseName: 'kured-{{ .name }}'
          # A YAML string, not valuesObject: the notify toggle needs a real
          # bool and the CA a multi-line PEM (toJson) -- same as appset-k8sgpt.
          values: |
            {{- $l := .metadata.labels }}
            {{- $a := .metadata.annotations }}
            # MUST differ from this template's own metadata.name above (see
            # appset-reloader.yaml).
            applicationName: 'kured-{{ .name }}'
            project: '{{ .name }}'
            cluster: '{{ .name }}'
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.119.0
            destination:
              server: '{{ .server }}'
              namespace: kube-system
            notify:
              enabled: {{ eq (default "" (index $l "base-platform/kured-notify")) "true" }}
              url: '{{ default (default "" (index $a "observability-platform.stuttgart-things.com/k8sgpt-central-url")) (index $a "base-platform.stuttgart-things.com/kured-notify-url") }}'
              secretStore:
                kind: ClusterSecretStore
                name: '{{ default (default "vault" (index $a "observability-platform.stuttgart-things.com/secret-store")) (index $a "base-platform.stuttgart-things.com/secret-store") }}'
              remoteKey: '{{ default (default "_omni-pitcher" (index $a "observability-platform.stuttgart-things.com/k8sgpt-reporter-secret-key")) (index $a "base-platform.stuttgart-things.com/kured-notify-secret-key") }}'
              property: alertmanager-webhook-token
              # toJson: a multi-line PEM as one quoted YAML scalar.
              centralCa: {{ toJson (default (default "" (index $a "observability-platform.stuttgart-things.com/k8sgpt-central-ca")) (index $a "base-platform.stuttgart-things.com/kured-notify-ca")) }}
            # Window, drain timeout and forceReboot stay at the chart's
            # defaults; see infra/kured/install/values.yaml for why.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
