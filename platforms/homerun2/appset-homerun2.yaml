---
# The homerun2 event bus, as a steady-state platform install.
#
# Fans out across clusters labelled `homerun2-platform: "true"` that are
# clusterbook-registered (they carry the `<cluster>-gateway` Gateway and its
# wildcard cert the HTTPRoutes below depend on) and whose ClusterSecretStore
# already exists. One parent app-of-apps per cluster, rendering
# apps/homerun2/install, which in turn renders the redis-stack, the pitchers and
# catchers, and the routes.
#
# COMPONENTS ARE PER-CLUSTER LABELS, two kinds:
#
#   core   ON unless `homerun2-platform/<component>: "false"`
#          redis-stack, omni-pitcher, core-catcher, scout, led-catcher
#          -- what `flux/apps/homerun2/profiles/platform` installs, and what
#          this AppSet shipped as a fixed set until the labels existed, so a
#          cluster that only carries the umbrella keeps exactly that.
#   extra  OFF unless `homerun2-platform/<component>: "true"`
#          light-catcher, wled-mock, demo-pitcher, config-viewer,
#          notification-catcher, git-pitcher, k8s-pitcher, smoke-test,
#          schedule-pitcher, ai-pitcher, sound-catcher,
#          notification-catcher-sink, notification-catcher-ui
#          -- dev/lab tools, hardware, or things that need more than the
#          AppSecretProfile provides (see the notes at each below). Opt-in, not
#          opt-out: under "absent means on" every cluster carrying the umbrella
#          today would start them on the next sync.
#
# The toggles arrive through `helm.values`, a YAML STRING, not `valuesObject`:
# an AppSet can only template strings, and a `<component>.enabled: "true"`
# string fails the chart schema, which wants a boolean. In `values` the text is
# parsed as YAML by Helm, so `enabled: true` is a real bool -- the technique
# platforms/network/appset-cert-manager-cluster-ca.yaml already uses. The
# earlier comment here said booleans were impossible; they are not.
#
# EVERYTHING LIVES IN `values`; there is NO `valuesObject`. When a source sets
# `valuesObject`, Argo CD uses it and IGNORES `values` altogether -- it does not
# merge them. #544 had toggles in `values` and the rest in `valuesObject`, so
# every toggle, hostname and the omni-pitcher routes were dropped: led-catcher
# (chart default off) vanished, the omni-pitcher route collided again on the
# placeholder hostname, and the opt-outs did nothing (#545 moved blocks between
# the two, which could not help). platforms/network/appset-cert-manager-
# cluster-ca.yaml, the precedent, likewise has `values` only.
#
# Turning redis-stack off breaks every catcher and pitcher unless they point at
# another Redis; it is a toggle for a cluster that runs one elsewhere.
#
# The whole stack is opted out with `homerun2-platform/stack: "false"`, as
# before (selector below).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homerun2-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # `cascadingDelete: false` below is the other half: it takes the finalizers
  # off the children so an opt-out stops Argo managing homerun2 rather than
  # deleting it. Same pair as platforms/cicd/appset-machinery.yaml.
  generators:
    - clusters:
        selector:
          matchLabels:
            homerun2-platform: "true"
          matchExpressions:
            - key: homerun2-platform/stack
              operator: NotIn
              values: ["false"]
            # The routes need the clusterbook `<cluster>-gateway` Gateway and
            # `<cluster>-gateway-tls` wildcard cert, and every hostname below is
            # derived from the reserved FQDN. The operator stamps
            # allocation-ip="" on registration-only kind clusters, so Exists
            # alone over-matches -- NotIn [""] excludes those.
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: Exists
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: NotIn
              values: [""]
            # Every component's Redis password and the /pitch bearer token come
            # from the ClusterSecretStore named in the annotations below. Present
            # this label only once that store exists and its role can read the
            # entry -- ExternalSecrets fail closed, so without it the Pods sit in
            # CreateContainerConfigError waiting for Secrets that never appear.
            # Gated on the VALUE, not on `Exists` the way storage-platform's
            # nfs-config gate is. Under Exists a label set to 'false' still
            # satisfies the gate -- and cluster.reference.yaml's own convention
            # is to write every label a cluster does not want as an explicit
            # 'false', which would then switch this on rather than off.
            - key: homerun2-platform.stuttgart-things.com/secrets-config
              operator: In
              values: ["true"]
  template:
    metadata:
      # `-platform` suffix on the parent so it cannot collide with the
      # chart-rendered children, which derive from `applicationName`
      # (`homerun2-<cluster>-omni-pitcher` and friends). An inner Application
      # carrying the generated parent's name would be the same object: the parent
      # server-side-applies the child spec over itself, the ApplicationSet
      # controller puts its own back a moment later, and nothing ever deploys --
      # while everything reports "successfully synced".
      name: 'homerun2-platform-{{ .name }}'
      annotations:
        # Informational -- top-level Applications don't order across appsets;
        # retry handles the race if the Gateway or the ClusterSecretStore is not
        # up yet.
        argocd.argoproj.io/sync-wave: "6"
    spec:
      project: '{{ .name }}'
      # The parent renders Application CRDs, which must land in the argocd ns on
      # the management cluster. The children target the remote cluster via
      # destination.server in the values below.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # v0.34.0 is the first tag that carries `cascadingDelete`; this AppSet
        # shipped on `main` until it existed, because a pin at an older tag fails
        # schema validation with "Additional property cascadingDelete is not
        # allowed". Renovate's "Catalog self-pin" rule moves both pins from here
        # on -- deliberately never auto-merged, so rolling a catalog release out
        # to every labelled cluster stays a human decision.
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.105.1
        path: apps/homerun2/install
        helm:
          releaseName: 'homerun2-{{ .name }}'
          # The component toggles -- see the header. Core: `ne … "false"`,
          # extras: `eq … "true"`. `default ""` because missingkey=error would
          # otherwise not apply to `index`, but an absent label still has to
          # read as "not set".
          values: |
            {{- $l := default (dict) .metadata.labels }}
            # Component VERSIONS are intentionally not overridden -- they inherit
            # apps/homerun2/install/values.yaml, which Renovate keeps bumped, so
            # the platform tracks the released chart default rather than a second
            # pinned copy.
            #
            # Which components run is decided by the `values` toggles above.
            # Everything below configures a component IF it runs; for one that
            # is off it renders nothing.
            #
            # Extras that need more than this AppSet knows:
            #   notification-catcher  the shared Teams webhook entry
            #                         (…/shared-teams-webhook-secret-key below)
            #                         and its notify config (…/notification-
            #                         catcher-notify-config, else out of band)
            #   git-pitcher           the shared GitHub token entry
            #                         (…/shared-git-pat-secret-key below)
            #   k8s-pitcher           a profile (…/k8s-pitcher-profile, else
            #                         out of band); the base brings its
            #                         ClusterRole
            #   schedule-pitcher      `schedulePitcherAuthToken` in the cluster
            #                         entry; profile (…/schedule-pitcher-
            #                         profile) and Roles for its secret checks
            #                         (…/schedule-pitcher-secret-access)
            #   ai-pitcher            the shared OpenRouter entry
            #                         (…/shared-openrouter-secret-key below),
            #                         optional; reads schedule-pitcher's
            #                         findings when that runs too
            #   sound-catcher         nothing (browser player page only)
            # Without a ScoutProfile (…/scout-profile) scout runs on its
            # environment defaults and leaves alerting off.
            redisStack:
              enabled: {{ ne (default "" (index $l "homerun2-platform/redis-stack")) "false" }}
              persistence:
                enabled: true
                # The chart default is `standard`, which does not exist on these
                # clusters. `openebs-hostpath` is the fleet default SC
                # (storage-platform/openebs); name another one here on a cluster
                # that uses longhorn or an NFS class.
                storageClass: '{{ default "openebs-hostpath" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/storage-class") }}'
                size: '{{ default "8Gi" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/redis-storage-size") }}'
              # Image tag per cluster, rendered only when the annotation is set:
              # without it the chart default stays (Renovate keeps it bumped).
              # Redis Stack 7.4 writes RDB v12, which 7.2 cannot load -- each
              # cluster moves on purpose (stuttgart-things#3923).
              {{- with (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/redis-image-tag") }}
              image:
                tag: '{{ . }}'
              {{- end }}
              # Read the password from the ESO-managed Secret rather than an
              # inline literal. `secrets.enabled` below materializes it under
              # exactly this name.
              auth:
                existingSecret: redis-stack-auth
            omniPitcher:
              enabled: {{ ne (default "" (index $l "homerun2-platform/omni-pitcher")) "false" }}
              # The chart patches the HTTPRoute shipped inside the omni-pitcher
              # OCI (parentRef + hostname) and the shared -httproute
              # Application skips omni-pitcher. Off, BOTH rendered a route of
              # the same name and the OCI's placeholder
              # homerun2-omni-pitcher.example.com won (#518, #498) -- the one
              # hostname alerts are sent to.
              inlineHttpRoute: true
              hostname: 'omni-pitcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              # The stream allowlist the bus offers, matching what the flux path
              # ships. `tabletennis` is in it on every cluster, not only those
              # running the tabletennis platform: an allowlisted stream nothing
              # writes to costs nothing (Redis creates a stream on first XADD),
              # and having it here means adding that platform later needs no
              # change to homerun2. Without the rule, zaehlwerk's scores would
              # land on `messages` -- the pitch still returns 200, every Pod
              # reports Healthy, and the tabletennis catcher watches an empty
              # stream.
              #
              # NOT included: the flux default's `/pitch/grafana -> alerts` and
              # `/pitch/github -> github-events` rules. This profile runs no
              # notification-catcher, so routing Alertmanager off `messages`
              # would only hide alerts from core-catcher and scout. A cluster
              # that wants them adds both rules AND
              # `notificationCatcher.redisStream: alerts` in the same change.
              routesContent: |
                streams:
                  - messages
                  - tabletennis
                default_stream: messages
                routes:
                  - match:
                      system: tabletennis
                    stream: tabletennis
            coreCatcher:
              enabled: {{ ne (default "" (index $l "homerun2-platform/core-catcher")) "false" }}
              hostname: 'core-catcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            scout:
              enabled: {{ ne (default "" (index $l "homerun2-platform/scout")) "false" }}
              hostname: 'scout.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              # The ScoutProfile spec (alerting, retention, scout's own digest)
              # from a cluster annotation, multi-line YAML; the chart renders
              # the CR. Empty: no ScoutProfile, as before. `toJson` for the
              # same reason as notifyConfig below.
              profile:
                content: {{ toJson (default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/scout-profile")) }}
            # The catcher zaehlwerk switches onto the tabletennis stream during a
            # match. On in the flux platform profile too; harmless on a cluster
            # without tabletennis, where it just consumes `messages`.
            ledCatcher:
              enabled: {{ ne (default "" (index $l "homerun2-platform/led-catcher")) "false" }}
              hostname: 'led-catcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            # ---- extras (opt-in, see the header) ----------------------------
            # Hostnames only; each renders nothing while its toggle is off.
            lightCatcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/light-catcher")) "true" }}
              hostname: 'light-catcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            wledMock:
              enabled: {{ eq (default "" (index $l "homerun2-platform/wled-mock")) "true" }}
              hostname: 'wled-mock.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            demoPitcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/demo-pitcher")) "true" }}
              hostname: 'demo-pitcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            configViewer:
              enabled: {{ eq (default "" (index $l "homerun2-platform/config-viewer")) "true" }}
              hostname: 'config-viewer.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            notificationCatcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/notification-catcher")) "true" }}
              # Log instead of post. Worth setting while the notify config is
              # new: the first wrong filter posts to a real Teams channel.
              dryRun: {{ eq (default "" (index $l "homerun2-platform/notification-catcher-dry-run")) "true" }}
              # The notify config (config.yaml) from a cluster annotation; the
              # chart turns it into the ConfigMap. Empty keeps it out of band.
              # `toJson`, not a single-quoted scalar: the annotation is multi-line
              # YAML full of double quotes, and a JSON string is a valid
              # one-line YAML double-quoted scalar whatever it contains. Its
              # `${TEAMS_WEBHOOK_URL}` placeholders pass through untouched --
              # the catcher expands them.
              notifyConfig: {{ toJson (default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/notification-catcher-notify-config")) }}
              # Streams to consume, comma-separated (`messages,tabletennis`), all
              # by the one Deployment (REDIS_STREAMS). Empty = the chart's
              # redisStream alone, i.e. `messages`, and no new ConfigMap key.
              redisStreams: {{ toJson (default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/notification-catcher-streams")) }}
              # The notification sink (stand-in receiver for the outputs, UI
              # under notification-sink.<fqdn>). Rendered only for a labelled
              # cluster: a catalog pin from before the chart knew `sink`
              # rejects the key, so an unlabelled fleet stays valid whatever
              # the pin. Outputs point at it from the notify config above.
              {{- if eq (default "" (index $l "homerun2-platform/notification-catcher-sink")) "true" }}
              sink:
                enabled: true
                hostname: 'notification-sink.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              {{- end }}
              # The catcher's read-only UI (config, event log, /metrics) under
              # notification-catcher.<fqdn>; links to the sink when that is on.
              # Labelled clusters only, same reason as `sink`.
              {{- if eq (default "" (index $l "homerun2-platform/notification-catcher-ui")) "true" }}
              ui:
                enabled: true
                hostname: 'notification-catcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              {{- end }}
            gitPitcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/git-pitcher")) "true" }}
              hostname: 'git-pitcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            k8sPitcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/k8s-pitcher")) "true" }}
              # The K8sPitcherProfile document (multi-line YAML); the chart
              # creates the ConfigMap. Empty keeps it out of band.
              profileContent: {{ toJson (default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/k8s-pitcher-profile")) }}
            # Expiry checks, reminders and agents' findings, with a UI. Its
            # token is `schedulePitcherAuthToken` in the cluster's entry.
            schedulePitcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/schedule-pitcher")) "true" }}
              hostname: 'schedule-pitcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              # The SchedulePitcherProfile (multi-line YAML). Empty: a minimal
              # profile without checks that still takes agents' findings.
              profileContent: {{ toJson (default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/schedule-pitcher-profile")) }}
              # get on the Secrets the profile's checks read, as ONE-LINE JSON
              # (or YAML flow), e.g.
              # [{"namespace":"argocd","secrets":["argocd-repo-x"]}] -- it is
              # inserted as is, so a block-style YAML list breaks the values.
              secretAccess: {{ default "[]" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/schedule-pitcher-secret-access") }}
            # AI summaries via OpenRouter; all four modes on (chart default).
            # With schedule-pitcher on as well, they include its open findings.
            aiPitcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/ai-pitcher")) "true" }}
            # Browser player page only -- a Pod has no speaker.
            soundCatcher:
              enabled: {{ eq (default "" (index $l "homerun2-platform/sound-catcher")) "true" }}
              hostname: 'sound-catcher.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            smokeTest:
              enabled: {{ eq (default "" (index $l "homerun2-platform/smoke-test")) "true" }}
            # ---- not component toggles: the app-of-apps wiring ----
            # MUST differ from this template's own metadata.name above -- see the
            # comment there.
            applicationName: 'homerun2-{{ .name }}'
            project: '{{ .name }}'
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.105.1
            # Target the labelled remote cluster, not the management one.
            destination:
              server: '{{ .server }}'
              namespace: homerun2
            # A long-lived platform install: an opt-out should stop Argo CD
            # managing homerun2, not uninstall it -- and against an already
            # deregistered cluster a prune can never complete, leaving the child
            # Applications stuck in Terminating (#324).
            cascadingDelete: false

            httpRoute:
              enabled: true
              gateway:
                name: '{{ .name }}-gateway'
                namespace: default

            secrets:
              enabled: true
              clusterSecretStoreName: '{{ index .metadata.annotations "homerun2-platform.stuttgart-things.com/secret-store" }}'
              # Vault KV entry under the store's mount, carrying `authToken` and
              # `redisPassword`. Defaults to the cluster name so a fleet can use
              # one entry per cluster without an annotation per cluster.
              vaultSecretName: '{{ default .name (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/secret-key") }}'
              # The shared GitHub PAT for the git-pitcher. A ClusterStack
              # (xplane-cluster >= 0.18.0) publishes its entry; empty keeps it
              # on vaultSecretName.
              githubTokenVaultSecretName: '{{ default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/shared-git-pat-secret-key") }}'
              # The shared Teams webhook (property `teamsWebhookUrl`) for the
              # notification-catcher. The ClusterStack publishes the entry
              # (`_teams-webhook`) once the AppSecretProfile carries
              # `teamsWebhookUrl: {shared: teams-webhook}`. Read from the SAME
              # store as everything else -- its
              # …/shared-teams-webhook-secret-store annotation is not consulted.
              # Empty renders no ExternalSecret.
              teamsWebhookVaultSecretName: '{{ default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/shared-teams-webhook-secret-key") }}'
              # The shared OpenRouter key (property `openrouterApiKey`, e.g.
              # `_openrouter`) for the ai-pitcher, same store. Empty renders no
              # ExternalSecret and the ai-pitcher pitches the plain digest.
              openrouterVaultSecretName: '{{ default "" (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/shared-openrouter-secret-key") }}'
              refreshInterval: 1h
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
