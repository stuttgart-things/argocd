apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: longhorn-storage
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # The CSI driver, StorageClass and live PVs stay put either way. See
  # README.md, "Opt-out and teardown".
  generators:
    - clusters:
        selector:
          matchLabels:
            storage-platform: "true"
          matchExpressions:
            - key: storage-platform/longhorn
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: longhorn-storage-{{ .name }}
      annotations:
        # CSI driver must land before any consumer PVCs bind to it.
        argocd.argoproj.io/sync-wave: "-10"
    spec:
      project: '{{ .name }}'
      # App-of-apps: parent Application lives on the management cluster; the
      # rendered chart emits a child Application targeting the workload cluster
      # via `valuesObject.destination`.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.99.0
        path: infra/longhorn/install
        helm:
          valuesObject:
            project: '{{ .name }}'
            # Override the chart's default child-Application name (sha8 of
            # destination.server) so the inner Application is uniquely named
            # and won't collide with other longhorn installs on the same
            # mgmt-cluster argocd namespace.
            #
            # NOT the parent's own name (longhorn-storage-<cluster>): with the
            # same name the parent renders itself, Argo keeps overwriting its
            # spec with the child's and Longhorn never reaches the cluster --
            # seen on labda-apps-test1, the first cluster that turned it on
            # (stuttgart-things#3715). Same shape as velero-storage-<c> ->
            # velero-<c>.
            applicationName: longhorn-{{ .name }}
            destination:
              server: '{{ .server }}'
              namespace: longhorn-system
            # platforms/storage leaves openebs-hostpath as the cluster's
            # default StorageClass. Longhorn claims default only when the
            # cluster asks for it with the annotation
            # `storage-platform.stuttgart-things.com/longhorn-default-class:
            # "true"` AND has opted out of this platform's openebs
            # (`storage-platform/openebs: "false"`) -- otherwise two SCs would
            # claim default. The annotation alone is a no-op on purpose.
            # See README "Default StorageClass conflicts".
            defaultStorageClass: '{{ and (eq (toString (index (default (dict) .metadata.annotations) "storage-platform.stuttgart-things.com/longhorn-default-class")) "true") (eq (toString (index .metadata.labels "storage-platform/openebs")) "false") }}'
            # Replicas per volume of the `longhorn` StorageClass (and for
            # volumes created in the UI). 1 unless the cluster says otherwise;
            # set "3" on 3-node app clusters. The chart turns the string into
            # an int and its schema rejects anything outside 1..20.
            defaultClassReplicaCount: '{{ index (default (dict) .metadata.annotations) "storage-platform.stuttgart-things.com/longhorn-replica-count" | default "1" }}'
            # Longhorn UI on the clusterbook gateway: opt-IN with the label
            # `storage-platform/longhorn-ui-route: "true"`, hostname
            # longhorn.<fqdn>. THE UI HAS NO AUTHENTICATION -- lab-internal
            # gateways only. Without the fqdn annotation the hostname is empty
            # and the chart fails the render instead of routing nowhere.
            httpRoute:
              enabled: '{{ eq (toString (index .metadata.labels "storage-platform/longhorn-ui-route")) "true" }}'
              hostname: '{{ if eq (toString (index .metadata.labels "storage-platform/longhorn-ui-route")) "true" }}{{ with (index (default (dict) .metadata.annotations) "clusterbook.stuttgart-things.com/fqdn") }}longhorn.{{ trimPrefix "*." . }}{{ end }}{{ end }}'
              gateway:
                name: '{{ .name }}-gateway'
                namespace: default
                sectionName: https
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
