---
# Per-PR preview environments for stuttgart-things/zaehlwerk.
#
# Fans out across (clusters labelled zaehlwerk-pr-preview: "true") x (open PRs
# on zaehlwerk carrying the `preview` label). One parent Application per cell,
# rendering the tabletennis bundle (apps/tabletennis/install) into its own
# namespace: zaehlwerk from the PR's artefact plus a schmetterpause of its own
# (seeded `preview` tag), wired by the handover -- the one place the two meet.
# A won match lands in the preview's league, never in the real one.
#
# No panel and no LED strip: a test match must not take over the real strip.
#
# Prereqs not declared here:
#   - The target cluster registered with the label zaehlwerk-pr-preview: "true".
#   - CI publishing ghcr.io/stuttgart-things/zaehlwerk{,-kustomize}:pr-<n>-<head sha>
#     (zaehlwerk .github/workflows/push-kustomize-pr.yaml) and
#     schmetterpause-kustomize:preview (schmetterpause CI job kustomize-preview).
#
# What it does NOT need, because the platform already has it: the PR-reader
# token (homerun2-omni-pitcher-pat, shared by every preview set), the
# AppProject (cluster-projects grants namespace '*'), and Vault work -- both
# apps read the entries the cluster's permanent tabletennis platform reads,
# see secretSources below.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zaehlwerk-pr-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  zaehlwerk-pr-preview: "true"
          - pullRequest:
              github:
                owner: stuttgart-things
                repo: zaehlwerk
                tokenRef:
                  secretName: homerun2-omni-pitcher-pat
                  key: token
                # The opt-in: CI builds an artefact for every PR, but a
                # Renovate bump does not need an environment.
                labels:
                  - preview
              requeueAfterSeconds: 600
  template:
    metadata:
      name: 'zaehlwerk-pr-{{ .number }}'
      labels:
        zaehlwerk.stuttgart-things.com/pr: '{{ .number }}'
      # Without it Argo deletes the parent the moment the generator drops the
      # PR and orphans the child and its workload. With it, prune runs first.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{ .name }}'
      # The parent renders an Application, so it lands in argocd on the
      # management cluster; the workload cluster has no argoproj.io CRDs.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        targetRevision: main
        path: apps/tabletennis/install
        helm:
          releaseName: 'zaehlwerk-pr-{{ .number }}'
          valuesObject:
            # The bundle (apps/tabletennis/install): schmetterpause and zaehlwerk
            # together, wired by the handover -- the one place the two meet
            # (zaehlwerk ADR-0004, schmetterpause ADR-0015). A preview of either
            # side shows the other too. Both in the preview's namespace.
            #
            # NOT the parent's name: the chart names its children
            # <applicationName>-schmetterpause / -zaehlwerk, and a child called
            # zaehlwerk-pr-<n> would be the parent.
            applicationName: 'zaehlwerk-pr-{{ .number }}-bundle'
            project: '{{ .name }}'
            destination:
              name: '{{ .name }}'
            domain: '{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            gateway:
              name: '{{ .name }}-gateway'
              namespace: default
              sectionNameHTTPS: https
              sectionNameHTTP: http

            # Stores and entries as the cluster's tabletennis platform reads them
            # (annotations stamped by its ClusterStack), so a preview reads what
            # the cluster's permanent schmetterpause and zaehlwerk read -- and the
            # handover token from <entry>-scoreboard, one credential both sides of
            # the preview read.
            secretStore:
              kind: ClusterSecretStore
              name: '{{ default "vault-schmetterpause" (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-store") }}'
            secretSources:
              schmetterpause:
                store: '{{ default "vault-schmetterpause" (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-store") }}'
                entry: '{{ default .name (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-key") }}'
              homerun2:
                store: '{{ default "vault-homerun2" (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/homerun2-secret-store") }}'
                entry: '{{ default .name (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/homerun2-secret-key") }}'

            # No panel and no LED strip: a test match must not take over the
            # real strip. Empty homerun2.namespace is the chart's "homerun2 is
            # not here" -- zaehlwerk runs without a panel, the light-catcher is
            # refused.
            homerun2:
              namespace: ""
            lightCatcher:
              enabled: false

            schmetterpause:
              namespace: 'zaehlwerk-pr-{{ .number }}'
              # Under the gateway's wildcard certificate and wildcard DNS: one
              # label, derived from the cluster like every other preview.
              hostname: 'schmetterpause-zaehlwerk-pr-{{ .number }}.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              # Moving tag: main, rendered with the seed Job (schmetterpause CI job
                # kustomize-preview). zaehlwerk takes its players AND the people
                # allowed to keep score from here, so an empty league would make
                # the zaehlwerk preview unusable.
              version: preview
              # The receiving side of the handover; with zaehlwerk.handover on
              # (the default) this one switch wires both ends.
              scoreboard:
                enabled: true
              values:
                database:
                  enabled: true
                  instances: 1
                  # OFF here, and only here: a preview is meant to die with its
                  # pull request, and with the guard on the Postgres pod and its
                  # volume outlive it (observed on pr-187).
                  protect: false
                  storage:
                    # One PVC per open labelled PR -- an eighth of the permanent
                    # instance. Explicit class: this cluster has TWO defaults.
                    size: 1Gi
                    storageClass: openebs-hostpath

            zaehlwerk:
              namespace: 'zaehlwerk-pr-{{ .number }}'
              hostname: 'zaehlwerk-pr-{{ .number }}.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              version: 'pr-{{ .number }}-{{ .head_sha }}'
              panel: false

            # A closed PR takes its workloads with it.
            cascadingDelete: true
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
