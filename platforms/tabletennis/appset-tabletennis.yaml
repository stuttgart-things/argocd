---
# The tabletennis platform — schmetterpause (league, with its CloudNativePG
# database) and zaehlwerk (live scorekeeping), plus the optional LED strip at the
# table. A platform of its own, beside homerun2 rather than inside it.
#
# Fans out across clusters labelled `tabletennis-platform: "true"` that are
# clusterbook-registered and whose ClusterSecretStore already exists. One parent
# app-of-apps per cluster, rendering apps/tabletennis/install, which delegates to
# apps/schmetterpause/install and apps/zaehlwerk/install.
#
# Opt a cluster out with label `tabletennis-platform/tabletennis: "false"`.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tabletennis-platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # `cascadingDelete: false` below is the other half, and it is threaded all the
  # way to the grandchildren the two sub-charts render.
  #
  # NOTE THAT THIS DOES NOT PROTECT THE DATABASE, and nothing here needs to: the
  # schmetterpause chart's own `database.protect` puts Prune=false + Delete=false
  # on the CNPG Cluster, because the PVC holds an ownerReference on it and a
  # prune would take the data with it. It is on by default and this bundle leaves
  # it there.
  generators:
    - clusters:
        selector:
          matchLabels:
            tabletennis-platform: "true"
          matchExpressions:
            - key: tabletennis-platform/tabletennis
              operator: NotIn
              values: ["false"]
            # Both applications publish over the cluster's own gateway and every
            # hostname is derived from the reserved FQDN. The operator stamps
            # allocation-ip="" on registration-only kind clusters, so Exists
            # alone over-matches.
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: Exists
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: NotIn
              values: [""]
            # schmetterpause's app + database credentials and zaehlwerk's panel
            # token all come from the ClusterSecretStore named below, and the
            # database BOOTSTRAPS from the Secret its ExternalSecret produces --
            # so without the store the CNPG Cluster never initialises at all.
            # Present this label only once the store exists and holds both
            # entries.
            # Gated on the VALUE, not on `Exists` the way storage-platform's
            # nfs-config gate is. Under Exists a label set to 'false' still
            # satisfies the gate -- and cluster.reference.yaml's own convention
            # is to write every label a cluster does not want as an explicit
            # 'false', which would then switch this on rather than off.
            - key: tabletennis-platform.stuttgart-things.com/secrets-config
              operator: In
              values: ["true"]
  template:
    metadata:
      # `-platform` suffix so the parent cannot collide with the chart-rendered
      # children, which derive from `applicationName`
      # (`tabletennis-<cluster>-schmetterpause` and friends).
      name: 'tabletennis-platform-{{ .name }}'
      annotations:
        # Informational only. Named after homerun2's wave (6) because zaehlwerk's
        # panel points at homerun2's Services -- but top-level Applications do
        # not order across appsets, and they do not need to: a panel URL that
        # does not resolve yet costs one log line per point, not a failure.
        argocd.argoproj.io/sync-wave: "7"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # v0.34.0 is the first tag that carries this chart at all, and the
        # `cascadingDelete` it passes -- see the same note in
        # platforms/homerun2/appset-homerun2.yaml.
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.71.0
        path: apps/tabletennis/install
        helm:
          releaseName: 'tabletennis-{{ .name }}'
          valuesObject:
            # MUST differ from this template's own metadata.name above.
            applicationName: 'tabletennis-{{ .name }}'
            project: '{{ .name }}'
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.71.0
            # No namespace: schmetterpause, zaehlwerk and the light-catcher each
            # land in one of their own.
            destination:
              server: '{{ .server }}'
            cascadingDelete: false

            # Hostnames come out as schmetterpause.<domain> and
            # zaehlwerk.<domain>.
            domain: '{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'

            # KEEP THIS GATEWAY INTERNAL. zaehlwerk has no authentication of its
            # own -- no token, no session -- so its route IS the access control:
            # anyone who can reach the hostname can start a match, score it, take
            # a point back, end it, and with the panel wired, take over the LED
            # strip. The clusterbook gateway is on the lab network, which is what
            # makes this acceptable here.
            gateway:
              name: '{{ .name }}-gateway'
              namespace: default
              sectionNameHTTPS: https
              sectionNameHTTP: http

            # A hand-registered cluster names ONE store for everything. A
            # ClusterStack names a store and an entry per owning app instead
            # (crossplane-configurations#464, xplane-cluster >= 0.18.0) and no
            # single store; the chart then reads secretSources, and this falls
            # back to homerun2's store only to satisfy the schema.
            secretStore:
              kind: ClusterSecretStore
              name: '{{ default (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/homerun2-secret-store") (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/secret-store") }}'
            secretSources:
              schmetterpause:
                store: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-store") }}'
                entry: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-key") }}'
              homerun2:
                store: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/homerun2-secret-store") }}'
                entry: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/homerun2-secret-key") }}'

            # Everything this platform knows about homerun2. Derives zaehlwerk's
            # two panel URLs and the light-catcher's Redis address. Blank it on a
            # cluster without homerun2 and zaehlwerk runs without a panel, which
            # upstream supports and reports nothing about.
            homerun2:
              namespace: '{{ default "homerun2" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/homerun2-namespace") }}'

            # Application VERSIONS are intentionally not overridden -- they
            # inherit apps/tabletennis/install/values.yaml, which Renovate keeps
            # bumped (schmetterpause and zaehlwerk each have their own
            # interface-surface rule, so those bumps are never auto-merged).
            schmetterpause:
              enabled: true
              values:
                database:
                  # Die Postgres-MAJOR der Rangliste, hier gepinnt statt vom
                  # Katalog geerbt. Der Katalog-Default in
                  # apps/schmetterpause/install ist fuer Consumer ohne Daten
                  # gedacht; ihn anzuheben ist fuer einen bestehenden CNPG-Cluster
                  # ein OFFLINE-Upgrade an Ort und Stelle (pg_upgrade). Ein Cluster
                  # mit der Buero-Rangliste soll das nur durch eine Aenderung
                  # bekommen, die genau das sagt: die Annotation `db-image-name`
                  # an seinem Cluster, oder dieser Fallback hier.
                  #
                  # Der Fallback ist bewusst EIN fester Wert und kein `default ""`:
                  # ein leerer String kaeme als imageName "" beim Cluster an.
                  # 18 ist, was alle tabletennis-Cluster heute fahren (dev2:
                  # 18.6, gelesen am 2026-10-08), also aendert sich beim Merge
                  # nichts. (schmetterpause#315, Befund aus den Runbooks)
                  imageName: '{{ default "ghcr.io/cloudnative-pg/postgresql:18" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-image-name") }}'
                  storage:
                    size: '{{ default "8Gi" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-storage-size") }}'
                    # Empty = the cluster's default StorageClass. Name one on a
                    # cluster that has two defaults.
                    #
                    # `default ""` is load-bearing, not decoration: the generator
                    # hands annotations over as map[string]interface{}, so `index`
                    # on an absent key returns an untyped nil, and a bare
                    # substitution prints it as the literal string "<no value>".
                    # That would reach the cluster as a StorageClass named
                    # `<no value>` and leave the PVC Pending. Every optional
                    # annotation below gets the same treatment.
                    storageClass: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/storage-class") }}'
                  # Backups and the rebuild path (stuttgart-things#2989), off unless
                  # a cluster asks. With no annotation every value below is the
                  # chart's own default, so a cluster that sets none renders exactly
                  # what it did before.
                  #
                  # The two `enabled` flags reach the chart as the STRINGS "true" /
                  # "false" -- an AppSet cannot produce a boolean -- and
                  # apps/tabletennis/install turns them into booleans before the
                  # schema sees them (tabletennis.schmetterpauseOverride, v0.53.0).
                  # Anything but "true" is off.
                  #
                  # Key and store default to the SHARED backup entry a ClusterStack
                  # already names (`shared-object-store-backup-secret-*`, derived
                  # by the tabletennis profile): no cluster gets a backup entry of
                  # its own, and the rebuild reads the same bucket the office writes.
                  # Setting either db-backup-* annotation wins. Both are read only
                  # when a flag is on -- the database chart renders nothing from
                  # them otherwise.
                  backup:
                    enabled: '{{ default "false" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-backup-enabled") }}'
                    endpointURL: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-backup-endpoint-url") }}'
                    destinationPath: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-backup-destination-path") }}'
                    # Empty = the Cluster name. NEVER the office's schmetterpause-db
                    # on another cluster: a rebuild archives under a name of its own.
                    serverName: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-backup-server-name") }}'
                    remoteKey: '{{ default (default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/shared-object-store-backup-secret-key")) (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-backup-remote-key") }}'
                    secretStore:
                      name: '{{ default (default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/shared-object-store-backup-secret-store")) (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-backup-secret-store") }}'
                  # Bring the Cluster up from another server's backups instead of
                  # initdb. Read ONCE, at creation: a cluster that comes up without
                  # this annotation has an empty ranking, and setting it afterwards
                  # changes nothing.
                  recovery:
                    enabled: '{{ default "false" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-recovery-enabled") }}'
                    sourceServerName: '{{ default "schmetterpause-db" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/db-recovery-source-server-name") }}'
                # Die Schalter der Anwendung selbst. Gleiche Form wie der
                # database-Block darueber: aus Cluster-Annotationen, als STRINGS,
                # die apps/tabletennis/install in Booleans wandelt
                # (tabletennis.schmetterpauseOverride). Alles ausser "true" ist aus.
                #
                # Frueher stand hier, Monitoring muesse ueber ein Overlay laufen,
                # weil ein AppSet keine Booleans erzeugen kann. Das stimmt nicht
                # mehr, seit die Umwandlung existiert -- und ein Overlay gab es nie,
                # weshalb KEIN AppSet-Cluster diese Funktionen hatte, waehrend der
                # handregistrierte homerun2-test1 sie alle trug (#3228).
                #
                # monitoring braucht die Prometheus-Operator-CRDs aus
                # observability-platform; ohne sie synct die Application nicht.
                # Nur auf Clustern einschalten, die den Stack fahren.
                monitoring:
                  enabled: '{{ default "false" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/monitoring-enabled") }}'
                # Kyverno-Policy, CLUSTERWEIT: sie gilt fuer schmetterpause und
                # alle schmetterpause-pr-*. Nur an EINER Stelle je Cluster
                # einschalten, sonst streiten zwei Applications um ein Objekt.
                policy:
                  enabled: '{{ default "false" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/policy-enabled") }}'
                # Die JSON-Flaeche, die das Zaehlwerk liest. Ohne Token registriert
                # die Anwendung die Routen gar nicht -- der Schalter IST die Flaeche.
                # vaultPath default: der Eintrag, den ein ClusterStack selbst anlegt
                # (schmetterpause/<cluster>-scoreboard, crossplane-configurations#464).
                scoreboard:
                  enabled: '{{ default "false" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/scoreboard-enabled") }}'
                  vaultPath: '{{ default (printf "%s-scoreboard" .name) (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/scoreboard-vault-path") }}'
                  vaultProperty: token
                # Der Kiosk -- der einzige Weg zurueck fuer jemanden, der PIN UND
                # Wiederherstellungscode verloren hat (schmetterpause ADR-0006).
                # Der Eintrag muss VOR dem Einschalten existieren, sonst hoert das
                # ganze App-Secret auf zu synchronisieren. Ein ClusterStack legt ihn
                # NOCH NICHT an, deshalb hier ohne Namens-Default.
                kiosk:
                  enabled: '{{ default "false" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/kiosk-enabled") }}'
                  vaultPath: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/kiosk-vault-path") }}'
                  vaultProperty: token
                # Der erste Admin, bei jedem Start vergeben (ADR-0008). Leer setzt
                # nichts, was nach dem ersten Durchlauf der Normalzustand ist.
                bootstrapAdmin: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/bootstrap-admin") }}'

            zaehlwerk:
              enabled: true
              # schmetterpause's own origin, so its live tab can read the match
              # stream once that exists. Upstream refuses the `*` wildcard, and
              # this is the only origin that will ever need it.
              allowedOrigins: 'https://schmetterpause.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'

            # The LED strip is physical hardware, so this is genuinely per
            # cluster. Templated from a label -- which is why the chart's
            # `enabled` accepts a string: an AppSet can only template strings,
            # and the string "false" is TRUTHY in a Go template, so the chart
            # compares it with toString rather than using it as a boolean.
            #
            # `default (dict)` survives a cluster with no labels and `toString`
            # survives `index` returning an untyped nil for an absent key --
            # without the latter the whole AppSet generates NOTHING, for every
            # cluster. Same coercions as platforms/network's
            # appset-trust-manager-bundle.
            lightCatcher:
              enabled: '{{ if eq (toString (index (default (dict) .metadata.labels) "tabletennis-platform/light-catcher")) "true" }}true{{ else }}false{{ end }}'
              # Empty = homerun2's wled-mock Service, which only exists where
              # that component is enabled. A real strip is the WLED device's own
              # address.
              wledEndpoint: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/wled-endpoint") }}'

            # The piezo board simulator, opt-in per cluster like the strip:
            # tabletennis-platform/piezo-sim: 'true'. It plays every match started
            # on that cluster's scoring page, and a won match is handed over --
            # so only for a cluster whose league is a demo or a test. Same
            # coercions as lightCatcher above.
            piezoSim:
              enabled: '{{ if eq (toString (index (default (dict) .metadata.labels) "tabletennis-platform/piezo-sim")) "true" }}true{{ else }}false{{ end }}'

            secrets:
              enabled: true
              # Empty on a ClusterStack cluster: the chart takes homerun2's
              # store from secretSources.
              clusterSecretStoreName: '{{ default "" (index (default (dict) .metadata.annotations) "tabletennis-platform.stuttgart-things.com/secret-store") }}'
              # The Vault entry holding homerun2's credentials -- the
              # light-catcher reads the SAME redis password as every other
              # homerun2 component, because it is the same Redis. Keep this in
              # step with homerun2-platform's `secret-key` annotation.
              vaultSecretName: '{{ default .name (index (default (dict) .metadata.annotations) "homerun2-platform.stuttgart-things.com/secret-key") }}'
              refreshInterval: 1h
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
