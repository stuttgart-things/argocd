---
# Per-PR preview environments for stuttgart-things/schmetterpause.
#
# Fans out across (clusters labelled schmetterpause-pr-preview: "true") ×
# (open PRs on schmetterpause carrying the `preview` label). One parent
# Application per cell, rendering the tabletennis bundle
# (apps/tabletennis/install) into its own namespace: schmetterpause from the
# PR's artefact with its own database, plus zaehlwerk at its released version,
# wired by the handover -- so a change to GET /api/players or POST /api/results
# is seen from the side that calls them.
#
# Why this app gets previews at all: Schmetterpause is a browser app whose
# premise is a colleague opening it on their phone in a break. "Does this look
# right on your phone?" is a question a preview URL answers and a diff does
# not. See stuttgart-things/schmetterpause#82, which also records the triggers
# that were weighed before building it.
#
# Prereqs not declared here:
#   - The target cluster registered as an Argo cluster with the label
#     schmetterpause-pr-preview: "true". One label per preview platform is the
#     convention here: homerun2-pr-preview, machinery-pr-preview and the two
#     machinery-catalog ones each select their own.
#
# What it does NOT need, because the platform already has it:
#   - No PAT of its own. Every preview ApplicationSet in this catalog reads
#     `homerun2-omni-pitcher-pat`, including the three machinery ones, which
#     watch entirely different repositories. It is the shared PR-reader token
#     under a name it outgrew; a token that can list pull requests on a public
#     repository can list them on all of them.
#   - No AppProject work. `cluster-projects` renders proj-<cluster> for every
#     cluster labelled auto-project, and that chart always grants
#     `name: <cluster>, namespace: '*'` — so schmetterpause-pr-* is allowed
#     without an extraDestination.
#   - No Vault work per preview. The ClusterSecretStores authenticate as the
#     cluster's ESO service account rather than per namespace, so an
#     ExternalSecret in a preview namespace resolves like any other; the
#     entries are the ones the cluster's tabletennis platform reads.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: schmetterpause-pr-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  schmetterpause-pr-preview: "true"
          - pullRequest:
              github:
                owner: stuttgart-things
                repo: schmetterpause
                tokenRef:
                  # The catalog's shared PR-reader token — the same secret the
                  # homerun2 and machinery preview sets read. Not a new one:
                  # a second PAT for the same job is a second thing to rotate,
                  # and the one that gets forgotten is the one nobody else
                  # depends on.
                  secretName: homerun2-omni-pitcher-pat
                  key: token
                # The `preview` label is the opt-in. CI builds an artefact for
                # every pull request — that is what makes the Trivy scan see
                # one — but a Renovate bump does not need a Postgres and a
                # hostname, so the environment waits for somebody to ask.
                labels:
                  - preview
              requeueAfterSeconds: 600
  template:
    metadata:
      name: 'schmetterpause-pr-{{ .number }}'
      labels:
        schmetterpause.stuttgart-things.com/pr: '{{ .number }}'
      # Without this finalizer Argo deletes the Application the moment the
      # generator drops the entry and orphans everything it managed — the
      # child Applications, the pods, and the CNPG Cluster with its PVC. With
      # it, prune runs over every managed resource first.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{ .name }}'
      # The parent renders Applications, so it must land in argocd on the
      # management cluster. The workload cluster has no argoproj.io CRDs, and
      # pointing the parent at it fails with "failed to discover server
      # resources for group version argoproj.io/v1alpha1".
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        targetRevision: main
        path: apps/tabletennis/install
        helm:
          releaseName: 'schmetterpause-pr-{{ .number }}'
          valuesObject:
            # The bundle (apps/tabletennis/install): schmetterpause and zaehlwerk
            # together, wired by the handover -- the one place the two meet
            # (zaehlwerk ADR-0004, schmetterpause ADR-0015). A preview of either
            # side shows the other too. Both in the preview's namespace.
            #
            # NOT the parent's name: the chart names its children
            # <applicationName>-schmetterpause / -zaehlwerk, and a child called
            # schmetterpause-pr-<n> would be the parent.
            applicationName: 'schmetterpause-pr-{{ .number }}-bundle'
            project: '{{ .name }}'
            destination:
              name: '{{ .name }}'
            domain: '{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
            gateway:
              name: '{{ .name }}-gateway'
              namespace: default
              sectionNameHTTPS: https
              sectionNameHTTP: http

            # Stores and entries as the cluster's tabletennis platform reads them
            # (annotations stamped by its ClusterStack), so a preview reads what
            # the cluster's permanent schmetterpause and zaehlwerk read -- and the
            # handover token from <entry>-scoreboard, one credential both sides of
            # the preview read.
            secretStore:
              kind: ClusterSecretStore
              name: '{{ default "vault-schmetterpause" (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-store") }}'
            secretSources:
              schmetterpause:
                store: '{{ default "vault-schmetterpause" (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-store") }}'
                entry: '{{ default .name (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/schmetterpause-secret-key") }}'
              homerun2:
                store: '{{ default "vault-homerun2" (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/homerun2-secret-store") }}'
                entry: '{{ default .name (index .metadata.annotations "tabletennis-platform.stuttgart-things.com/homerun2-secret-key") }}'

            # No panel and no LED strip: a test match must not take over the
            # real strip. Empty homerun2.namespace is the chart's "homerun2 is
            # not here" -- zaehlwerk runs without a panel, the light-catcher is
            # refused.
            homerun2:
              namespace: ""
            lightCatcher:
              enabled: false

            schmetterpause:
              namespace: 'schmetterpause-pr-{{ .number }}'
              # Under the gateway's wildcard certificate and wildcard DNS: one
              # label, derived from the cluster like every other preview.
              hostname: 'schmetterpause-pr-{{ .number }}.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              # The PR's artefact; only `pr-*` artefacts carry the seed Job, so the
                # preview fills itself with a demo field.
              version: 'pr-{{ .number }}-{{ .head_sha }}'
              # The receiving side of the handover; with zaehlwerk.handover on
              # (the default) this one switch wires both ends.
              scoreboard:
                enabled: true
              values:
                database:
                  enabled: true
                  instances: 1
                  # OFF here, and only here: a preview is meant to die with its
                  # pull request, and with the guard on the Postgres pod and its
                  # volume outlive it (observed on pr-187).
                  protect: false
                  storage:
                    # One PVC per open labelled PR -- an eighth of the permanent
                    # instance. Explicit class: this cluster has TWO defaults.
                    size: 1Gi
                    storageClass: openebs-hostpath

            zaehlwerk:
              namespace: 'schmetterpause-pr-{{ .number }}'
              hostname: 'zaehlwerk-schmetterpause-pr-{{ .number }}.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              # At the chart's released version: this preview is about schmetterpause.
              panel: false

            # A closed PR takes its workloads with it.
            cascadingDelete: true
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
