---
# Namespace sweep for schmetterpause previews: a Kyverno ClusterCleanupPolicy per
# labelled cluster that deletes schmetterpause-pr-* namespaces once they are older
# than an hour and have no Pods. CreateNamespace=true does not track the
# namespace for prune, so without it every closed PR leaves an empty namespace
# behind. Same chart and shape as the homerun2 sweeps
# (platforms/homerun2-pr-preview/appset-policies.yaml); the cluster's Kyverno
# cleanup controller needs pods get/list for it (security platform).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: schmetterpause-pr-preview-sweep
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            schmetterpause-pr-preview: "true"
  template:
    metadata:
      name: 'schmetterpause-preview-sweep-{{ .name }}'
    spec:
      project: '{{ .name }}'
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        targetRevision: main
        path: apps/homerun2/preview-sweep
        helm:
          releaseName: schmetterpause-preview-sweep
          valuesObject:
            name: schmetterpause-preview-sweep
            namespacePrefix: "schmetterpause-pr-*"
      destination:
        name: '{{ .name }}'
        namespace: kyverno
      ignoreDifferences:
        - group: kyverno.io
          kind: ClusterCleanupPolicy
          jqPathExpressions:
            - .spec.context[].apiCall.method
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
