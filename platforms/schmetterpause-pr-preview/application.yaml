---
# Bootstrap Application for the schmetterpause PR-preview platform bundle.
# Apply once on the management cluster (the one running Argo CD):
#   kubectl apply -f platforms/schmetterpause-pr-preview/application.yaml
#
# It renders platforms/schmetterpause-pr-preview/ via kustomize; the
# kustomization.yaml there lists the ApplicationSet, which then fans out to
# every cluster Secret labelled `schmetterpause-pr-preview: "true"`.
#
# This file is deliberately NOT listed in kustomization.yaml, so the rendered
# set does not contain its own bootstrap Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schmetterpause-pr-preview-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/argocd.git
    targetRevision: main
    path: platforms/schmetterpause-pr-preview
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
