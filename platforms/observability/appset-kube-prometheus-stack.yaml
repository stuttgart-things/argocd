---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-prometheus-stack-observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            observability-platform: "true"
          matchExpressions:
            # Grafana is routed through the cluster's own gateway, whose
            # hostname comes from the reservation — same gate as
            # platforms/network's cilium-gateway.
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: Exists
            # The Grafana admin and the Alertmanager webhook token come from a
            # ClusterSecretStore named in the annotations below. Present this
            # label only once that store exists on the cluster and its role
            # can read the entry — without it the stack would start with the
            # upstream default Grafana password and an Alertmanager whose
            # token file never appears. Same pattern as storage-platform's
            # nfs-config gate.
            - key: observability-platform.stuttgart-things.com/secrets-config
              operator: Exists
            - key: observability-platform/kube-prometheus-stack
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: kube-prometheus-stack-observability-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.56.0
        path: infra/kube-prometheus-stack/install
        helm:
          # Fixed, not derived. Argo passes the Application name to `helm
          # template` as the release name when none is set, and Helm caps that
          # at 53 characters — so this AppSet only worked for cluster names of
          # at most 17 characters. rancher-join-test5 (18) was the first to
          # exceed it on kube-prometheus-stack ("invalid release name"). The
          # chart does not use .Release.Name, and Argo keeps no Helm release,
          # so one constant is safe for every cluster.
          releaseName: kube-prometheus-stack
          valuesObject:
            project: '{{ .name }}'
            # MUST differ from this template's own metadata.name above. Both
            # land in `argocd`, so an inner Application with the generated
            # parent's name is the same object: the parent server-side-applies
            # the child spec over itself, the ApplicationSet controller puts
            # its own back a moment later, and the chart never deploys —
            # everything reports "successfully synced" meanwhile. That is what
            # the first version of this file did. The `-secrets` / `-httproute`
            # Applications derive from this name too.
            applicationName: kube-prometheus-stack-{{ .name }}
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.56.0
            destination:
              server: '{{ .server }}'
              namespace: monitoring
            clusterName: '{{ .name }}'
            prometheus:
              # Empty = the cluster's default StorageClass. Name one on
              # clusters with two defaults.
              storageClass: '{{ index .metadata.annotations "observability-platform.stuttgart-things.com/storage-class" }}'
              storageSize: '{{ default "10Gi" (index .metadata.annotations "observability-platform.stuttgart-things.com/storage-size") }}'
              retention: '{{ default "15d" (index .metadata.annotations "observability-platform.stuttgart-things.com/retention") }}'
              scrapeInterval: 60s
            grafana:
              enabled: true
              adminSecret: kube-prometheus-stack-grafana-admin
            alertmanager:
              enabled: true
              webhook:
                enabled: true
                url: '{{ index .metadata.annotations "observability-platform.stuttgart-things.com/alert-webhook-url" }}'
            externalSecrets:
              enabled: true
              secretStore:
                kind: ClusterSecretStore
                name: '{{ index .metadata.annotations "observability-platform.stuttgart-things.com/secret-store" }}'
              remoteKey: '{{ default .name (index .metadata.annotations "observability-platform.stuttgart-things.com/secret-key") }}'
              # The webhook token is the omni-pitcher's AUTH_TOKEN, identical on
              # every cluster — so a cluster built from a ClusterStack reads it
              # from the shared entry (_omni-pitcher) instead of its own, which
              # would hold nothing or a generated value and 401 every alert.
              # Unset keeps reading remoteKey: homerun2-test1 is unchanged.
              webhookRemoteKey: '{{ default "" (index .metadata.annotations "observability-platform.stuttgart-things.com/alert-webhook-secret-key") }}'
            httpRoute:
              enabled: true
              hostname: 'grafana.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." }}'
              gateway:
                name: '{{ .name }}-gateway'
                namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
