---
# Bootstrap Application for the observability platform bundle.
# Apply once on the management cluster (the one running Argo CD):
#   kubectl apply -f platforms/observability/application.yaml
#
# It renders platforms/observability/ via kustomize (the kustomization.yaml in
# that directory lists the ApplicationSets). ApplicationSets then fan out to
# every cluster Secret labelled `observability-platform: "true"`.
#
# This file itself is intentionally NOT listed in kustomization.yaml so the
# rendered set does not contain the bootstrap Application (no self-reference).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/stuttgart-things/argocd.git
    targetRevision: main
    path: platforms/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
