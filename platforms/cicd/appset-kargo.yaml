apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kargo-cicd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # Kargo's control-plane and CRDs stay put either way. See README.md, "Opt-
  # out and teardown".
  generators:
    - clusters:
        selector:
          matchLabels:
            cicd-platform: "true"
          matchExpressions:
            - key: cicd-platform/kargo
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: kargo-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.57.0
        path: cicd/kargo/install
        helm:
          valuesObject:
            project: '{{ .name }}'
            destination:
              server: '{{ .server }}'
              namespace: kargo
            # Derive external hostname from the cluster's clusterbook FQDN
            # annotation (e.g. "*.philly.sthings-vsphere.labul.sva.de" →
            # "kargo.philly.sthings-vsphere.labul.sva.de"). Must match the
            # HTTPRoute hostname + certificate SAN — kargo's API performs a
            # cookie Host check against this. Falls back to the chart default
            # "kargo.example.com" on clusters without the annotation.
            api:
              host: 'kargo.{{ index .metadata.annotations "clusterbook.stuttgart-things.com/fqdn" | trimPrefix "*." | default "example.com" }}'
            # Tell the upstream chart to consume an existing Secret named
            # `kargo-admin` in the kargo namespace instead of rendering its
            # own from inline passwordHash/tokenSigningKey values. The chart
            # guards its Secret template with `{{ if not .Values.api.secret.name }}`
            # — setting this key suppresses the render AND the required check.
            # The api Deployment's envFrom.secretRef.name falls back to this
            # value too, so one knob does both.
            #
            # Keys expected in the Secret: ADMIN_ACCOUNT_PASSWORD_HASH
            # (bcrypt, $2a$ variant) + ADMIN_ACCOUNT_TOKEN_SIGNING_KEY (32
            # chars). Created per-cluster out-of-band (see platform README) --
            # or from Vault, below.
            extraValues:
              api:
                secret:
                  name: kargo-admin
            # kargo-admin FROM VAULT on a cluster that says it can: a
            # ClusterStack with the `kargo` profile writes kargo/<cluster> and
            # derives the gate cicd-platform.stuttgart-things.com/secrets-config
            # plus the store and entry annotations below
            # (stuttgart-things/stuttgart-things#3232). The store is passed ONLY
            # when the gate is "true" -- everywhere else it is "" and the chart
            # renders nothing new, so a cluster with a hand-made kargo-admin is
            # untouched. A string rather than a flag, because this template can
            # only produce strings.
            #
            # Not a selector: gating the AppSet itself would make the gate a
            # new opt-in label every form that writes cicd-platform labels has
            # to answer for, and would drop kargo from every cluster without it.
            secrets:
              clusterSecretStoreName: '{{ if eq (index .metadata.labels "cicd-platform.stuttgart-things.com/secrets-config" | default "") "true" }}{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/kargo-secret-store" | default "" }}{{ end }}'
              vaultSecretName: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/kargo-secret-key" | default .name }}'
            # The tag above, again: the secrets Application reads the same
            # release the install chart comes from. Its own renovate comment,
            # so a bump moves both.
            catalog:
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.57.0
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
