# zot OCI registry (official chart) with a Gateway API route on zot.<fqdn>:
# anonymous pull, push for htpasswd users, search + UI.
#
# OPT-IN (cicd-platform/zot: "true") and clusterbook clusters only: the route
# needs the <cluster>-gateway Gateway and the reserved FQDN.
#
# Annotations (cicd-platform.stuttgart-things.com/...):
#   secret-store        ClusterSecretStore with the KV entry. REQUIRED -- the
#                       secrets sub-Application fails without it.
#   zot-secret-key      KV entry (default zot), property htpasswd (bcrypt lines)
#   zot-storage-size    PVC (default 50Gi)
#   zot-anonymous-read  'false' = authenticated pulls only
#   storage-class       PVCs (default openebs-hostpath)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zot-cicd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            cicd-platform: "true"
            cicd-platform/zot: "true"
          matchExpressions:
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: Exists
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: NotIn
              values: [""]
  template:
    metadata:
      # `-platform` suffix so the parent cannot share a name with the chart's
      # children (`zot-<cluster>`, `zot-<cluster>-secrets`).
      name: 'zot-platform-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "6"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # HEAD until the first release that carries cicd/zot (a tag pin before
        # that points at a path that does not exist there). Then pin it and
        # catalog.targetRevision below, like the other AppSets here.
        targetRevision: HEAD
        path: cicd/zot/install
        helm:
          releaseName: 'zot-{{ .name }}'
          # `default ""`: missingkey=error does not cover `index`, and an
          # absent annotation still has to read as "not set".
          values: |
            {{- $a := default (dict) .metadata.annotations }}
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              targetRevision: HEAD
            project: '{{ .name }}'
            applicationName: 'zot-{{ .name }}'
            destination:
              server: '{{ .server }}'
              namespace: zot
            cascadingDelete: false
            hostname: 'zot.{{ trimPrefix "*." (index $a "clusterbook.stuttgart-things.com/fqdn") }}'
            gateway:
              name: '{{ .name }}-gateway'
              namespace: default
            storageClass: '{{ default "openebs-hostpath" (index $a "cicd-platform.stuttgart-things.com/storage-class") }}'
            secrets:
              clusterSecretStoreName: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/secret-store") }}'
              vaultSecretName: '{{ default "zot" (index $a "cicd-platform.stuttgart-things.com/zot-secret-key") }}'
            storageSize: '{{ default "50Gi" (index $a "cicd-platform.stuttgart-things.com/zot-storage-size") }}'
            anonymousRead: {{ ne (default "" (index $a "cicd-platform.stuttgart-things.com/zot-anonymous-read")) "false" }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
