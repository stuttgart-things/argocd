apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: crossplane-configs-cicd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            cicd-platform: "true"
          matchExpressions:
            - key: cicd-platform/crossplane
              operator: NotIn
              values: ["false"]
            # ONE CONFIGURATION FAMILY PER CLUSTER. A cluster that opted into
            # the flux family (appset-crossplane-configs-flux.yaml,
            # cicd/crossplane/configs/profiles/flux.yaml) must NOT also get this
            # default crossplane-configurations/* list: both carry a CR named
            # `volume-claim` from different sources, and a duplicate lock node
            # takes every package on the cluster to Healthy=False. NotIn, so a
            # cluster without the label keeps getting this AppSet unchanged.
            - key: cicd-platform/crossplane-configs-flux
              operator: NotIn
              values: ["true"]
  template:
    metadata:
      name: crossplane-configs-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: '{{ .name }}'
      destination:
        server: '{{ .server }}'
        namespace: crossplane-system
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.89.0
        path: cicd/crossplane/configs
        helm:
          releaseName: 'crossplane-configs-{{ .name }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
