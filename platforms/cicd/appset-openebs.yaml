apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: openebs-cicd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # The StorageClass / DaemonSets / namespace stay put either way. See
  # README.md, "Opt-out and teardown".
  generators:
    - clusters:
        selector:
          matchLabels:
            cicd-platform: "true"
          matchExpressions:
            - key: cicd-platform/openebs
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: openebs-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.8.1
        path: infra/openebs/install
        helm:
          valuesObject:
            project: '{{ .name }}'
            destination:
              server: '{{ .server }}'
              namespace: openebs
            # cicd platform expects openebs-hostpath to be the cluster's
            # default StorageClass. Without this, PVCs created on the target
            # cluster without an explicit storageClassName (e.g. dapr-scheduler's
            # volumeClaimTemplates) would stay Pending forever.
            defaultStorageClass: true
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
