# dapr workflow workers (stuttgart-things/argocd#658): backstage
# template-execution (Backstage `request-vm` -> create-terraform-vm, the "VM
# build worker") and cluster-build-watch (cluster builds -> homerun2), each with
# its kro trigger, plus a redis state store and ESO secrets. What
# cicd-machinery-test5 runs through Flux today (apps/dapr in the flux repo),
# so a Backstage-built cluster can take it over (stuttgart-things#3796).
#
# OPT-IN, one gate for the bundle and one value label per worker:
#   cicd-platform/dapr-workflows: "true"      the parent (redis + secrets)
#   cicd-platform/template-execution: "true"  read as a value, not a selector
#   cicd-platform/cluster-build-watch: "true" read as a value, not a selector
# Needs dapr and kro (both opt-out in this bundle) and trust-manager's
# `cluster-trust-bundle` ConfigMap in the worker namespaces.
#
# Annotations (cicd-platform.stuttgart-things.com/...), the secret ones derived
# by the ClusterStack from the AppSecretProfile dapr-workflows:
#   dapr-workflows-secret-store/-key  own entry (redisPassword); falls back to
#                                     the single `secret-store`
#   shared-<name>-secret-store/-key   git-pat (githubToken), backstage-token
#                                     (backstageToken), homerun-pitch
#                                     (homerunAuthToken), machinery-grpc
#                                     (machineryToken; its presence turns
#                                     machinery auth on)
#   homerun-pitch-url                 omni-pitcher /pitch URL; empty: no homerun sink
#   cluster-build-watch-discovery     "true": the worker discovers ClusterStacks
#                                     on machinery itself (#3831) -- ONE
#                                     cluster per fleet, or cards come twice
#   cluster-build-watch-discovery-exclude      <ns>/<name> globs, comma-separated
#   cluster-build-watch-discovery-argo-server  machinery on the Argo CD cluster
#   backstage-url                     Backstage the template worker drives
#   backstage-runs-path               directory of BackstageTemplateRun files
#                                     (request-vm) in stuttgart-things, applied
#                                     by Argo CD; empty: none (#3796)
#   storage-class                     redis PVC (default openebs-hostpath)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: dapr-workflows-cicd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            cicd-platform: "true"
            cicd-platform/dapr-workflows: "true"
  template:
    metadata:
      # `-platform` suffix: the chart's children derive from applicationName
      # (`dapr-workflows-<cluster>-...`), and a child with the parent's name
      # would be the same object (see platforms/homerun2).
      name: 'dapr-workflows-platform-{{ .name }}'
      annotations:
        argocd.argoproj.io/sync-wave: "6"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # HEAD until the first release that carries cicd/dapr-workflows; a pin
        # at an older tag points at a path that does not exist there (the four
        # AppSets that were broken at v0.82.2). Then pin it, and
        # catalog.targetRevision below, like the other AppSets here.
        targetRevision: HEAD
        path: cicd/dapr-workflows/install
        helm:
          releaseName: 'dapr-workflows-{{ .name }}'
          # `default ""`: missingkey=error does not cover `index`, and an absent
          # label or annotation still has to read as "not set".
          values: |
            {{- $l := .metadata.labels }}
            {{- $a := default (dict) .metadata.annotations }}
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              targetRevision: HEAD
            project: '{{ .name }}'
            applicationName: 'dapr-workflows-{{ .name }}'
            destination:
              server: '{{ .server }}'
            cascadingDelete: false
            secrets:
              # Derived by the ClusterStack from the AppSecretProfile
              # dapr-workflows: own store/entry, and per shared key its own.
              clusterSecretStoreName: '{{ default (default "" (index $a "cicd-platform.stuttgart-things.com/secret-store")) (index $a "cicd-platform.stuttgart-things.com/dapr-workflows-secret-store") }}'
              vaultSecretName: '{{ default "dapr-workflows" (index $a "cicd-platform.stuttgart-things.com/dapr-workflows-secret-key") }}'
              shared:
                githubToken:
                  clusterSecretStoreName: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/shared-git-pat-secret-store") }}'
                  vaultSecretName: '{{ default "_git-pat" (index $a "cicd-platform.stuttgart-things.com/shared-git-pat-secret-key") }}'
                backstageToken:
                  clusterSecretStoreName: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/shared-backstage-token-secret-store") }}'
                  vaultSecretName: '{{ default "_backstage-token" (index $a "cicd-platform.stuttgart-things.com/shared-backstage-token-secret-key") }}'
                homerunAuthToken:
                  clusterSecretStoreName: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/shared-homerun-pitch-secret-store") }}'
                  vaultSecretName: '{{ default "_homerun-pitch" (index $a "cicd-platform.stuttgart-things.com/shared-homerun-pitch-secret-key") }}'
                machineryToken:
                  clusterSecretStoreName: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/shared-machinery-grpc-secret-store") }}'
                  vaultSecretName: '{{ default "_machinery-grpc" (index $a "cicd-platform.stuttgart-things.com/shared-machinery-grpc-secret-key") }}'
            redis:
              storageClass: '{{ default "openebs-hostpath" (index $a "cicd-platform.stuttgart-things.com/storage-class") }}'
            templateExecution:
              enabled: {{ eq (default "" (index $l "cicd-platform/template-execution")) "true" }}
              backstageURL: '{{ default "https://backstage.sthings-platform.4sthings.tiab.ssc.sva.de" (index $a "cicd-platform.stuttgart-things.com/backstage-url") }}'
              runs:
                path: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/backstage-runs-path") }}'
            clusterBuildWatch:
              enabled: {{ eq (default "" (index $l "cicd-platform/cluster-build-watch")) "true" }}
              homerunPitchURL: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/homerun-pitch-url") }}'
              machineryAuth:
                enabled: {{ ne (default "" (index $a "cicd-platform.stuttgart-things.com/shared-machinery-grpc-secret-key")) "" }}
              discovery:
                enabled: {{ eq (default "" (index $a "cicd-platform.stuttgart-things.com/cluster-build-watch-discovery")) "true" }}
                exclude: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/cluster-build-watch-discovery-exclude") }}'
                argoServer: '{{ default "" (index $a "cicd-platform.stuttgart-things.com/cluster-build-watch-discovery-argo-server") }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
