---
# Komoplane for the cicd platform: a read-only browser for Crossplane claims,
# composites and managed resources. The ArgoCD counterpart of
# stuttgart-things/flux cicd/komoplane.
#
# OPT-IN, an explicit `cicd-platform/komoplane: "true"` -- unlike most of this
# profile, which is opt-out. Komoplane SHIPS NO AUTHENTICATION OF ANY KIND:
# whatever the Gateway exposes is world-readable, every claim and managed
# resource on the cluster included. That is a decision to make per cluster,
# not one a cluster should inherit by carrying the umbrella label.
#
# Also requires Crossplane (shares its opt-out key): komoplane's whole UI is a
# view onto Crossplane CRs. Without them it starts, serves, and shows an empty
# tree while every object reports healthy.
#
# The HTTPRoute (komoplane.<fqdn> on the clusterbook `<cluster>-gateway`) is a
# sub-Application of the install chart, rendered only when the cluster has a
# clusterbook fqdn annotation. Without one komoplane is installed with no
# route -- port-forward to svc/komoplane:8090 -- rather than with a route whose
# parentRef resolves nowhere and sits at Accepted=False without explaining
# itself.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: komoplane-cicd
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  generators:
    - clusters:
        selector:
          matchLabels:
            cicd-platform: "true"
            # Opt-IN, so an explicit "true" rather than a NotIn ["false"].
            cicd-platform/komoplane: "true"
          matchExpressions:
            # Inherit the crossplane opt-out: with Crossplane switched off
            # there is nothing for komoplane to show.
            - key: cicd-platform/crossplane
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: 'komoplane-cicd-{{ .name }}'
      annotations:
        # After crossplane (0). Informational only -- top-level Applications
        # do not order across appsets.
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.105.1
        path: cicd/komoplane/install
        helm:
          releaseName: 'komoplane-{{ .name }}'
          valuesObject:
            # MUST differ from this template's own metadata.name above, or the
            # inner Application is the same object as the parent and neither
            # ever deploys while both report "successfully synced". The route
            # Application is `<this>-httproute`.
            applicationName: 'komoplane-{{ .name }}'
            project: '{{ .name }}'
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.105.1
            destination:
              server: '{{ .server }}'
              namespace: komoplane
            # `chartVersion` is intentionally NOT set -- it inherits
            # cicd/komoplane/install/values.yaml, which Renovate keeps bumped
            # and which tracks the version stuttgart-things/flux runs.
            httpRoute:
              # A string ("true"/"false") -- the chart turns it into a flag.
              enabled: '{{ if (index (default (dict) .metadata.annotations) "clusterbook.stuttgart-things.com/fqdn") }}true{{ else }}false{{ end }}'
              hostname: '{{ with (index (default (dict) .metadata.annotations) "clusterbook.stuttgart-things.com/fqdn") }}komoplane.{{ trimPrefix "*." . }}{{ end }}'
              # KEEP THIS GATEWAY INTERNAL -- see the header.
              gateway:
                name: '{{ .name }}-gateway'
                namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
