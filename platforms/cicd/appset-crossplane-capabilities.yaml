            # over itself and nothing deploys.
            applicationName: 'cxp-cap-{{ .name }}'
            project: '{{ .name }}'
            destination:
              server: '{{ .server }}'
              namespace: crossplane-system
            # ./harvester-vm is read from git at the same release as this chart.
            catalog:
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.96.0
            # chartVersion is NOT set here: it inherits the chart's values.yaml,
            # which Renovate keeps bumped.
