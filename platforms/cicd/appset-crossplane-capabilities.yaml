              harvesterVm:
                enabled: true
                environment: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/crossplane-cap-harvester-environment" | default "default" }}'
                providerConfigRef: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/crossplane-cap-harvester-provider-config" | default "in-cluster" }}'
                storageClassName: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/crossplane-cap-harvester-storage-class" | default "harvester-longhorn" }}'
                namespace: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/crossplane-cap-harvester-namespace" | default "vms" }}'
                networkName: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/crossplane-cap-harvester-network" | default "default/vms" }}'
                imageId: '{{ index (default (dict) .metadata.annotations) "cicd-platform.stuttgart-things.com/crossplane-cap-harvester-image" | default "default/image-ubuntu" }}'
