  template:
    metadata:
      name: 'crossplane-cap-harvester-vm-{{ .name }}'
      annotations:
        # Wave 1: after providers/functions/configs (wave 0) and baseline.
        argocd.argoproj.io/sync-wave: "1"
    spec:
