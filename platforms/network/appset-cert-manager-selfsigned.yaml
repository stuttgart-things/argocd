apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-selfsigned-clusterbook
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            network-platform: "true"
          matchExpressions:
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: Exists
            # Latched by clusterbook-operator >= v0.21.0 once the cluster's
            # /readyz answered 200 (clusterbook-operator#119) -- allocation-ip
            # alone only says an IP was booked, not that the API server is up.
            - key: clusterbook.stuttgart-things.com/cluster-ready
              operator: In
              values: ["true"]
            - key: network-platform/cert-manager-selfsigned
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: cert-manager-selfsigned-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: '{{ .name }}'
      destination:
        name: '{{ .name }}'
        namespace: cert-manager
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.70.0
        path: infra/cert-manager/selfsigned
        helm:
          valuesObject:
            name: selfsigned
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
