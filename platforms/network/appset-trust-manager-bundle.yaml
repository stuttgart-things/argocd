apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: trust-manager-bundle-clusterbook
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            network-platform: "true"
          matchExpressions:
            - key: clusterbook.stuttgart-things.com/allocation-ip
              operator: Exists
            - key: network-platform/trust-manager-bundle
              operator: NotIn
              values: ["false"]
  template:
    metadata:
      name: trust-manager-bundle-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: '{{ .name }}'
      destination:
        name: '{{ .name }}'
        namespace: cert-manager
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.20.0
        path: infra/trust-manager/bundle
        helm:
          valuesObject:
            # Append a source pointing at the Vault PKI CA Secret
            # (`vault-pki-ca` in cert-manager) when this cluster's gateway
            # certificate is signed by Vault — otherwise the cluster ends up
            # with a trust bundle that cannot verify its own gateway.
            #
            # TWO ways a cluster gets a Vault issuer, and the label only knows
            # about the first:
            #   1. `network-platform/cert-manager-vault-pki=true` — this AppSet
            #      family deploys the `vault-pki` ClusterIssuer itself.
            #   2. the ClusterStack XR's `vaultIssuer` branch creates
            #      `vault-pki-k8s` (tokenless, Kubernetes auth) and the cluster
            #      carries `wildcard-issuer-name: vault-pki*` while the label
            #      above stays 'false' — deliberately, because the AppSet's
            #      issuer would want a static token Secret on the target.
            # Case 2 produced the Secret all the same, so gate on either.
            #
            # PRECONDITION: `vault-pki-ca` must exist in the trust namespace on
            # the target. A Bundle source pointing at a missing Secret makes
            # trust-manager stop syncing the WHOLE bundle, so do not set the
            # annotation on a cluster that has no Vault CA.
            #
            # Templated as a quoted string so the manifest stays valid YAML for
            # kustomize build; ArgoCD's goTemplate substitutes the value at
            # App-create time before the chart renders. `index` (not `hasKey`)
            # because `.metadata.annotations` is map[string]string. The two
            # coercions are load-bearing: `default (dict)` survives a cluster
            # with no annotations at all, and `toString` survives `index`
            # returning an untyped nil for an absent key — without it
            # `hasPrefix` aborts the template with "invalid value; expected
            # string" and the AppSet then generates NOTHING, for every
            # cluster. Both cases verified against Go template + sprig.
            includeVaultPkiCa: '{{ if or (eq (toString (index .metadata.labels "network-platform/cert-manager-vault-pki")) "true") (hasPrefix "vault-pki" (toString (index (default (dict) .metadata.annotations) "clusterbook.stuttgart-things.com/wildcard-issuer-name"))) }}true{{ else }}false{{ end }}'
            bundles:
              - name: cluster-trust-bundle
                spec:
                  sources:
                    - useDefaultCAs: true
                    - secret:
                        name: cluster-ca-secret
                        key: ca.crt
                  target:
                    configMap:
                      key: trust-bundle.pem
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
