apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-install-security
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # Every ClusterSecretStore and ExternalSecret stays put either way. See
  # README.md, "Opt-out and teardown".
  generators:
    - clusters:
        selector:
          matchLabels:
            security-platform: "true"
          matchExpressions:
            # Opt-out, wie in 33 der uebrigen AppSets und wie platforms/README.md
            # es beschreibt: der Dach-Schalter reicht, eine Komponente wird nur
            # durch ein explizites "false" abgewaehlt. Vorher stand hier ein
            # zweites matchLabels — damit fiel ein Cluster mit
            # `security-platform: 'true'` und ohne Komponentenlabel stillschweigend
            # durch, ohne Meldung und entgegen der dokumentierten Konvention.
            - key: security-platform/external-secrets
              operator: NotIn
              values:
                - "false"
  template:
    metadata:
      name: external-secrets-install-security-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.8.1
        path: infra/external-secrets/install
        helm:
          valuesObject:
            project: '{{ .name }}'
            # Override the chart's default child-Application name (sha8 of
            # destination.server) so the inner Application carries the
            # `-security` suffix and never collides with a per-cluster overlay
            # that may also reference infra/external-secrets/install.
            applicationName: external-secrets-security-{{ .name }}
            destination:
              server: '{{ .server }}'
              namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
