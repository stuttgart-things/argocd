apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-install-security
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # No `preserveResourcesOnDeletion` here, deliberately. It reads like it
  # protects the workloads this AppSet rolls out; it does not. What it
  # protects is the child *Application* -- and keeping that around is
  # exactly how a deregistered cluster leaves an orphan behind that then
  # blocks its own AppProject from finalizing (see #324).
  #
  # The workloads are safe without it: the Application this chart renders
  # carries no resources-finalizer, so deleting it never cascades into the
  # CRDs, policies, StorageClasses or namespaces it manages. Verified per
  # chart -- `apps/machinery/install` is the one that DOES render a
  # finalizer, which is why appset-machinery.yaml keeps the flag.
  generators:
    - clusters:
        selector:
          matchLabels:
            security-platform: "true"
          matchExpressions:
            # Opt-out, wie in 33 der uebrigen AppSets und wie platforms/README.md
            # es beschreibt: der Dach-Schalter reicht, eine Komponente wird nur
            # durch ein explizites "false" abgewaehlt. Vorher stand hier ein
            # zweites matchLabels — damit fiel ein Cluster mit
            # `security-platform: 'true'` und ohne Komponentenlabel stillschweigend
            # durch, ohne Meldung und entgegen der dokumentierten Konvention.
            - key: security-platform/external-secrets
              operator: NotIn
              values:
                - "false"
  template:
    metadata:
      name: external-secrets-install-security-{{ .name }}
      annotations:
        argocd.argoproj.io/sync-wave: "-10"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.8.1
        path: infra/external-secrets/install
        helm:
          valuesObject:
            project: '{{ .name }}'
            # Override the chart's default child-Application name (sha8 of
            # destination.server) so the inner Application carries the
            # `-security` suffix and never collides with a per-cluster overlay
            # that may also reference infra/external-secrets/install.
            applicationName: external-secrets-security-{{ .name }}
            destination:
              server: '{{ .server }}'
              namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
