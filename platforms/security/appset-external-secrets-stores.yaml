---
# One Application per cluster rendering ALL of that cluster's ClusterSecretStores.
#
# It replaces the hand-written per-mount Applications in the monorepo
# (clusters/labul/vsphere/platform-sthings/argocd/<cluster>/cluster-secret-store*.yaml),
# which differ from each other in exactly one field — the KV mount. The mounts
# now come off the cluster Secret, so a new cluster brings its own list with it
# instead of being copied into four files
# (crossplane-configurations#438, decision 5.3/5.6).
#
# Everything else about the login is shared by construction and not configurable
# per mount: the Vault server, the k8s-auth mount `<cluster>-eso`, the `eso`
# ServiceAccount in external-secrets. That is what those Applications already
# had in common.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets-stores-security
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - clusters:
        selector:
          matchLabels:
            security-platform: "true"
          matchExpressions:
            # Opt-IN, unlike the sibling AppSets — and for the same reason the
            # observability stack gates on `secrets-config`: a store whose Vault
            # role cannot read the mount reports Valid / Ready=True while every
            # ExternalSecret under it fails with a 400. Present this label only
            # once the auth mount exists AND its role carries the read policy
            # for every mount listed in the annotation below.
            - key: security-platform/external-secrets-stores
              operator: In
              values: ["true"]
  template:
    metadata:
      name: external-secrets-stores-security-{{ .name }}
      annotations:
        # After external-secrets itself (-10) and before anything that reads a
        # secret: a store that arrives late makes every ExternalSecret retry,
        # which is slow rather than broken, but noisy in exactly the minutes
        # somebody is watching a new cluster come up.
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: '{{ .name }}'
      destination:
        server: '{{ .server }}'
        namespace: external-secrets
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.42.0
        path: infra/external-secrets/cluster-secret-store-vault
        helm:
          releaseName: cluster-secret-stores
          valuesObject:
            # Comma-separated, straight from the annotation — the chart splits
            # it. A list cannot be built here: valuesObject is typed YAML and
            # the ApplicationSet templater only substitutes strings.
            mounts: '{{ index .metadata.annotations "external-secrets.stuttgart-things.com/kv-mounts" }}'
            server: '{{ index .metadata.annotations "clusterbook.stuttgart-things.com/vault-server" }}'
            version: v2
            caProvider:
              type: Secret
              name: vault-pki-ca
              namespace: cert-manager
              key: ca.crt
            auth:
              kubernetes:
                # The convention the Platform's VaultK8sAuth creates:
                # <cluster>-<authName>, and the auth is called eso.
                mountPath: '{{ .name }}-eso'
                role: eso
                serviceAccountRef:
                  name: eso
                  namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ServerSideApply=true
