---
# sops-secrets-operator for the security platform: turns a SopsSecret (an
# age-encrypted blob committed to git) into a real Secret. The Argo CD
# counterpart of flux/apps/sops-secrets-operator.
#
# OPT-IN, an explicit `security-platform/sops-secrets-operator: "true"`, unlike
# the opt-out ESO/Kyverno AppSets here: the operator decrypts nothing without an
# age key, and the key is per environment -- the same reasoning as
# external-secrets-stores. A cluster without the label renders nothing.
#
# ONE parent per cluster, rendering apps/sops-secrets-operator/install:
#   - `sops-secrets-operator-<cluster>`: the published kustomize artifact in
#     sops-secrets-operator-system (namespace NOT overridden -- the base names
#     it throughout);
#   - `sops-secrets-operator-<cluster>-age-key` (sync-wave 1), ONLY when the
#     cluster Secret carries the `sops-age-key-store` annotation: an
#     ExternalSecret materialising `sops-age-key` (key `age.agekey`) in the
#     operator's namespace. Without the annotation the key is provisioned out of
#     band, as in the flux catalog.
#
# NO cert-manager dependency: the published artifact is rendered from the
# operator's kcl/ profile and ships no webhook and no Certificate (verified
# against v0.9.2) -- flux's "webhook needs cert-manager" comment describes the
# kubebuilder config/default, not this artifact. See the chart README.
#
# PRECONDITIONS for the age-key annotation, not in the selector: external-secrets
# (`security-platform/external-secrets`) and the named store able to read the
# entry -- otherwise the -age-key Application fails on a missing CRD or the
# ExternalSecret stays SecretSyncedError; the operator itself runs regardless.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sops-secrets-operator-security
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  # Deliberately no `preserveResourcesOnDeletion`: this AppSet generates an
  # app-of-apps parent, so what the flag preserves are child *Applications*,
  # not workloads -- and those orphans then block their AppProject (#324).
  # The operator, its CRDs and every generated Secret stay put either way.
  generators:
    - clusters:
        selector:
          matchLabels:
            security-platform: "true"
          matchExpressions:
            # Opt-IN, see the header.
            - key: security-platform/sops-secrets-operator
              operator: In
              values: ["true"]
  template:
    metadata:
      name: 'sops-secrets-operator-security-{{ .name }}'
      annotations:
        # After external-secrets (-10), with the stores (-5). Informational
        # only -- top-level Applications from different AppSets do not wait for
        # each other; the children's retry covers a late store.
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: '{{ .name }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      source:
        repoURL: https://github.com/stuttgart-things/argocd.git
        # renovate: datasource=github-tags depName=stuttgart-things/argocd
        targetRevision: v0.83.0
        path: apps/sops-secrets-operator/install
        helm:
          releaseName: 'sops-secrets-operator-{{ .name }}'
          valuesObject:
            # MUST differ from this template's own metadata.name above, or the
            # inner Application is the same object as the parent and neither
            # ever deploys while both report "successfully synced".
            applicationName: 'sops-secrets-operator-{{ .name }}'
            project: '{{ .name }}'
            cascadingDelete: false
            catalog:
              repoURL: https://github.com/stuttgart-things/argocd.git
              # renovate: datasource=github-tags depName=stuttgart-things/argocd
              targetRevision: v0.83.0
            destination:
              server: '{{ .server }}'
              namespace: sops-secrets-operator-system
            # `version` is intentionally NOT set -- it inherits the chart's
            # values.yaml, which Renovate keeps bumped. A second copy here is
            # the drift flux's requirements.yaml warns about.
            ageKey:
              externalSecret:
                secretStore:
                  kind: ClusterSecretStore
                  # Empty (annotation absent) = no ExternalSecret: an AppSet
                  # can only template strings, so the store name is the switch.
                  name: '{{ default "" (index (default (dict) .metadata.annotations) "security-platform.stuttgart-things.com/sops-age-key-store") }}'
                # Entry NAME under the store's mount, not a path.
                remoteKey: '{{ default "sops-age-key" (index (default (dict) .metadata.annotations) "security-platform.stuttgart-things.com/sops-age-key-secret-key") }}'
                property: '{{ default "age.agekey" (index (default (dict) .metadata.annotations) "security-platform.stuttgart-things.com/sops-age-key-property") }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
